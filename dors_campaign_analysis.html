        <div class="seasonality-view hidden" data-view="hourly">${hourlySeasonalityHTML(seasonalityHourly, pmCfg.fmt, currency)}</div>
      </div>
    </div>`;

  const totalSpend = snap.spend || 0;
  const dailySpend = b2.length ? totalSpend / b2.length : 0;
  const spendBlock = `<div class="insight-block insight-block-spend">
    <div class="insight-header">
      <span class="insight-metric-name">Campaign spend</span>
      <span class="insight-values">${currency} ${Math.round(totalSpend).toLocaleString()} over ${labels.length} days</span>
      <span class="insight-badge insight-badge-neutral">${currency} ${Math.round(dailySpend).toLocaleString()}/day avg</span>
    </div>
    <div class="insight-body">All metrics in this tab are interpreted at this spend level.</div>
  </div>`;

  // Objective-aware "No results" note (days with spend but zero results) — replaces the
  // retired funnel zero-note, surfaced right under the trend chart.
  const _L = objectiveLabels(obj);
  const zeroDays = b2.filter(r => (r.spend||0) > 0 && (r.results||0) === 0);
  const _fmtD = ds => { try { return new Date(ds+'T00:00:00Z').toLocaleDateString('en-GB',{day:'2-digit',month:'short',timeZone:'UTC'}); } catch(e){ return ds; } };
  const zeroSpend = zeroDays.reduce((s,r)=>s+(r.spend||0),0);
  const zeroNote = zeroDays.length ? `<div class="insight-block insight-block-spend">
      <div class="insight-header">
        <span class="insight-metric-name">No ${_L.nounPlural} on ${zeroDays.length} spend day${zeroDays.length===1?'':'s'}</span>
        <span class="insight-values">${zeroDays.map(r=>_fmtD(r.date)).join(' · ')}</span>
        <span class="insight-badge insight-badge-bad">${currency} ${spendTxt(zeroSpend)} spent, 0 ${_L.nounPlural}</span>
      </div>
      <div class="insight-body">These days drew spend without a single ${_L.noun}. Concentrate budget on the delivering days and the winning creative.</div>
    </div>` : '';

  return `
    <div id="tab1-prose-${id}" class="insight-placeholder"></div>

    <div class="chart-wrap-220"><canvas id="chart-overview-${id}"></canvas></div>

    ${spendBlock}
    <div id="tab1-metrics-prose-${id}" class="insight-placeholder"></div>

    ${seasonalityCollapsible}

    <div class="go-deeper">
      <div class="go-deeper-label">Go deeper</div>
      <ul>
        <li>Adset Analysis tab: three-way pool test</li>
        <li>Ads Analysis tab: per-ad fatigue and engagement</li>
        <li>Creative Analysis tab: new creative concepts from your winning ads</li>
        ${seasonality.sufficiency==='sufficient' && seasonality.hasPattern ? '<li>Day-of-week pattern identified: cross-check in Adset Analysis and Ads Analysis tabs</li>' : ''}
      </ul>
    </div>
  `;
}


// ── Three-layer funnel (impressions → link clicks → purchases) ──────────────
// Shared by Adset Analysis (per ad set) and Ads Analysis (per ad).
// Layer widths are LOG-SCALED so all three stay visible despite the huge gap
// between impressions and purchases (a linear scale makes the bottom invisible).
// Ordering is preserved (more of a metric → wider layer); the exact counts and
// the step conversion rates (CTR, CVR) are printed so the precise truth is shown.
function funnelSvg(impr, clicks, purch, accent, uid, nounPlural, ctrBench, cvrBench, subject) {
  const subj = subject || 'this ad set';
  const np = nounPlural || 'purchases';                 // objective-flexible result noun (plural, lowercase)
  const npCap = np.charAt(0).toUpperCase() + np.slice(1);
  impr = +impr || 0; clicks = +clicks || 0; purch = +purch || 0;
  if (impr <= 0) {
    return `<div class="funnel-wrap"><div class="funnel-none">No impressions data for this funnel.</div></div>`;
  }
  const W = 560, cx = 270, maxW = 280, h = 64, y0 = 16;   // three bands of height h
  const y1 = y0 + h, y2 = y1 + h, y3 = y2 + h;            // band boundaries
  const half = w => w / 2;
  // Square-root scaling of each stage RELATIVE to impressions: far more faithful to the true
  // proportion than a log scale, while a 2% floor keeps a non-zero stage visible and a real ZERO
  // collapses to a point (flagged with a red marker). This makes the shape reflect the numbers.
  const frac = v => v <= 0 ? 0 : Math.max(0.02, Math.sqrt(v / impr));
  const w1 = maxW * frac(impr), w2 = maxW * frac(clicks), w3 = maxW * frac(purch);
  const tz = (yA, yB, wA, wB) => `${cx - half(wA)},${yA} ${cx + half(wA)},${yA} ${cx + half(wB)},${yB} ${cx - half(wB)},${yB}`;
  const fmt = n => Math.round(n).toLocaleString();
  const ctr = impr > 0 ? (clicks / impr * 100) : 0;
  const cvr = clicks > 0 ? (purch / clicks * 100) : 0;
  const RED = '#F09595';                                  // flags a collapsed / near-zero stage
  const NEUTRAL = '#9FB0AD';                              // funnel bands are neutral; good/bad lives on the CTR & CR labels
  const critical = f => (f <= 0.05);                      // <=5% width ≈ a severe/near-zero conversion into this stage
  const bands = [
    { name:'Impressions', val:impr,   yA:y0, yB:y1, wTop:w1, wBot:w2, f:frac(impr) },
    { name:'Link clicks', val:clicks, yA:y1, yB:y2, wTop:w2, wBot:w3, f:frac(clicks) },
    { name:npCap,         val:purch,  yA:y2, yB:y3, wTop:w3, wBot:w3, f:frac(purch) },
  ];
  const LX = (cx - maxW / 2) - 16;   // right-aligned x for outside (left) labels
  const insideMin = 150;             // a band must be at least this wide to hold an inside label
  let polys = '', labels = '';
  bands.forEach((b, i) => {
    const midY = (b.yA + b.yB) / 2;
    const crit = critical(b.f);
    if (b.val <= 0) {
      polys += `<rect x="${cx - 22}" y="${midY - 3}" width="44" height="6" rx="2" fill="${NEUTRAL}" fill-opacity="0.9"/>`;
    } else {
      polys += `<polygon points="${tz(b.yA, b.yB, b.wTop, b.wBot)}" fill="${NEUTRAL}" fill-opacity="${0.88 - i * 0.16}"/>`;
    }
    const bandMax = Math.max(b.wTop, b.wBot);
    const valColor = crit ? RED : '#0E1615';
    if (bandMax >= insideMin) {
      labels += `<text x="${cx}" y="${midY - 4}" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#0E1615">${b.name}</text>`
             +  `<text x="${cx}" y="${midY + 13}" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="800" fill="#0E1615">${fmt(b.val)}</text>`;
    } else {
      const edge = cx - Math.max(bandMax, 6) / 2;
      const lblColor = '#0E1615';   // absolute counts are neutral (good/bad lives on CTR & CR)
      const outVal   = '#0E1615';
      labels += `<line x1="${LX + 8}" y1="${midY}" x2="${edge}" y2="${midY}" stroke="var(--text-muted)" stroke-width="1" stroke-opacity="0.5"/>`
             +  `<text x="${LX}" y="${midY - 3}" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="${lblColor}">${b.name}</text>`
             +  `<text x="${LX}" y="${midY + 13}" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="800" fill="${outVal}">${fmt(b.val)}</text>`;
    }
  });
  const RX = W - 10;
  const stepTxt = (y, s, state) => { const col = state==='good' ? 'var(--good-text)' : (state==='bad' ? 'var(--bad-text)' : 'var(--text-muted)'); return `<text x="${RX}" y="${y}" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="10.5" font-weight="800" fill="${col}">${s}</text>`; };
  return `<div class="funnel-wrap">
    <svg class="funnel-svg" viewBox="0 0 ${W} ${y3 + 16}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Funnel: ${fmt(impr)} impressions, ${fmt(clicks)} link clicks, ${fmt(purch)} ${np}">
      ${polys}
      ${labels}
      ${stepTxt(y1, 'Link CTR ' + ctr.toFixed(2) + '%', ctrBench!=null ? (ctr>=ctrBench?'good':'bad') : null)}
      ${ctrBench!=null ? `<text x="${RX}" y="${y1+12}" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="9" fill="var(--text-muted)">${subj} vs ${ctrBench.toFixed(2)}% account avg</text>` : ''}
      ${stepTxt(y2, 'CR (from links) ' + fmtCvr(cvr), cvrBench!=null ? (cvr>=cvrBench?'good':'bad') : (purch<=0?'bad':null))}
      ${cvrBench!=null ? `<text x="${RX}" y="${y2+12}" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="9" fill="var(--text-muted)">${subj} vs ${fmtCvr(cvrBench)} account avg</text>` : ''}
    </svg>
    <div class="funnel-note">Band widths use a square-root scale of each stage relative to impressions, so the taper reflects the real drop-off; a stage with zero results collapses to a marker and very thin stages are labelled to the left. Link CTR = link clicks ÷ impressions; CR (from links) = ${np} ÷ link clicks.</div>
  </div>`;
}


function buildTab2(id, camp, labels, currency) {
  const L    = objectiveLabels(effectiveObjective(camp));   // objective-flexible result nouns / labels
  const noun = n => (n === 1 ? L.noun : L.nounPlural);
  const c2 = camp.c2Series || {};
  const c1 = camp.c1Adsets || [];
  const totalCampSpend = camp.b1Snapshot?.spend || 0;
  const bm = (window.REPORT_DATA && window.REPORT_DATA.accountData && window.REPORT_DATA.accountData.benchmarks) || {};
  const roasBench = bm.outcome_sales_avg_roas != null ? bm.outcome_sales_avg_roas : null;
  const _costKey  = ({OUTCOME_SALES:'outcome_sales_avg_cpr',OUTCOME_LEADS:'outcome_leads_avg_cpl',OUTCOME_ENGAGEMENT:'outcome_engagement_avg_cpe',OUTCOME_TRAFFIC:'outcome_traffic_avg_cost_per_lpv',LINK_CLICKS:'outcome_traffic_avg_cost_per_link_click',APP_INSTALLS:'app_installs_avg_cpi',OUTCOME_AWARENESS:'outcome_awareness_avg_cpm'})[effectiveObjective(camp)] || 'outcome_sales_avg_cpr';
  const cprBench  = bm[_costKey] != null ? bm[_costKey] : null;   // objective-aware account cost-per-result (e.g. CPL for OUTCOME_LEADS)
  const cvrBench  = acctCrLinks(camp);   // account-average CR from links for this objective (0 leads → account 0.068%)
  const cvrProv   = acctCrLinksProvisional(camp);   // flag tiny-denominator (n=3) account CR figure

  // Delivery CAUSE label (three-way) — shown ONLY for underperformers, as the "why". Never "healthy".
  const causePlain = {
    'AUDIENCE_SATURATION':      { txt:'The same accounts are being recycled. The audience pool is exhausting.', cls:'saturation', tech:'AUDIENCE SATURATION' },
    'CREATIVE_FATIGUE_LIKELY':  { txt:'Frequency rising, CPM stable. Audience still reachable, the creative is wearing out.', cls:'fatigue', tech:'CREATIVE FATIGUE LIKELY' },
    'RELEVANCE_LIMITED':        { txt:'CPM rising while frequency is low. A below-average link CTR means low ad relevance is raising the price per impression. A creative cost problem, not the audience.', cls:'pressure', tech:'LOW AD RELEVANCE' },
    'EXTERNAL_AUCTION_PRESSURE':{ txt:'CPM rising while frequency is stable and link CTR is at/above the account average. External auction competition, not the audience or creative.', cls:'pressure', tech:'EXTERNAL AUCTION PRESSURE' },
    'HEALTHY_DELIVERY':         { txt:'Delivery is clean. Frequency, CPM and reach are all stable. The audience is not the cause; the failure is in the creative or the post-click path.', cls:'pressure', tech:'DELIVERY CLEAN. AUDIENCE NOT THE CAUSE' }
  };

  // Outcome triage (spend-blind selection): any breached benchmark => underperform. Delivery decides nothing here.
  const flagged = c1.filter(a => a && a.underperform);
  const healthy = c1.filter(a => a && !a.underperform);
  // Option C ordering: severity tier (# markers breached) desc, then spend desc within tier.
  flagged.sort((a,b) => (((b.breachedMarkers||[]).length) - ((a.breachedMarkers||[]).length)) || ((b.spend||0) - (a.spend||0)));

  const banner = flagged.length
    ? { txt:`${flagged.length} of ${c1.length} ad sets are below the same-objective account average. Ad sets are ranked by spend below; expand any row for its full delivery analysis.`, cls:'saturation', tech:`${flagged.length}/${c1.length} AD SETS UNDERPERFORMING` }
    : { txt:`Every spending ad set is at or above the account average on ${L.hasRoas?'ROAS, ':''}${L.costLabel.toLowerCase()} and CR (from links).`, cls:'healthy', tech:'ALL AD SETS HEALTHY' };

  function barRow(label, valTxt, benchTxt, pctGood, breached) {
    const w = Math.max(3, Math.min(100, pctGood || 0));
    return `<div class="ob-row"><span class="ob-label">${label}</span><span class="ob-track"><span class="ob-fill ${breached?'ob-bad':'ob-good'}" style="width:${w}%"></span></span><span class="ob-val ${breached?'ob-bad-txt':''}">${valTxt}</span><span class="ob-bench-txt">vs ${benchTxt}</span></div>`;
  }
  function ahCard(metric, valTxt, benchTxt, breached, hasVal) {
    const cls = !hasVal ? 'ah-card-na' : (breached ? 'ah-card-bad' : 'ah-card-good');
    return `<div class="ah-card ${cls}"><span class="ah-card-metric">${metric}</span><span class="ah-card-val">${hasVal?valTxt:'\u2014'}</span>${benchTxt?`<span class="ah-card-bench">vs ${benchTxt}</span>`:''}</div>`;
  }

  // ALL ad sets with spend, ranked highest -> lowest. Each row shows ROAS / CPR / Conv
  // vs benchmark as cards + an underperforming|healthy classification. Expanding a row
  // reveals the full delivery analysis; its charts initialise lazily on first open.
  const rankedAdsets = [...c1].sort((x,y) => (y.spend||0) - (x.spend||0));
  const adsetRows = rankedAdsets.map(as => {
    const adsetId = as.id;
    const adset   = c2[adsetId] || {};
    const pct = totalCampSpend > 0 ? ((as.spend||0)/totalCampSpend*100).toFixed(1) : '\u2014';
    const breached = normMarkers(as.breachedMarkers);
    const under = !!as.underperform;
    const roas = as.roas, cpr = as.cost_per_result, cvr = as.cvr;
    const crBad = (cvr != null && cvrBench != null && cvr < cvrBench);   // 0% CR < 0.068% account avg → below
    const purch = (as.purchases != null ? as.purchases : as.results);

    const cards =
        (L.hasRoas ? ahCard('ROAS', roas!=null?roas.toFixed(2)+'x':'', roasBench!=null?roasBench.toFixed(2)+'x':'', breached.includes('ROAS'), roas!=null) : '')
      + ahCard(L.costShort,  cpr!=null?currency+' '+cpr.toFixed(2):'', cprBench!=null?currency+' '+cprBench.toFixed(2):'', breached.includes('CPR'), cpr!=null)
      + ahCard('CR (from links)', cvr!=null?fmtCvr(cvr):'', cvrBench!=null?fmtCvr(cvrBench):'', crBad, cvr!=null);

    const badge = under
      ? `<span class="insight-badge insight-badge-bad" title="${breached.length} metric${breached.length===1?'':'s'} below account average">Underperforming</span>`
      : `<span class="insight-badge insight-badge-good">Healthy</span>`;

    // outcome-vs-benchmark bars (shown for every ad set in its expanded body)
    const rows = [];
    if (L.hasRoas && roas != null && roasBench) rows.push(barRow('ROAS', roas.toFixed(2)+'x', roasBench.toFixed(2)+'x', roas/roasBench*100, breached.includes('ROAS')));
    if (cprBench)  rows.push(barRow(L.costShort, cpr!=null?currency+' '+cpr.toFixed(2):('\u2014 (0 '+L.nounPlural+')'), currency+' '+cprBench.toFixed(2), cpr!=null?cprBench/cpr*100:0, cpr==null?true:breached.includes('CPR')));
    if (cvr  != null && cvrBench)  rows.push(barRow('CR (from links)', fmtCvr(cvr), fmtCvr(cvrBench), cvr/cvrBench*100, crBad));
    const barBlock = `<div class="outcome-bar"><div class="ob-title">Outcome vs account average${purch!=null?` \u00b7 ${purch} ${noun(purch)}`:''}</div><div class="ob-row ob-head"><span class="ob-label"></span><span class="ob-track ob-track-ghost"></span><span class="ob-val ob-head-lbl">This ad set</span><span class="ob-bench-txt ob-head-lbl">Account average</span></div>${rows.join('')}</div>`;

    // Three-layer funnel for this ad set (impressions → link clicks → results)
    const funnelBlock = `<div class="funnel-head"><span class="funnel-title">Funnel: impressions \u2192 link clicks \u2192 ${L.nounPlural}</span><span class="ca-verdict ${under?'ca-v-bad':'ca-v-good'}">${under?'Underperforming':'Performing'}</span></div>${funnelSvg(as.impressions, as.link_clicks, (as.purchases!=null?as.purchases:as.results), under ? '#E0765C' : '#2DBF9C', 'as-'+adsetId, L.nounPlural, campAggCtr(camp), cvrBench, 'this ad set')}`;

    let fullBody;
    const hasDaily = !!c2[adsetId];
    if (hasDaily) {
      // ALL outcome graphs for every ad set with daily data — not only breached markers.
      // ROAS only applies to revenue objectives; drop it otherwise.
      const markers = (L.hasRoas ? ['ROAS','CPR','CVR'] : ['CPR','CVR']);
      const mkName = { ROAS:'Daily ROAS', CPR:`Daily ${L.costLabel.toLowerCase()}`, CVR:'Daily CR (from links)' };
      const stripCanvases = markers.map(mk =>
        `<div class="strip-title">${mkName[mk]} <span class="strip-sub">(shaded = 0-${L.noun} day, darker = 0-spend day; \u25c9 marks a lone ${L.noun} day; "No ${L.nounPlural}" / "No spend" label empty regions)</span></div><div class="chart-wrap-strip"><canvas id="chart-adset-strip-${adsetId}-${mk}"></canvas></div>`
      ).join('');
      const _g = (x,y) => (x||0) > (y||0) ? 'rising' : ((x||0) < (y||0) ? 'falling' : 'stable');
      const fG = _g(adset.frequencyEnd, adset.frequencyStart);
      const cG = _g(adset.cpmEnd, adset.cpmStart);
      const rG = _g(adset.reachEnd, adset.reachStart);
      let cause = causePlain[adset.threeWayVerdict] || null;
      if (cause && adset.threeWayVerdict === 'HEALTHY_DELIVERY' && cvr != null && cvrBench != null && cvr >= cvrBench) {
        cause = { cls: cause.cls, tech: cause.tech,
          txt: `Delivery is clean and clicks convert above the account average. So it's not audience or post-click. The shortfall is creative efficiency: CTR clears the account average but sits below the campaign's own level, lifting ${L.costLabel.toLowerCase()}.` };
      }
      // outcome read for ALL three metrics (above/below benchmark), not just the breached ones
      const obul = [];
      if (L.hasRoas && roas!=null && roasBench) obul.push(`<span class="${metricVsBenchClass(roas,roasBench,true)}">ROAS ${roas.toFixed(2)}x vs ${roasBench.toFixed(2)}x</span> \u2014 ${roas>=roasBench?'at/above':'below'} the account average.`);
      if (cpr!=null  && cprBench)  obul.push(`<span class="${metricVsBenchClass(cpr,cprBench,false)}">${L.costLabel} ${currency} ${cpr.toFixed(2)} vs ${currency} ${cprBench.toFixed(2)}</span> \u2014 ${cpr<=cprBench?'at/below':'above'} the account average${purch!=null?` on ${purch} ${noun(purch)}`:''}.`);
      if (cvr!=null  && cvrBench)  obul.push(`<span class="${crBad?'sb-bad':'sb-good'}">CR (from links) ${fmtCvr(cvr)} vs ${fmtCvr(cvrBench)}</span> \u2014 ${cvr>=cvrBench?'at/above':'below'} the account average${cvrProv?' (provisional, based on few account-wide conversions)':''}.`);
      const dbul = [
        `Frequency ${(adset.frequencyStart||0).toFixed(2)} \u2192 ${(adset.frequencyEnd||0).toFixed(2)}, ${fG}.`,
        `CPM ${currency} ${(adset.cpmStart||0).toFixed(2)} \u2192 ${currency} ${(adset.cpmEnd||0).toFixed(2)}, ${cG}.`,
        `Reach ${(adset.reachStart||0).toLocaleString()} \u2192 ${(adset.reachEnd||0).toLocaleString()}, ${rG}.`
      ];
      const outcomeHdr = under ? 'Outcome vs account average' : 'Outcome vs account average. Clearing on all three';
      const _sbCls = verdictClass(under);   // ad-set: underperform → red, healthy → green
      const bulletBody = `<div class="ob-sub">${outcomeHdr}</div><ul class="signal-bullets">${obul.map(x=>`<li>${x}</li>`).join('')}</ul><div class="ob-sub">Delivery mechanism</div><ul class="signal-bullets ${_sbCls}">${dbul.map(x=>`<li>${x}</li>`).join('')}${!under ? `<li class="signal-conclusion">${cause?cause.txt:'Delivery: the frequency, CPM and reach figures are shown above.'}</li>` : ''}</ul>`;
      fullBody = `<div class="funnel-verdict"><div class="funnel-main">${funnelBlock}</div><div class="funnel-concl ${under?'fc-bad':'fc-good'}" id="tab2-conclusion-${adsetId}"><div id="tab2-conclusion-prose-${adsetId}" class="insight-placeholder"></div></div></div>${stripCanvases}
        <div class="strip-title">Delivery: frequency \u00b7 CPM \u00b7 reach \u00b7 spend \u00b7 CTR</div>
        <div class="chart-wrap-180"><canvas id="chart-adset-${adsetId}"></canvas></div>
        <div class="insight-block">
          <div class="insight-header"><span class="insight-metric-name">Signal summary</span>${cause?`<span class="insight-badge ${under?'insight-badge-bad':'insight-badge-good'}">${cause.tech}</span>`:''}</div>
          <div class="insight-body">${bulletBody}</div>
        </div>`;
    } else {
      fullBody = `${funnelBlock}<div class="ob-note">No daily (C2) data was pulled for this ad set. The daily ${L.hasRoas?'ROAS / ':''}${L.costLabel.toLowerCase()} / conversion-rate strips and the CPM \u00b7 reach \u00b7 frequency chart require the daily pull, which currently runs only for benchmark-breaching ad sets.</div>`;
    }

    const v = under ? { label:'Underperforming', cls:'ca-v-bad' } : { label:'Performing', cls:'ca-v-good' };
    const cardFace = `<div class="ca-fcard"><div class="ca-fcard-h">Top funnel metrics${classificationBadge(adset.topFunnelClassification)}</div><div class="ca-fcard-body">${bfmHTML('CTR (links)', as.ctr!=null?as.ctr.toFixed(2)+'%':'\u2014', campAggCtr(camp)!=null?'vs '+campAggCtr(camp).toFixed(2)+'% acct':'', (as.ctr!=null&&campAggCtr(camp)!=null&&as.ctr<campAggCtr(camp)), gaugeSVG(as.ctr, campAggCtr(camp), true, (as.ctr!=null&&campAggCtr(camp)!=null&&as.ctr<campAggCtr(camp))))}${bfmHTML('Frequency', as.frequency!=null?as.frequency.toFixed(2):'\u2014','',null)}${bfmHTML('CTR trend (early\u2192late)', adset.ctrStart!=null&&adset.ctrEnd!=null?adset.ctrStart.toFixed(2)+'% \u2192 '+adset.ctrEnd.toFixed(2)+'%':'\u2014','',null)}${bfmHTML('Eng. rate (start\u2192end)', adset.erStart!=null&&adset.erEnd!=null?adset.erStart.toFixed(2)+'% \u2192 '+adset.erEnd.toFixed(2)+'%':'\u2014','',null)}</div></div><div class="ca-fcard"><div class="ca-fcard-h">Bottom funnel metrics</div><div class="ca-fcard-body">${L.hasRoas ? bfmHTML('ROAS', roas!=null?roas.toFixed(2)+'x':'\u2014', roasBench!=null?'vs '+roasBench.toFixed(2)+'x acct':'', breached.includes('ROAS'), gaugeSVG(roas, roasBench, true, breached.includes('ROAS'))) : ''}${bfmHTML('CR (from links)', cvr!=null?fmtCvr(cvr):'\u2014', cvrBench!=null?'vs '+fmtCvr(cvrBench)+' acct':'', breached.includes('CVR'), gaugeSVG(cvr, cvrBench, true, breached.includes('CVR')))}${bfmHTML(L.costShort, cpr!=null?currency+' '+cpr.toFixed(2):'\u2014', cprBench!=null?'vs '+currency+' '+cprBench.toFixed(2)+' acct':'', breached.includes('CPR'), gaugeSVG(cpr, cprBench, false, breached.includes('CPR')))}${bfmHTML(L.nounPlural.replace(/^./,c=>c.toUpperCase()), as.purchases!=null?String(Math.round(as.purchases)):'\u2014','',null)}</div></div>`;

    return `<div class="ca-row ah-row ${under?'ah-row-bad':'ah-row-good'}">
      <div class="ca-row-head" id="adset-head-${adsetId}">
        <button class="ca-rowchev ${under?'ca-rowchev-bad':'ca-rowchev-good'}" id="ca-rowchev-as-${adsetId}" onclick="event.stopPropagation();toggleAdsetFull('${id}','${adsetId}')" aria-label="Toggle full analysis"><span class="ca-caret">\u25b8</span></button>
        <input type="checkbox" class="adset-sel adset-sel-${id}" value="${adsetId}" onclick="event.stopPropagation();updateGoAds('${id}')" aria-label="Select this ad set to view its ads">
        <span class="ca-verdict ${v.cls}">${v.label}</span>${(as.spend||0)<=0?'<span class="ca-tag ca-tag-na">No spend</span>':(((as.purchases!=null?as.purchases:as.results)||0)<=0?'<span class="ca-tag ca-tag-bad">No outcome</span>':'')}
        <div class="ca-row-id"><div class="ca-row-name ah-row-name" title="${(as.name||adsetId).replace(/"/g,'')}">${(as.name||adsetId)}</div><div class="ca-row-spend">${currency} ${Math.round(as.spend||0).toLocaleString()} \u00b7 ${pct}% of spend</div></div>
        <div class="ca-right"><a class="ams-link" href="${amsUrl('adset',adsetId)}" target="_blank" onclick="event.stopPropagation()"><svg class="meta-ico" viewBox="0 0 24 14" aria-hidden="true"><path d="M2 7c0-3 1.6-5 4-5 2.8 0 4.6 2.7 6 5 1.4-2.3 3.2-5 6-5 2.4 0 4 2 4 5s-1.6 5-4 5c-2.8 0-4.6-2.7-6-5-1.4 2.3-3.2 5-6 5-2.4 0-4-2-4-5z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>Open Meta Ads Manager</a></div>
      </div>
      <div class="ca-funnelcards">${cardFace}</div>
      <div class="ca-full collapsed" id="ca-full-as-${adsetId}">${fullBody}</div>
    </div>`;
  }).join('');

  const seasonality = camp.seasonality;
  const seasonXcheck = `<div class="seasonality-section"><div class="seasonality-title">Seasonality cross-check</div>${(seasonality && seasonality.sufficiency==='insufficient') ? '<div class="seasonality-none">Day-of-week seasonality could not be established in Overview (insufficient data, needs ~3 weeks), so it is neither confirmed nor ruled out here.</div>' : (seasonality?.hasPattern ? '<div class="seasonality-finding">A day-of-week pattern was identified in the Overview tab. Cross-check whether CPM and frequency follow the same weekly cycle before confirming the delivery cause.</div>' : '<div class="seasonality-none">No day-of-week pattern identified in Overview, so seasonality is not a confound for the audience-health read.</div>')}</div>`;



  const anySaturation = flagged.some(a => (c2[a.id]||{}).threeWayVerdict === 'AUDIENCE_SATURATION');
  const saturationChain = anySaturation ? `<div class="explainer-block"><strong>Saturation \u2192 fatigue chain:</strong> When the audience pool exhausts, Meta recycles the same accounts, frequency climbs, and creative fatigue follows downstream. Saturation is the upstream cause; any fatigue in the Ads Analysis tab is the consequence.</div><div class="explainer-block"><strong>Fix sequence:</strong> Expand the audience first, refresh creative alongside. Refreshing creative without expanding the pool resets the fatigue clock on the same exhausted audience.</div>` : '';

  return `
    <div class="three-way-verdict ${banner.cls}"><div class="verdict-plain">${banner.txt}</div><div class="verdict-technical">${banner.tech}</div></div>
    <div class="ah-searchrow"><input class="ah-search" type="text" placeholder="Search ad sets by name\u2026" oninput="searchRows('adset','${id}',this.value)"><span class="srch-none" id="srch-none-adset-${id}" style="display:none;">No ad sets match your search.</span></div>
    <div class="ah-actionbar"><button class="ah-goads" id="ah-goads-${id}" onclick="goToAdsFiltered('${id}')" disabled>Go to ads for selected ad sets \u2192</button><button class="ah-goads ah-compare" id="ah-cmp-adset-${id}" onclick="enterCompare('adset','${id}')" disabled>Compare</button><span class="ah-selhint">Tick ad sets \u2192 view their ads, or compare up to 3 side by side.</span></div>
    <div class="cmp-bar" id="cmp-bar-adset-${id}" style="display:none;">Comparing <span class="cmp-bar-count">0</span> ad sets side by side.<button onclick="exitCompare('adset','${id}')">Exit compare</button></div>
    <div class="ah-table" id="ah-table-${id}">${adsetRows}</div>
    ${seasonXcheck}
    <div class="insight-conclusion" id="tab2-overall-conclusion-${id}"><div class="insight-placeholder"></div></div>
    ${saturationChain}
  `;
}

function buildTab3(id, camp, labels, currency) {
  // All ads with a real D2 classification render as ranked rows (spend desc). INDETERMINATE
  // ads (no daily-trend data) are excluded; the D2 coverage cap is disclosed in Limitations.
  const L    = objectiveLabels(effectiveObjective(camp));   // objective-flexible result nouns / labels
  const noun = n => (n === 1 ? L.noun : L.nounPlural);
  const d1   = (camp.d1Ads || []).filter(ad => ad.d2Classification && ad.d2Classification !== 'INDETERMINATE');
  const d2   = camp.d2Series || {};
  const sa3  = camp.stageAnalysis?.stage3 || {};
  const sa4  = camp.stageAnalysis?.stage4 || {};
  const snap = camp.b1Snapshot || {};
  const adsetById = {}; (camp.c1Adsets || []).forEach(a => { adsetById[a.id] = a; });

  const bm = (window.REPORT_DATA && window.REPORT_DATA.accountData && window.REPORT_DATA.accountData.benchmarks) || {};
  const cprBench = bm.outcome_sales_avg_cpr != null ? bm.outcome_sales_avg_cpr : null;   // account sales CPR: meaningful-spend gate only; kept sales-based so the gate is NOT raised for non-sales objectives
  const _costKey2 = ({OUTCOME_SALES:'outcome_sales_avg_cpr',OUTCOME_LEADS:'outcome_leads_avg_cpl',OUTCOME_ENGAGEMENT:'outcome_engagement_avg_cpe',OUTCOME_TRAFFIC:'outcome_traffic_avg_cost_per_lpv',LINK_CLICKS:'outcome_traffic_avg_cost_per_link_click',APP_INSTALLS:'app_installs_avg_cpi',OUTCOME_AWARENESS:'outcome_awareness_avg_cpm'})[effectiveObjective(camp)] || 'outcome_sales_avg_cpr';
  const costBench = bm[_costKey2] != null ? bm[_costKey2] : null;   // objective-aware account cost-per-result for the bottom-funnel bars (CPL for OUTCOME_LEADS)
  const windowCpr = (camp.b1Snapshot && camp.b1Snapshot.cpr != null) ? camp.b1Snapshot.cpr : null;  // campaign window CPR: the bar an ad's own CPR is judged against
  const cvrBench = acctCrLinks(camp);   // account-average CR from links (0 leads → account 0.068%), so bottom funnel shows the benchmark not "—"
  const _anchorNames = ((camp.sominCreative||{}).anchors||[]).map(a=>String(a.name||'').split(' (')[0].trim().toLowerCase()).filter(Boolean);   // winning creatives chosen as anchors for Creative Analysis
  const cvrProv  = acctCrLinksProvisional(camp);   // flag tiny-denominator (n=3) account CR figure
  // CTR reference for per-ad comparison & the poor-quality gate = account-average link CTR for the objective
  let _imp = 0, _clk = 0; d1.forEach(a => { _imp += (a.impressions || 0); _clk += (a.link_clicks || 0); });
  const campCtr = campAggCtr(camp);

  const opening = '';

  const spendBlock = `<div class="insight-block insight-block-spend">
    <div class="insight-header">
      <span class="insight-metric-name">Campaign spend</span>
      <span class="insight-values">${currency} ${Math.round(snap.spend||0).toLocaleString()} over ${labels.length} days</span>
      <span class="insight-badge insight-badge-neutral">${currency} ${Math.round((snap.spend||0)/labels.length).toLocaleString()}/day avg</span>
    </div>
    <div class="insight-body">Ads ranked by spend. Each row's left badge is the bottom-funnel verdict; open the funnel cards or full analysis for detail.</div>
  </div>`;

  // ---- helpers ----
  const trendColour = (s,e,cls) => { const rising=e>s, falling=e<s;
    if (cls==='FATIGUE_CONFIRMED'||cls==='FATIGUE_POSSIBLE') return '#F09595';
    if (cls==='POOR_QUALITY') return rising?'#FAC775':'#F09595';
    if (falling) return '#47534F'; return rising?'#2DBF9C':'#47534F'; };
  const trendTxt = (s,e,agg,cls) => { if(s==null||e==null) return (agg!=null?agg.toFixed(2)+'%':'—');
    const col=trendColour(s,e,cls); return `${s.toFixed(2)}% <span style="color:${col};font-weight:600;">→ ${e.toFixed(2)}%</span>`; };
  const endpoints = (ad) => { const sd=d2[ad.id]||{};
    // ctrStart/ctrEnd/erStart/erEnd are SERIES-derived — they live on d2Series[ad.id], not on the
    // aggregate d1Ads entry. Prefer the series object; fall back to `ad` for a possible merged shape,
    // then to recomputing from the raw daily rows.
    let cS=sd.ctrStart!=null?sd.ctrStart:ad.ctrStart,cE=sd.ctrEnd!=null?sd.ctrEnd:ad.ctrEnd,
        eS=sd.erStart!=null?sd.erStart:ad.erStart,eE=sd.erEnd!=null?sd.erEnd:ad.erEnd;
    const ser=d2[ad.id]?(d2[ad.id].series||(Array.isArray(d2[ad.id])?d2[ad.id]:null)):null;
    if(ser&&ser.length){ const _er=r=>{const i=r.impressions||0;return i?((r.link_clicks||0)+(r.comments||0)+(r.reactions||0)+(r.saves||0))/i*100:null;};
      if(cS==null||cE==null){const cc=ser.filter(r=>r.ctr!=null);if(cc.length){cS=+(+cc[0].ctr).toFixed(2);cE=+(+cc[cc.length-1].ctr).toFixed(2);}}
      if(eS==null||eE==null){const ev=ser.map(_er).filter(v=>v!=null);if(ev.length){eS=+ev[0].toFixed(2);eE=+ev[ev.length-1].toFixed(2);}} }
    return {cS,cE,eS,eE}; };
  const obar = (label,valTxt,benchTxt,pctGood,bad) => { const w=Math.max(3,Math.min(100,pctGood||0));
    return `<div class="ob-row"><span class="ob-label">${label}</span><span class="ob-track"><span class="ob-fill ${bad?'ob-bad':'ob-good'}" style="width:${w}%"></span></span><span class="ob-val ${bad?'ob-bad-txt':''}">${valTxt}</span><span class="ob-bench-txt">vs ${benchTxt}</span></div>`; };
  const bottomVerdict = (ad) => { const spend=ad.spend||0; const meaningful = cprBench!=null ? spend>=cprBench : spend>0;
    const cvr=ad.cvr; const purch=ad.purchases||0; const acpr = purch>0 ? spend/purch : null;
    if(!meaningful) return {key:'na',label:'Insufficient spend',cls:'ca-v-na'};
    const cvrOk = (cvr!=null && cvrBench!=null && cvr>=cvrBench);
    const cprOk = (acpr!=null && windowCpr!=null && acpr<=windowCpr);   // ad CPR judged vs the window CPR
    if(cvrOk && cprOk) return {key:'ok',label:'Performing',cls:'ca-v-good'};
    return {key:'under',label:'Underperforming',cls:'ca-v-bad'}; };
  const classText = { FATIGUE_CONFIRMED:'creative fatigue confirmed (CTR declining as frequency rises)',
    FATIGUE_POSSIBLE:'possible early fatigue (single signal)',
    POOR_QUALITY:'poor quality (link CTR at or below the account average, no sustained lift)',
    STABLE:'stable (CTR holding at or above the account average)' };

  // ---- ranked ad rows (spend desc) ----
  const ranked = [...d1].sort((a,b)=>(b.spend||0)-(a.spend||0));
  const adRows = ranked.map(ad => {
    const _rawCls = ad.d2Classification;
    // Rule: only label an ad "Poor quality" if its (link) CTR is BELOW the account average.
    // If tagged POOR_QUALITY but its link CTR is at/above the account average, it is not a
    // top-funnel quality problem — show it as Stable (any conversion miss shows in the bottom funnel).
    const cls = (_rawCls === 'POOR_QUALITY' && ad.ctr != null && campCtr != null && ad.ctr >= campCtr) ? 'STABLE' : _rawCls;
    // Series-derived per-ad fields (twoSignal, freqOpen/Close, ctrStart/End) live on
    // d2Series[ad.id] — d1Ads carries only aggregate figures. Resolve the series object once;
    // fall back to `ad` for a possible merged shape.
    const sd = d2[ad.id] || {};
    const fl = ad.frequency!=null ? 1-Math.pow((ad.frequency||0)+1,-0.4) : null;
    const flV = flVerdict(fl);
    const ep = endpoints(ad);
    const v = bottomVerdict(ad);
    const spend = ad.spend||0; const purch = ad.purchases||0;
    const cvrPct = ad.cvr!=null ? ad.cvr : null;   // cvr is ALREADY in percent units (no *100)
    const convertsOk = (cvrPct!=null && cvrBench!=null && cvrPct>=cvrBench);   // converts at/above the account average (loop-scoped; cvrOk lives only inside bottomVerdict)
    const expPurch = costBench ? spend/costBench : null;   // expected results at the objective's account-average cost-per-result
    const cpmAvg = ad.impressions ? (spend/ad.impressions*1000) : null;

    // TOP-funnel expanded strip (left->right)
    const topStrip = `<div class="ca-strip">
        <div class="ca-chip"><span class="ca-chip-l">Classification</span><span class="ca-chip-v">${classificationBadge(cls)}</span></div>
        <div class="ca-chip"><span class="ca-chip-l">Fatigue level</span><span class="ca-chip-v">${fl!=null?fl.toFixed(2):'—'}</span></div>
        <div class="ca-chip"><span class="ca-chip-l">Severity</span><span class="ca-chip-v">${fl!=null?`<span class="fl-badge ${flV.cls}">${flV.label}</span>`:'—'}</span></div>
        <div class="ca-chip"><span class="ca-chip-l">Frequency</span><span class="ca-chip-v">${ad.frequency!=null?ad.frequency.toFixed(2):'—'}</span></div>
        <div class="ca-chip"><span class="ca-chip-l">CTR (early→late avg)</span><span class="ca-chip-v">${trendTxt(ep.cS,ep.cE,ad.ctr,cls)}</span></div>
        <div class="ca-chip"><span class="ca-chip-l">Eng. rate (start→end)</span><span class="ca-chip-v">${trendTxt(ep.eS,ep.eE,null,cls)}</span></div>
      </div>`;

    // BOTTOM-funnel expanded bars — conversion rate, CPR (vs window CPR), purchases (vs expected at account-average CPR)
    const acpr = purch>0 ? spend/purch : null;
    const cvrBad = !(cvrPct!=null && cvrBench && ad.cvr>=cvrBench);
    const cprBad = !(acpr!=null && windowCpr!=null && acpr<=windowCpr);
    const bars = obar('CR (from links)', cvrPct!=null?fmtCvr(cvrPct):'—', cvrBench!=null?fmtCvr(cvrBench):'—', (cvrPct!=null&&cvrBench)?cvrPct/cvrBench*100:0, cvrBad)
      + obar(L.costShort, acpr!=null?(currency+' '+acpr.toFixed(2)):('\u2014 (0 '+L.nounPlural+')'), (windowCpr!=null?windowCpr:costBench)!=null?(currency+' '+(windowCpr!=null?windowCpr:costBench).toFixed(2)):'\u2014', (acpr!=null&&(windowCpr!=null?windowCpr:costBench))?((windowCpr!=null?windowCpr:costBench)/acpr*100):0, cprBad)
      + obar(L.nounPlural.replace(/^./,c=>c.toUpperCase()), String(Math.round(purch)), expPurch!=null?('~'+expPurch.toFixed(1)+' exp.'):'—', expPurch?purch/expPurch*100:0, expPurch?purch<expPurch:false);
    const bottomExpand = `<div class="ca-bars"><div class="ca-bars-title">Bottom funnel vs account average: conv. rate &amp; ${L.costShort} vs the ${currency} ${windowCpr!=null?windowCpr.toFixed(2):'—'} window ${L.costShort} set the verdict${expPurch!=null?`; expected ${L.nounPlural} ≈ spend ÷ ${currency} ${costBench.toFixed(2)} ≈ ${expPurch.toFixed(1)}`:''}</div><div class="ob-row ob-head"><span class="ob-label"></span><span class="ob-track ob-track-ghost"></span><span class="ob-val ob-head-lbl">This ad</span><span class="ob-bench-txt ob-head-lbl">Account average</span></div>${bars}</div>`;

    // FULL analysis — two lazy charts + the per-ad signal-summary bullet block (restored)
    const dir = (x,y)=> (x==null||y==null)?'held roughly flat':(y>x*1.1?'rose':(y<x*0.9?'fell':'held roughly flat'));
    const ctrChg = (ep.cS>0 && ep.cE!=null) ? (((ep.cE-ep.cS)/ep.cS)*100).toFixed(1) : null;
    const _lastCtr = (ad.ctr!=null?ad.ctr:ep.cE);
    const vsCamp = (campCtr!=null && _lastCtr!=null) ? ` vs the ${campCtr.toFixed(2)}% account average, ${_lastCtr < campCtr ? 'below' : 'at/above'}` : '';
    const ctrBullet = `CTR ${ep.cS!=null?ep.cS.toFixed(2)+'%':'—'} → ${ep.cE!=null?ep.cE.toFixed(2)+'%':'—'} (${dir(ep.cS,ep.cE)}${ctrChg!=null?`, ${ctrChg>0?'+':''}${ctrChg}%`:''})${vsCamp}.`;
    const freqO = sd.freqOpen!=null?sd.freqOpen:(ad.freqOpen!=null?ad.freqOpen:ad.frequency);
    const freqC = sd.freqClose!=null?sd.freqClose:(ad.freqClose!=null?ad.freqClose:ad.frequency);
    const freqBullet = freqO!=null
      ? `Frequency ${freqO.toFixed(2)}${(freqC!=null && freqC!==freqO)?` → ${freqC.toFixed(2)}`:''}. The same accounts have seen this ad ~${Math.round(freqC||freqO)} time${Math.round(freqC||freqO)!==1?'s':''}.`
      : 'Frequency data not available.';
    const spendBullet = `Spend ${currency} ${spendTxt(spend)}${cpmAvg!=null?` at an average CPM of ${currency} ${cpmAvg.toFixed(2)}`:''}${labels.length?` over ${labels.length} days`:''}.`;
    let convBullet;
    if (purch===0) convBullet = `Converted nothing: 0 ${L.nounPlural} on ${currency} ${spendTxt(spend)} spent${expPurch!=null?` (~${expPurch.toFixed(1)} expected at the ${currency} ${costBench.toFixed(2)} account-average ${L.costShort})`:''}.`;
    else convBullet = `${purch} ${noun(purch)}${cvrPct!=null?` at ${fmtCvr(cvrPct)} CR (from links) vs ${fmtCvr(cvrBench)} ${crBenchNoun(camp)}`:''}${expPurch!=null?` (~${expPurch.toFixed(1)} expected at account-average CPR)`:''}.`;
    const flBullet = fl!=null ? `Fatigue Level ${fl.toFixed(2)} (${flV.label}). Predictive from frequency; the classification is set by measured CTR, not this number.` : '';
    // CONCLUSION — reconciled across BOTH funnels. The final recommendation is a function of
    // (top-funnel class) × (bottom-funnel verdict); the top-funnel action alone never stands as
    // the recommendation. The most important case: clicks healthy/stable but NOT converting →
    // the problem is post-click, so "keep running" is overridden.
    const _fc = freqC!=null?`frequency ${freqC.toFixed(2)}`:'frequency';
    // top-funnel read (describes clicks only — no standalone action verb)
    const topRead = {
      FATIGUE_CONFIRMED: (sd.twoSignal!=null?sd.twoSignal:ad.twoSignal)
        ? `Top-funnel: creative fatigue (two-signal). CTR falling as ${_fc} rises.`
        : `Top-funnel: creative fatigue. CTR declining (single-signal; frequency not clearly rising).`,
      FATIGUE_POSSIBLE: `Top-funnel: possible early fatigue. CTR softening, frequency not clearly rising (single signal).`,
      POOR_QUALITY: `Top-funnel: poor quality. Link CTR sat at or below the account average across the window, with no sustained lift.`,
      STABLE: `Top-funnel: stable. CTR ${(ad.ctr!=null&&campCtr!=null&&ad.ctr<campCtr)?'below the account average but not fatiguing':'holding at or above the account average'}, no fatigue signal.`
    };
    // bottom-funnel read
    let bottomRead;
    if (v.key==='under') bottomRead = `Bottom-funnel: under-converting. CR from links sits below the account average${purch===0?', and it converted nothing on its spend':''}.`;
    else if (v.key==='ok') bottomRead = `Bottom-funnel: converting above the ${crBenchNoun(camp)}.`;
    else bottomRead = `Bottom-funnel: too little spend to judge conversion yet.`;
    if (v.key==='under' && convertsOk) bottomRead = `Bottom-funnel: converts above the ${crBenchNoun(camp)}, but ${L.costLabel.toLowerCase()} still runs high. The cost miss is upstream (expensive clicks), not conversion.`;
    // combined action — driven by the pair, not by top-funnel alone
    const clicksFading  = (cls==='FATIGUE_CONFIRMED' || cls==='FATIGUE_POSSIBLE');
    // weak / healthy are keyed to the CLASSIFICATION so the action always agrees with the badge
    const clicksHealthy = (cls==='STABLE');
    const clicksWeak    = (cls==='POOR_QUALITY');
    const ctrBelowAvg   = (ad.ctr != null && campCtr != null && ad.ctr < campCtr);
    let action;
    if (v.key==='under') {
      if (convertsOk) {
        action = clicksWeak
          ? `∴ Converts above the account average, but link CTR sits below it, so clicks are expensive and ${L.costLabel.toLowerCase()} runs high. A creative problem, not post-click. Replace the creative to lift CTR.`
          : clicksFading
          ? `∴ Converts above the account average, but CTR is fatiguing (falling as frequency rises) so clicks cost more and ${L.costLabel.toLowerCase()} runs high. Refresh/rotate the creative; the post-click path is fine.`
          : `∴ Both clicks and conversion beat the account average. Cost per purchase runs a touch high only because each sits slightly below the campaign's own norm. Refresh the creative to lift CTR; the post-click path is fine.`;
      }
      else if (clicksHealthy)      action = ctrBelowAvg
        ? `∴ Link CTR is below the account average but not fatiguing, so the bottleneck is post-click, not the clicks. Audit the landing page, offer and product–audience fit, or pause. A refresh won't fix a conversion gap.`
        : `∴ The creative earns clicks at or above the account average but they don't convert. The problem is post-click, not the ad. Don't scale: audit the landing page, offer and product–audience fit, or pause.`;
      else if (clicksWeak)    action = `∴ Weak on both funnels. Poor clicks and poor conversion. Replace the creative; a refresh won't save it. If the landing/offer is also weak, fix that in parallel.`;
      else if (clicksFading)  action = `∴ Clicks are fatiguing AND it isn't converting. Refresh/rotate the creative to arrest the click decline, and audit the post-click path, since fresh creative alone won't close the conversion gap.`;
      else                    action = `∴ Under-converting on meaningful spend. Audit the post-click path or pause.`;
    } else if (v.key==='ok') {
      if (clicksHealthy)      action = `∴ Healthy on both funnels. Clicks and conversion are at/above the account average. Keep running; a scale candidate.`;
      else if (clicksFading)  action = `∴ Converting well but clicks are fatiguing. Refresh/rotate the creative to protect the conversions before CTR drags them down.`;
      else if (clicksWeak)    action = `∴ Converting despite weak clicks. The offer is working on thin traffic; a stronger creative could unlock more volume.`;
      else                    action = `∴ Converting above the account average. Keep running.`;
    } else { // insufficient spend
      if (clicksFading)       action = `∴ Too little spend to judge conversion, and clicks are already softening. Watch it; give it budget only if CTR holds.`;
      else if (clicksWeak)    action = `∴ Weak clicks and too little spend to judge conversion. Low priority; replace or let it exhaust.`;
      else                    action = `∴ Not enough spend (below 1× account-average CPR) to judge conversion yet. Leave it to accrue data or reallocate; no action warranted.`;
    }
    // parent ad-set delivery inheritance (only meaningful when this creative is implicated in a miss)
    const _pa = adsetById[ad.adset_id];
    const _pv = (camp.c2Series||{})[ad.adset_id]?.threeWayVerdict;
    let inherit = '';
    if (_pa && _pa.underperform && v.key==='under') {
      if (_pv==='HEALTHY_DELIVERY') inherit = convertsOk
        ? ` Its ad set's delivery was clean and this ad beats the account average, so the small shortfall is creative efficiency (CTR below the campaign's own level), not the audience or post-click.`
        : ` Its ad set's delivery was clean, so the shortfall traces to this creative + its post-click path, not the audience.`;
      else if (_pv==='AUDIENCE_SATURATION') inherit = ` Its ad set is also saturating. Expand the audience alongside, or gains won't hold.`;
    }
    const topLine = topRead[cls] || 'Top-funnel: classification under analysis.';
    // Per-ad conclusion colour: bottom-funnel outcome is the decision-driver
    // (under-converting → red; converting above average → green; insufficient spend → neutral).
    const _adSb = v.key==='under' ? 'sb-bad' : (v.key==='ok' ? 'sb-good' : 'sb-neutral');
    const bulletBody = `<ul class="signal-bullets ${_adSb}">
        <li>${ctrBullet}</li>
        <li>${convBullet}</li>
        <li>${freqBullet}</li>
        <li>${spendBullet}</li>
        ${flBullet?`<li>${flBullet}</li>`:''}
        <li>${topLine}</li>
        <li>${bottomRead}</li>
      </ul>`;
    const topFunnelCard = `<div class="ca-fcard"><div class="ca-fcard-h">Top funnel metrics ${classificationBadge(cls)}<span class="ca-fh-m"><span class="ca-fh-l">Fatigue level</span><span class="ca-fh-v">${fl!=null?fl.toFixed(2):'—'}</span></span><span class="ca-fh-m"><span class="ca-fh-l">Severity</span>${fl!=null?`<span class="fl-badge ${flV.cls}">${flV.label}</span>`:'<span class="ca-fh-v">—</span>'}</span></div><div class="ca-fcard-body">${bfmHTML('CTR (links)', ad.ctr!=null?ad.ctr.toFixed(2)+'%':'\u2014', campCtr!=null?'vs '+campCtr.toFixed(2)+'% acct':'', (ad.ctr!=null&&campCtr!=null&&ad.ctr<campCtr), gaugeSVG(ad.ctr, campCtr, true, (ad.ctr!=null&&campCtr!=null&&ad.ctr<campCtr)))}${bfmHTML('Frequency', ad.frequency!=null?ad.frequency.toFixed(2):'\u2014','',null)}${bfmHTML('CTR trend (early\u2192late)', trendTxt(ep.cS,ep.cE,ad.ctr,cls),'',null)}${bfmHTML('Eng. rate (start\u2192end)', trendTxt(ep.eS,ep.eE,null,cls),'',null)}</div></div>`;
    const _cplBench = (costBench!=null?costBench:windowCpr);
    const _cplBad = (acpr!=null && _cplBench!=null) ? acpr > _cplBench : cprBad;
    const bottomFunnelCard = `<div class="ca-fcard"><div class="ca-fcard-h">Bottom funnel metrics</div><div class="ca-fcard-body">${bfmHTML('CR (from links)', cvrPct!=null?fmtCvr(cvrPct):'\u2014', cvrBench!=null?'vs '+fmtCvr(cvrBench)+' acct':'', cvrBad, gaugeSVG(cvrPct, cvrBench, true, cvrBad))}${bfmHTML(L.costShort, acpr!=null?currency+' '+acpr.toFixed(2):'\u2014', _cplBench!=null?'vs '+currency+' '+_cplBench.toFixed(2)+' acct':'', _cplBad, gaugeSVG(acpr, _cplBench, false, _cplBad))}${bfmHTML(L.nounPlural.replace(/^./,c=>c.toUpperCase()), String(Math.round(purch)), expPurch!=null?'vs ~'+expPurch.toFixed(1)+' expected':'', null)}</div></div>`;
    const fullPanel = `<div class="ca-full collapsed" id="ca-full-${ad.id}">
        <div class="funnel-verdict">
          <div class="funnel-main">
            <div class="funnel-head"><span class="funnel-title">Funnel: impressions \u2192 link clicks \u2192 ${L.nounPlural}</span><span class="ca-verdict ${v.cls}">${v.label}</span></div>
            ${funnelSvg(ad.impressions, ad.link_clicks, ad.purchases, (v.label==='Underperforming'?'#E0765C':'#2DBF9C'), 'ad-'+ad.id, L.nounPlural, campCtr, cvrBench, 'this ad')}
          </div>
          <div class="funnel-concl ${v.label==='Underperforming'?'fc-bad':'fc-good'}">${action}${inherit}</div>
        </div>
        <div class="ca-charts">
          <div class="ca-chart"><div class="strip-title">CTR (links) · account-avg CTR · frequency</div><div class="chart-wrap-180"><canvas id="chart-ad-top-${ad.id}"></canvas></div></div>
          <div class="ca-chart"><div class="strip-title">Spend · CPM</div><div class="chart-wrap-180"><canvas id="chart-ad-bottom-${ad.id}"></canvas></div></div>
        </div>
        <div class="insight-block" style="margin-top:12px;">
          <div class="insight-header"><span class="insight-metric-name">Signal summary</span>${classificationBadge(cls)}<span class="ca-verdict ${v.cls}" style="font-size:10px;padding:2px 8px;">${v.label}</span></div>
          <div class="insight-body">${bulletBody}</div>
        </div>

    return `<div class="ca-row" data-adset="${ad.adset_id||''}" data-ad="${ad.id}">
      <div class="ca-row-head">
        <button class="ca-rowchev ${v.key==='under'?'ca-rowchev-bad':(v.key==='ok'?'ca-rowchev-good':'')}" id="ca-rowchev-${ad.id}" onclick="event.stopPropagation();toggleAdFull('${id}','${ad.id}')" aria-label="Toggle full analysis"><span class="ca-caret">▸</span></button>
        <input type="checkbox" class="adset-sel ad-sel-${id}" value="${ad.id}" onclick="event.stopPropagation();updateAdActions('${id}')" aria-label="Select this ad to compare">
        <span class="ca-verdict ${v.cls}">${v.label}</span>${spend<=0?'<span class="ca-tag ca-tag-na">No spend</span>':((purch||0)<=0?'<span class="ca-tag ca-tag-bad">No outcome</span>':'')}${_anchorNames.includes(String(ad.name||'').trim().toLowerCase())?'<span class="ca-crown" title="Chosen as a creative anchor (winner) for Creative Analysis"><svg width="12" height="10" viewBox="0 0 22 18" aria-hidden="true"><path d="M2 15.5h18l1.2-11-5.4 4.2L11 1.5 6.2 8.7 0.8 4.5z" fill="#D4A017"/></svg>Winner</span>':''}
        <div class="ca-row-id"><div class="ca-row-name" title="${(ad.name||'').replace(/"/g,'')}">${(ad.name||ad.id)}</div><div class="ca-row-spend">${currency} ${spendTxt(spend)} · ${purch} ${noun(purch)}</div></div>
                <a class="ams-link" href="${amsUrl('ad',ad.id)}" target="_blank" onclick="event.stopPropagation()"><svg class="meta-ico" viewBox="0 0 24 14" aria-hidden="true"><path d="M2 7c0-3 1.6-5 4-5 2.8 0 4.6 2.7 6 5 1.4-2.3 3.2-5 6-5 2.4 0 4 2 4 5s-1.6 5-4 5c-2.8 0-4.6-2.7-6-5-1.4 2.3-3.2 5-6 5-2.4 0-4-2-4-5z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>Open Meta Ads Manager</a>
      </div>
      <div class="ca-funnelcards">${topFunnelCard}${bottomFunnelCard}</div>
      ${fullPanel}
    </div>`;
  }).join('');

  const intro = '';

  // Similarity-cluster and diversity findings are DIAGNOSTIC (their sentiment is mixed — e.g.
  // "diversity is not the problem" is good about diversity yet confirms a bad root cause), so
  // their ∴ line is neutral rather than defaulting to green.
  const similarity = sa3.similarityClusterFinding
    ? `<div class="explainer-block sb-neutral"><strong>Similarity clusters:</strong> ${sa3.similarityClusterFinding}</div>`
    : '';
  const diversity = sa4.diversityObservations
    ? `<div class="diversity-block sb-neutral"><div class="diversity-label">Content diversity</div>${sa4.diversityObservations}</div>`
    : '';

  return `
    <div id="ca-camphead-${id}">
      ${opening}
      ${spendBlock}
      ${intro}
    </div>
    <div class="ca-filter-chip" id="ca-filter-chip-${id}" style="display:none;">
      <span class="ca-filter-label">Showing ads in ad set:</span>
      <strong class="ca-filter-name" id="ca-filter-name-${id}"></strong>

    </div>
    <div class="ca-empty" id="ca-empty-${id}" style="display:none;">No ads in this ad set had spend &gt; 0 and impressions &gt; 1,000. <a href="#" onclick="clearCreativeFilter('${id}');return false;">Show all ads</a></div>
    <div class="ah-searchrow"><input class="ah-search" type="text" placeholder="Search ads by name\u2026" oninput="searchRows('ad','${id}',this.value)"><span class="srch-none" id="srch-none-ad-${id}" style="display:none;">No ads match your search.</span></div>
    <div class="ah-actionbar"><button class="ah-goads ah-compare" id="ah-cmp-ad-${id}" onclick="enterCompare('ad','${id}')" disabled>Compare ads</button><span class="ah-selhint">Tick 2\u20133 ads to compare side by side.</span></div>
    <div class="cmp-bar" id="cmp-bar-ad-${id}" style="display:none;">Comparing <span class="cmp-bar-count">0</span> ads side by side.<button onclick="exitCompare('ad','${id}')">Exit compare</button></div>
    <div class="ca-list" id="ca-list-${id}">${adRows}</div>
    <div id="ca-campfoot-${id}">
      ${similarity}
      ${diversity}
    </div>
  `;
}
function buildTab4(id, camp, labels, currency) {

  // Renders campaignData[id].sominCreative, produced by meta-somin-bridge:
  //   anchors (with user-uploaded screenshots) · concept fingerprint · 3 insight
  //   pillars, each carrying a TOFU / MOFU / BOFU generated creative (9 total).
  // Creatives with a real image (data URI or URL) render it; those without fall
  // back to an on-brand inline-SVG tile (renders offline / from file://).
  const sc = camp.sominCreative || null;
  const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const wordmark = '<span style="color:var(--teal)">SO</span><span style="color:var(--text-primary)">MIN</span>';

  if (!sc || (!(sc.pillars && sc.pillars.length) && !((sc.anchors||[]).length))) {
    return `<div class="sc-intro">The ${wordmark} creative loop did not run for this campaign (SOMIN loop off, or no STABLE anchors to decode), so there are no generated creatives to show.</div>`;
  }

        ? `<img class="sc-anchor-thumb" src="${a.screenshot}" alt="${escA(a.name)} creative" loading="lazy">`
        : `<div class="sc-anchor-thumb sc-anchor-thumb-empty">no screenshot</div>`;
      return `<li>${thumb}<div class="sc-anchor-text"><span class="sc-anchor-name">${escA(a.name)}</span>`
           + `<span class="sc-anchor-note">${a.note || ''}</span></div></li>`;
    }).join('');
    return `<div class="sc-intro">${sc.introNote || ''}</div>`
         + `<div class="sc-section"><div class="sc-h">${escA(sc.anchorsHeading || 'Anchors')}</div>`
         + `<div class="sc-lead">${sc.anchorsLead || ''}</div>`
         + `<ul class="sc-anchor-list">${rows}</ul>`
         + `<div class="sc-lead">${sc.selectionNote || ''}</div></div>`
         + (sc.notRunNote ? `<div class="sc-section"><div class="sc-h">What did not run</div>`
                          + `<div class="sc-lead">${sc.notRunNote}</div></div>` : '');
  }

  const scTile = (stage, accent, pillarName, uid) => {

    const motif = {
      TOFU: `<g fill="none" stroke="${accent}" stroke-width="2">
          <circle cx="150" cy="150" r="34" stroke-opacity="0.9"/>
          <circle cx="150" cy="150" r="66" stroke-opacity="0.5"/>

      MOFU: `<g stroke="${accent}" fill="none" stroke-width="2">
          <path d="M52 74 L248 74 L186 250 L114 250 Z" stroke-opacity="0.55"/>
          <line x1="74" y1="120" x2="226" y2="120" stroke-opacity="0.32"/>
          <line x1="98" y1="170" x2="202" y2="170" stroke-opacity="0.32"/>
          <line x1="124" y1="220" x2="176" y2="220" stroke-opacity="0.32"/>
        </g><circle cx="150" cy="262" r="8" fill="${accent}"/>`,
      BOFU: `<g fill="none" stroke="${accent}" stroke-width="2">
          <circle cx="150" cy="150" r="78" stroke-opacity="0.28"/>
          <circle cx="150" cy="150" r="50" stroke-opacity="0.55"/>
        </g><circle cx="150" cy="150" r="26" fill="${accent}" fill-opacity="0.92"/>
        <path d="M137 150 l9 11 l19 -24" stroke="#0E1615" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`
    }[stage] || '';

      ${motif}
      <text x="16" y="27" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="1"><tspan fill="${accent}">SO</tspan><tspan fill="#EAF2F0">MIN</tspan></text>
      <text x="150" y="292" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="${accent}" fill-opacity="0.85">${word.toUpperCase()}</text>
    </svg>`;
  };

  const intro = `<div class="sc-intro">The ${wordmark} creative loop decodes this campaign’s own STABLE winners into a reusable concept
    fingerprint, validates it against the market, and expresses it as insight pillars with ready-to-run creative across the funnel.</div>`;

  // 1 — Anchors (with user-uploaded screenshots)
  const anchors = sc.anchors || [];
  const anchorRows = anchors.map(a => {
    const thumb = a.screenshot
      ? `<img class="sc-anchor-thumb" src="${a.screenshot}" alt="${esc(a.name)} screenshot" loading="lazy">`
      : `<div class="sc-anchor-thumb sc-anchor-thumb-empty">no screenshot</div>`;
    return `<li>${thumb}<div class="sc-anchor-text"><span class="sc-anchor-name">${esc(a.name)}</span><span class="sc-anchor-note">${esc(a.note)}</span></div></li>`;
  }).join('');
  const confirmed = sc.anchorsConfirmed != null ? sc.anchorsConfirmed : anchors.length;
  const caveat = '';
  const anchorsSection = `<div class="sc-section">
    <div class="sc-h">SOMIN anchors. The winners we decoded</div>
    <div class="sc-lead">${anchors.length} campaign winners were decoded into the fingerprint below, chosen as the ads already delivering the strongest purchase ROAS. Anchors are what already worked. The loop builds forward from them rather than guessing.</div>
    <ul class="sc-anchor-list">${anchorRows}</ul>
    ${caveat}
  </div>`;

  // 2 — Fingerprint
  const fp = sc.fingerprint || {};
  const fpCards = (fp.dimensions || []).map(f => `<div class="sc-fp-dim"><div class="sc-fp-dim-name">${esc(f.dim)}</div><div class="sc-fp-chips">${(f.vals||[]).map(v=>`<span class="sc-chip">${esc(v)}</span>`).join('')}</div></div>`).join('');
  const verdict = fp.corpus_verdict ? `verdict <span class="sc-verdict">${esc(fp.corpus_verdict)}</span>${fp.verdict_note?` (${esc(fp.verdict_note)})`:''}` : '';
  const fingerprintSection = `<div class="sc-section">
    <div class="sc-h">The concept fingerprint</div>
    <div class="sc-lead">The shared DNA decoded from the anchors, validated against the market corpus: ${verdict}.</div>
    <div class="sc-fp-grid">${fpCards}</div>
  </div>`;

  // 3 + 4 — Pillars, each collapsible: head shows a whitespace verdict; opening reveals
  // the insight-chain audit trail + the 3 full-funnel creatives.
  const stageAccentFallback = ['#2DBF9C', '#E0B25C', '#5CC8E0'];
  const wsClass = v => ({ WHITESPACE:'ws-whitespace', CONTESTED:'ws-contested', EMERGING:'ws-emerging' }[v] || 'ws-na');
  const pillarBlocks = (sc.pillars || []).map((p, pi) => {
    const accent = p.accent || stageAccentFallback[pi % 3];
    const uid = 'p' + (p.n != null ? p.n : (pi + 1));
    const cells = (p.creatives || []).map(cr => {
      const media = cr.img
        ? `<img class="sc-creative-img" src="${cr.img}" alt="${esc(cr.code)}" loading="lazy">`
        : scTile(cr.stage, accent, p.name, cr.code);
      // scoring badge — recommended replacement only when per_asset ≥ 0.80; otherwise a concept draft
      let score = '';
      if (cr.score != null) {
        const rec = (cr.scoring_method === 'per_asset' && cr.score >= 0.80);
        score = `<div class="sc-score ${rec?'sc-score-rec':''}">clickability ${Number(cr.score).toFixed(2)}${cr.scoring_method?` · ${esc(cr.scoring_method)}`:''}${rec?' · recommended':''}</div>`;
      } else if (cr.scoring_method) {
        score = `<div class="sc-score">concept draft · ${esc(cr.scoring_method)}</div>`;
      }
      return `
      <div class="sc-creative">
        <div class="sc-creative-imgwrap">${media}</div>
        <div class="sc-stage sc-stage-${String(cr.stage||'').toLowerCase()}">${esc(cr.stage)}</div>
        <div class="sc-code">${esc(cr.code)}</div>
        <div class="sc-copy">${esc(cr.copy)}</div>
        ${score}
      </div>`;
    }).join('');
    // whitespace verdict (from corpus validation) — read from pillar data; graceful when absent
    const ws  = p.whitespace || {};
    const wsV = (ws.verdict || '').toUpperCase();
    const wsBadge = wsV ? `<span class="ws-badge ${wsClass(wsV)}">${esc(wsV)}</span>` : '';
    const wsNote  = ws.note ? `<div class="ws-note"><strong>${esc(wsV || 'Verdict')}:</strong> ${esc(ws.note)}</div>` : '';
    // insight chain as an explicit audit trail
    const audit = `<div class="sc-audit">
        <div class="sc-audit-title">Insight chain · audit trail</div>
        <ol class="sc-audit-steps">
          <li><span class="sc-audit-k">Persona</span><span class="sc-audit-v">${esc(p.persona)}</span></li>
          <li><span class="sc-audit-k">Tension</span><span class="sc-audit-v">${esc(p.tension)}</span></li>
          <li><span class="sc-audit-k">Angle</span><span class="sc-audit-v">${esc(p.angle)}</span></li>
          <li><span class="sc-audit-k">Story</span><span class="sc-audit-v">${esc(p.story)}</span></li>
        </ol>
      </div>`;
    return `<div class="sc-pillar">
      <button class="sc-pillar-head" id="sc-ph-${uid}" onclick="toggleSominPillar('${uid}')" aria-expanded="false">
        <span class="sc-pillar-head-main"><span class="sc-pillar-title"><span class="sc-pillar-n">Pillar ${esc(p.n != null ? p.n : (pi+1))}</span>${esc(p.name)}</span></span>
        ${wsBadge}
        <span class="sc-caret">\u25b8</span>
      </button>
      <div class="sc-pillar-body collapsed" id="sc-pb-${uid}">
        ${audit}
        ${wsNote}
        <div class="sc-creative-row">${cells}</div>
      </div>
    </div>`;
  }).join('');
  const pillarsSection = `<div class="sc-section">
    <div class="sc-h">Three insight pillars · nine creatives</div>
    <div class="sc-lead">Each pillar runs the persona → tension → angle → story chain (shown as an audit trail) and carries a whitespace verdict from the market-corpus validation — <strong>WHITESPACE</strong> (open to own), <strong>CONTESTED</strong> (rivals already active) or <strong>EMERGING</strong> (rising, not yet crowded). Click a pillar to reveal its full-funnel set: a TOFU awareness, a MOFU consideration and a BOFU conversion creative.</div>
    ${pillarBlocks}
  </div>`;

  return `${intro}${anchorsSection}${fingerprintSection}${pillarsSection}`;
}

  if (singleMode) {

${tabBarAndPanels}

function gaugeSVG(val, bench, higher, bad){
  if (val==null || bench==null || !(bench>0)) return '';
  const perf = higher ? val/bench : bench/val;                 // >=1 means at/above target
  const good = (bad===undefined || bad===null) ? perf>=1 : !bad;
  const frac = Math.max(0.04, Math.min(1, perf/2));            // benchmark sits at the half-way tick; 2x target fills it
  const cx=20, cy=19, r=15.5;
  const a = Math.PI*(1-frac);
  const x=(cx+r*Math.cos(a)).toFixed(2), y=(cy-r*Math.sin(a)).toFixed(2);
  const col = good ? 'var(--good-text)' : 'var(--bad-text)';
  return `<svg class="bfm-gauge" viewBox="0 0 40 23" width="40" height="23" aria-hidden="true">`
    + `<path d="M4.5 19 A15.5 15.5 0 0 1 35.5 19" fill="none" stroke="var(--surface-inset)" stroke-width="5" stroke-linecap="round"/>`
    + `<path d="M4.5 19 A15.5 15.5 0 0 1 ${x} ${y}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round"/>`
    + `<line x1="20" y1="1.6" x2="20" y2="6.4" stroke="var(--text-secondary)" stroke-width="1.4" stroke-linecap="round"/>`
    + `</svg>`;
}

// ── CANONICAL BENCHMARK KEYS (single source of truth; mirrors
// meta-ads-analyzer/references/benchmarks-and-mcp.md §11.0). Writer (analyzer) and reader (this
// template) BOTH resolve keys from here — never hardcode a partial subset. Complete for every ODAX
// objective; a missing account figure is reported honestly, never relabelled as "account average".
const BENCH_KEYS = {
  OUTCOME_SALES:         { ctrLinks:'outcome_sales_avg_ctr_links',      crLinks:'outcome_sales_avg_cr_links',  cpr:'outcome_sales_avg_cpr',                  roas:'outcome_sales_avg_roas', prov:'outcome_sales_cr_links_provisional' },
  OUTCOME_LEADS:         { ctrLinks:'outcome_leads_avg_ctr_links',      crLinks:'outcome_leads_avg_cr_links',  cpr:'outcome_leads_avg_cpl',                                                 prov:'outcome_leads_cr_links_provisional' },
  OUTCOME_TRAFFIC:       { ctrLinks:'outcome_traffic_avg_ctr_links',      crLinks:'outcome_traffic_avg_cr_links', cpr:'outcome_traffic_avg_cost_per_lpv',       prov:'outcome_traffic_cr_links_provisional' },
  LINK_CLICKS:           { ctrLinks:'outcome_traffic_avg_ctr_links',                                           cpr:'outcome_traffic_avg_cost_per_link_click' },
  OUTCOME_ENGAGEMENT:    { ctrLinks:'outcome_engagement_avg_ctr_links',                                        cpr:'outcome_engagement_avg_cpe' },
  OUTCOME_AWARENESS:     {                                                                                     cpr:'outcome_awareness_avg_cpm' },
  OUTCOME_APP_PROMOTION: { ctrLinks:'app_installs_avg_ctr_links',       crLinks:'app_installs_avg_cr_links',   cpr:'app_installs_avg_cpi',                   roas:'app_installs_avg_roas',  prov:'app_installs_cr_links_provisional' },
  APP_INSTALLS:          { ctrLinks:'app_installs_avg_ctr_links',       crLinks:'app_installs_avg_cr_links',   cpr:'app_installs_avg_cpi',                   roas:'app_installs_avg_roas',  prov:'app_installs_cr_links_provisional' },
};
function effectiveObjective(camp){
  // The label/benchmark set is driven by the RESULT the campaign optimises for, not the objective name.
  // A LINK_CLICKS-objective campaign optimised for landing-page views is an LPV campaign; an
  // OUTCOME_TRAFFIC campaign optimised for link clicks is a link-clicks campaign.
  if (!camp) return 'OUTCOME_SALES';
  const og = String(camp.optimizationGoal || camp.optimization_goal || '').toUpperCase();
  if (og === 'LANDING_PAGE_VIEWS') return 'OUTCOME_TRAFFIC';   // LPV label + benchmark set
  if (og === 'LINK_CLICKS')        return 'LINK_CLICKS';       // link-click set (2-stage, no CR)
  return camp.objective || 'OUTCOME_SALES';
}
function benchKey(objective, metric){ const m = BENCH_KEYS[objective] || BENCH_KEYS.OUTCOME_SALES; return m ? m[metric] : undefined; }
// Honest label: 'account average' ONLY when the account figure for this objective exists; otherwise
// 'campaign average (no account benchmark)'. Any label for a CTR/CR bar MUST come from here, never a
// hardcoded 'account average'. QA Category 11 fails the build if this contract is broken.
function benchNoun(hasAccount){ return hasAccount ? 'account average' : 'campaign average. No account benchmark'; }
function ctrBenchNoun(camp){ return benchNoun(campAggCtrIsAccount(camp)); }
function crBenchNoun(camp){ return benchNoun(acctCrLinksIsAccount(camp)); }

function campAggCtr(camp) {
  // Account-average link CTR for this objective. Falls back to this campaign's own aggregate link CTR
  // when no account figure exists — use campAggCtrIsAccount()/benchNoun() to label the fallback honestly.
  const D = window.REPORT_DATA;
  const bm = (D && D.accountData && D.accountData.benchmarks) || {};
  const key = benchKey(effectiveObjective(camp), 'ctrLinks');
  if (key && bm[key] != null) return bm[key];
  let imp = 0, clk = 0;
  (camp.d1Ads || []).forEach(a => { if (a.d2Classification && a.d2Classification!=='INDETERMINATE') { imp += (a.impressions||0); clk += (a.link_clicks||0); } });
  return imp > 0 ? clk / imp * 100 : null;
}
function campAggCtrIsAccount(camp){ const bm=((window.REPORT_DATA||{}).accountData||{}).benchmarks||{}; const key=benchKey(effectiveObjective(camp),'ctrLinks'); return !!(key && bm[key]!=null); }

function acctCrLinks(camp) {
  // Account-average conversion rate FROM LINKS for this objective (results ÷ link clicks × 100, in
  // percent units). Falls back to this campaign's own CR benchmark only when no account figure exists —
  // use acctCrLinksIsAccount()/benchNoun() to label the fallback honestly. Returns null if neither set.
  const D = window.REPORT_DATA;
  const bm = (D && D.accountData && D.accountData.benchmarks) || {};
  const key = benchKey(effectiveObjective(camp), 'crLinks');
  if (key && bm[key] != null) return bm[key];
  return (camp.cvrBenchmark != null && camp.cvrBenchmark > 0) ? camp.cvrBenchmark : null;
}
function acctCrLinksIsAccount(camp){ const bm=((window.REPORT_DATA||{}).accountData||{}).benchmarks||{}; const key=benchKey(effectiveObjective(camp),'crLinks'); return !!(key && bm[key]!=null); }

function acctCrLinksProvisional(camp) {
  // True when the account CR-from-links figure for THIS objective is flagged provisional (tiny
  // denominator). Uses the objective's own provisional key — never a hardcoded leads flag.
  const D = window.REPORT_DATA;
  const bm = (D && D.accountData && D.accountData.benchmarks) || {};
  const key  = benchKey(effectiveObjective(camp), 'crLinks');
  const prov = benchKey(effectiveObjective(camp), 'prov');
  return !!(key && bm[key] != null && prov && bm[prov]);
}
function initAdFullCharts(campId, adId) {
  const D = window.REPORT_DATA; if (!D) return;
  const camp = D.campaignData && D.campaignData[campId]; if (!camp) return;
  const m = D.meta;
  const labels = buildDateRange(m.date_range?.since, m.date_range?.until);
  const currency = m.currency || '';
  const adDaily = (camp.d2Series || {})[adId]; if (!adDaily) return;
  buildChartAdTop('chart-ad-top-' + adId, adDaily, labels, campAggCtr(camp));
  buildChartAdBottom('chart-ad-bottom-' + adId, adDaily, labels, currency, camp.objective);
}

// Chart 1 — daily CTR + account-avg CTR reference + frequency
function buildChartAdTop(canvasId, adDaily, labels, campAvgCtr) {
  const series = adDaily && (adDaily.series || (Array.isArray(adDaily) ? adDaily : null)); if (!series) return;
  const sm = seriesMap(series);
  const datasets = [
    { label:'CTR %',     data: labels.map(d => sm[d]?.ctr ?? null),       borderColor:'#1F8A70', backgroundColor:'transparent', yAxisID:'y' },
    { label:'Frequency', data: labels.map(d => sm[d]?.frequency ?? null), borderColor:'#E67E22', backgroundColor:'transparent', yAxisID:'y1' }
  ];
  if (campAvgCtr != null) datasets.splice(1, 0, { label:'Account avg CTR', data: labels.map(() => campAvgCtr),
    borderColor:'rgba(155,168,166,0.7)', borderDash:[4,3], backgroundColor:'transparent', pointRadius:0, yAxisID:'y' });
  const canvas = document.getElementById(canvasId); if (!canvas) return;
  new Chart(canvas, { type:'line', data:{ labels, datasets },
    options:{ ...CHART_DEFAULTS, maintainAspectRatio:false, spanGaps:false,
      scales:{ x:CHART_DEFAULTS.scales.x, y:CHART_DEFAULTS.scales.y, y1:CHART_DEFAULTS.scales.y1 } } });
}
// Chart 2 — daily spend (bars) + CPM (line, derived spend/impressions×1000)
function buildChartAdBottom(canvasId, adDaily, labels, currency, objective) {
  const _L = objectiveLabels(objective);
  const series = adDaily && (adDaily.series || (Array.isArray(adDaily) ? adDaily : null)); if (!series) return;
  const sm = seriesMap(series);
  const spendData = labels.map(d => sm[d]?.spend ?? null);
  const cpmData = labels.map(d => { const r = sm[d]; if (!r || !r.impressions) return null; return (r.spend||0) / r.impressions * 1000; });
  const _sbd = {}; series.forEach(r => { _sbd[r.date] = (r.spend != null ? r.spend : null); });
  const canvas = document.getElementById(canvasId); if (!canvas) return;
  new Chart(canvas, { data:{ labels, datasets:[
      { type:'bar',  label:'Spend ('+currency+')', data:spendData, backgroundColor:'rgba(45,191,156,0.30)', borderColor:'#1F8A70', borderWidth:1, yAxisID:'y' },
      { type:'line', label:'CPM ('+currency+')',   data:cpmData,  borderColor:'#E67E22', backgroundColor:'transparent', yAxisID:'y1' }
    ] },
    options:{ ...CHART_DEFAULTS, maintainAspectRatio:false, spanGaps:false,
      scales:{ x:CHART_DEFAULTS.scales.x, y:CHART_DEFAULTS.scales.y, y1:CHART_DEFAULTS.scales.y1 } },
    plugins:[ zeroPurchasePlugin(labels, {}, _L.noun, _L.nounPlural, _sbd, true) ] });
}

function switchTab(id, idx, btn) { activateTab(id, idx); }

// Activate a tab by id + index without needing the clicked button (used by switchTab and by
// the Audience-Health → Creative-Analysis jump).
function activateTab(id, idx) {
  for (let i = 0; i < 5; i++) {
    const p = document.getElementById('tp-' + id + '-' + i);
    if (p) p.classList.toggle('active', i === idx);
  }
  const card = document.getElementById('card-' + id);
  const bar  = card ? card.querySelector('.tab-bar') : null;
  if (bar) bar.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', i === idx));
  if (!chartsInitialised[id]) {
    chartsInitialised[id] = true;
    initChartsForCampaign(id);
  }
  // A chart created while its panel was display:none has a 0-size canvas; nudge Chart.js
  // (responsive) to resize to the now-visible panel. Cheap and safe in both layouts.
  try { window.dispatchEvent(new Event('resize')); } catch (e) {}
}

function updateGoAds(campId) {   // updates BOTH ad-set action buttons (go-to-ads + compare)

function searchRows(kind, campId, q) {
  q = (q || '').trim().toLowerCase();
  const cont = document.getElementById((kind === 'adset' ? 'ah-table-' : 'ca-list-') + campId);
  if (!cont) return;
  let shown = 0;
  cont.querySelectorAll('.ca-row').forEach(r => {
    const el = r.querySelector('.ca-row-name'); const nm = ((el && (el.getAttribute('title') || el.textContent)) || '').toLowerCase();
    const match = !q || nm.indexOf(q) !== -1;
    r.classList.toggle('srch-hide', !match);
    if (match && r.style.display !== 'none') shown++;
  });
  const nr = document.getElementById('srch-none-' + kind + '-' + campId);
  if (nr) nr.style.display = (q && shown === 0) ? '' : 'none';
}
function updateAdActions(campId) {

}
const _cmpState = {};
function _cmpOpenFull(kind, campId, id) {
  if (kind === 'adset') {
    const p = document.getElementById('ca-full-as-' + id); if (p) p.classList.remove('collapsed');

function enterCompare(kind, campId) {
  const ids = _cmpSelected(kind, campId).slice(0, 3);
  if (ids.length < 2) return;
  const cont = document.getElementById((kind === 'adset' ? 'ah-table-' : 'ca-list-') + campId);
  if (!cont) return;
  cont.classList.add('cmp-active');
  cont.querySelectorAll('.ca-row').forEach(r => {
    const id = kind === 'adset' ? (r.querySelector('.adset-sel-' + campId) || {}).value : r.getAttribute('data-ad');
    if (ids.indexOf(id) !== -1) { r.classList.add('cmp-col'); r.style.display = ''; _cmpOpenFull(kind, campId, id); }
    else { r.style.display = 'none'; r.classList.remove('cmp-col'); }
  });

  if (bar) { bar.style.display = ''; const c = bar.querySelector('.cmp-bar-count'); if (c) c.textContent = ids.length; }

  if (bar && bar.scrollIntoView) bar.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function exitCompare(kind, campId) {
  const cont = document.getElementById((kind === 'adset' ? 'ah-table-' : 'ca-list-') + campId);
  if (!cont) return;
  cont.classList.remove('cmp-active');
  cont.querySelectorAll('.ca-row').forEach(r => { r.style.display = ''; r.classList.remove('cmp-col'); });
  (_cmpState[kind + '-' + campId] || []).forEach(id => {
    const pid = kind === 'adset' ? 'ca-full-as-' + id : 'ca-full-' + id;
    const cid = kind === 'adset' ? 'ca-rowchev-as-' + id : 'ca-rowchev-' + id;

    const c = document.getElementById(cid); if (c) c.classList.remove('open');
  });
  _cmpState[kind + '-' + campId] = null;
  const bar = document.getElementById('cmp-bar-' + kind + '-' + campId);
  if (bar) bar.style.display = 'none';
  requestAnimationFrame(() => requestAnimationFrame(() => { try { window.dispatchEvent(new Event('resize')); } catch (e) {} }));
}
function goToAdsFiltered(campId) {
  const ids = [...document.querySelectorAll('.adset-sel-' + campId + ':checked')].map(b => b.value);
  if (!ids.length) return;
  applyCreativeFilter(campId, ids);

function applyCreativeFilter(campId, adsetIds) {
  const arr = adsetIds ? (Array.isArray(adsetIds) ? adsetIds : [adsetIds]).filter(Boolean) : [];
  caFilter[campId] = arr.length ? arr : null;
  const set = new Set(arr);
  const filtering = arr.length > 0;
  const list = document.getElementById('ca-list-' + campId);
  if (!list) return;
  let shown = 0;
  list.querySelectorAll('.ca-row').forEach(r => {
    const match = !filtering || set.has(r.getAttribute('data-adset'));
    r.style.display = match ? '' : 'none';
    if (match) shown++;
  });
  const chip = document.getElementById('ca-filter-chip-' + campId);
  if (chip) {
    chip.style.display = filtering ? '' : 'none';
    if (filtering) {
      const nameEl = document.getElementById('ca-filter-name-' + campId);
      if (nameEl) {
        if (arr.length === 1) {
          const src = document.querySelector('#adset-head-' + arr[0] + ' .ah-row-name');
          nameEl.textContent = src ? src.textContent : arr[0];
        } else nameEl.textContent = arr.length + ' ad sets';
      }
    }
  }
  const empty = document.getElementById('ca-empty-' + campId);
  if (empty) empty.style.display = (filtering && shown === 0) ? '' : 'none';
  const head = document.getElementById('ca-camphead-' + campId);
  const foot = document.getElementById('ca-campfoot-' + campId);
  if (head) head.style.display = filtering ? 'none' : '';
  if (foot) foot.style.display = filtering ? 'none' : '';
}
