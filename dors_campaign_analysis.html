function buildActionPlan(D) {
  const currency = D.meta?.currency || '';
  const bm = D.accountData?.benchmarks || {};

  // Benchmarks reference line — show the reference(s) for THIS campaign's objective.
  const bmRef = [];
  const apCamp = Object.values(D.campaignData || {})[0] || {};
  const apObj = apCamp.objective || 'OUTCOME_SALES';
  const apL = objectiveLabels(apObj);
  if (apObj === 'OUTCOME_SALES') {
    if (bm.outcome_sales_avg_roas != null) bmRef.push(`Account avg ROAS: ${bm.outcome_sales_avg_roas.toFixed(2)}x`);
    if (bm.outcome_sales_avg_cpr  != null) bmRef.push(`Account avg ${apL.costShort}: ${currency} ${bm.outcome_sales_avg_cpr.toFixed(2)}`);
  } else if (apObj === 'APP_INSTALLS') {
    if (bm.app_installs_avg_cpi != null) bmRef.push(`Account avg ${apL.costShort}: ${currency} ${bm.app_installs_avg_cpi.toFixed(2)}`);
  } else if (apObj === 'OUTCOME_LEADS') {
    if (bm.outcome_leads_avg_cpl != null) bmRef.push(`Account avg ${apL.costShort}: ${currency} ${bm.outcome_leads_avg_cpl.toFixed(2)}`);
  } else if (apObj === 'OUTCOME_ENGAGEMENT') {
    if (bm.outcome_engagement_avg_er  != null) bmRef.push(`Account avg eng. rate: ${(bm.outcome_engagement_avg_er).toFixed(2)}%`);
    if (bm.outcome_engagement_avg_cpe != null) bmRef.push(`Account avg ${apL.costShort}: ${currency} ${bm.outcome_engagement_avg_cpe.toFixed(2)}`);
  } else if (apObj === 'OUTCOME_TRAFFIC' || apObj === 'LINK_CLICKS') {
    if (bm.outcome_traffic_avg_ctr != null) bmRef.push(`Account avg CTR: ${(bm.outcome_traffic_avg_ctr).toFixed(2)}%`);
    if (bm.outcome_traffic_avg_cost_per_link_click != null) bmRef.push(`Account avg ${apL.costShort}: ${currency} ${bm.outcome_traffic_avg_cost_per_link_click.toFixed(2)}`);
  } else if (apObj === 'OUTCOME_AWARENESS') {
    if (bm.outcome_awareness_avg_cpm != null) bmRef.push(`Account avg CPM: ${currency} ${bm.outcome_awareness_avg_cpm.toFixed(2)}`);
  }
  document.getElementById('action-plan-benchmarks').textContent = 'Account averages (same objective): ' + (bmRef.join(' · ') || '—');

  // Group campaigns by urgency from stageAnalysis.stage2
  const groups = { urgent:[], near:[], strategic:[] };
  const urgencyMap = { 'AUDIENCE':'urgent','COMPOUND':'urgent','CREATIVE_FATIGUE':'near','CREATIVE_POOR_QUALITY':'near','POST_CLICK':'strategic' };

  Object.entries(D.campaignData || {}).forEach(([id, camp]) => {
    const rc = camp.stageAnalysis?.stage2?.rootCause;
    const u  = urgencyMap[rc] || 'strategic';
    groups[u].push({ id, camp });
  });

  const container = document.getElementById('action-plan-groups');
  [['urgent','URGENT'],['near','NEAR TERM'],['strategic','STRATEGIC']].forEach(([key, label]) => {
    if (!groups[key].length) return;
    let items = groups[key]
      .sort((a,b) => (b.camp.spend||0) - (a.camp.spend||0))
      .map(({ id, camp }) => `<div class="action-item">
        <strong>${camp.name || id}</strong> — ${camp.stageAnalysis?.stage2?.recommendation || '<span class="insight-placeholder" style="display:inline;"></span>'}
        <a class="ams-link" href="${amsUrl('campaign',id)}" target="_blank">Open</a>
      </div>`).join('');
    container.insertAdjacentHTML('beforeend', `<div class="action-group">
      <span class="action-group-label action-group-${key}">${label}</span>
      ${items}
    </div>`);
  });
}

/* Populate runtime-rendered insight-placeholder divs from window.REPORT_DATA.
   Every campaign card is built at runtime (ids like tab1-prose-${id}), so the prose is
   filled here from campaignData[id].insightBlocks / accountInsightBlocks after render.
   The Creative Analysis tab (campaignData[id].sominCreative) is rendered by buildTab4, not here;
   the old sominReplacements → Recommendation-tab injection is retired. Extra limitation cards
   (D.bridgeLimitations) are still appended. Content is copied verbatim from
   report_data.json — nothing is generated here. */
function fillInsightBlocks(D) {
  const cd = D.campaignData || {};
  const acct = D.accountInsightBlocks || {};
  function contentFor(el) {
    if (el.id === 'account-headline') return acct.headline;
    if (el.id === 'urgent-callout-body') return acct.urgentCallout;
    for (const id in cd) {
      const ib = cd[id].insightBlocks || {};
      const t2 = ib.tab2AdsetConclusions || {};
      if (el.id === 'tab1-prose-' + id) return ib.tab1VerdictStatement;
      if (el.id === 'tab1-metrics-prose-' + id) return ib.tab1MetricBlock;
      if (el.id === 'tab1-seasonality-prose-' + id) return ib.tab1SeasonalityProse;
      const pp = el.parentElement ? el.parentElement.id : '';
      if (pp === 'tab2-overall-conclusion-' + id) return t2.overall;
      // (retired) tab5-fixes / tab5-learning / tab5-lookfor resolver branches removed —
      // the Recommendation tab is gone; recommendations render inline in the Overview logbook.
    }
    if (el.id && el.id.indexOf('tab2-conclusion-prose-') === 0) {
      const aid = el.id.replace('tab2-conclusion-prose-', '');
      for (const id2 in cd) {
        const t = (cd[id2].insightBlocks || {}).tab2AdsetConclusions || {};
        if (t[aid]) return t[aid];
      }
    }
    return null;
  }
  // Authored insight prose can still say "benchmark"; relabel it to match the rest of the
  // report ("account average" = same-objective account average) at injection time.
  const relabelBench = s => (typeof s === 'string')
    ? s.replace(/account benchmarks/gi, 'account averages').replace(/account benchmark/gi, 'account average')
       .replace(/benchmarks/g, 'account averages').replace(/Benchmarks/g, 'Account averages')
       .replace(/benchmark/g, 'account average').replace(/Benchmark/g, 'Account average')
    : s;
  document.querySelectorAll('.insight-placeholder').forEach(el => {
    const html = contentFor(el);
    if (html) {
      let out = relabelBench(html);
      // Force the authored verdict word (headline + campaign verdict statement) to match
      // computeVerdict()'s result, rendered as a natural clause via verdictClause().
      const syncVerdictWord = (str, vkey) => {
        if (typeof str !== 'string' || !vkey) return str;
        const anyTok = /(\bis\s+)?(<strong>)?\b(HEALTHY|SLIPPING|CRITICAL|INSUFFICIENT[_ ]DATA)\b(<\/strong>)?/g;
        return str.replace(anyTok, verdictClause(vkey));
      };
      let _vKey = null;
      if (el.id === 'account-headline') { const _ks = Object.keys(cd); if (_ks.length === 1) _vKey = cd[_ks[0]].verdict; }
      else if (el.id && el.id.indexOf('tab1-prose-') === 0) _vKey = (cd[el.id.slice('tab1-prose-'.length)] || {}).verdict;
      if (_vKey) out = syncVerdictWord(out, _vKey);
      // Colour un-wrapped "value vs account average" figures in the tab1 metric block
      // (safety net; authored metric-good/bad spans are preserved as-is).
      if (el.id && el.id.indexOf('tab1-metrics-prose-') === 0) out = colourizeAuthoredMetrics(out);
      el.innerHTML = out;
      el.classList.remove('insight-placeholder');
      if (el.id && el.id.indexOf('tab1-seasonality-prose-') === 0) el.style.display = 'block';
      // Standardise conclusion colour to the entity's own verdict (bad=red, good=green,
      // neutral=grey), overriding the authored HTML's default teal ∴ line. The CSS override
      // keys off an sb-* ancestor class, so stamp it on this container.
      // tab1-prose / tab1-metrics-prose → campaign verdict.
      let vcId = null;
      if (el.id && el.id.indexOf('tab1-prose-') === 0)          vcId = el.id.slice('tab1-prose-'.length);
      else if (el.id && el.id.indexOf('tab1-metrics-prose-')===0) vcId = el.id.slice('tab1-metrics-prose-'.length);
      if (vcId && cd[vcId]) {
        el.classList.add('sb-scope', verdictClass(cd[vcId].verdict));
      }
      // Per-ad-set conclusion → that ad set's underperform flag.
      if (el.id && el.id.indexOf('tab2-conclusion-prose-') === 0) {
        const aid = el.id.slice('tab2-conclusion-prose-'.length);
        for (const id2 in cd) {
          const as = (cd[id2].c1Adsets || []).find(a => String(a.id) === String(aid));
          if (as) { el.classList.add('sb-scope', verdictClass(!!as.underperform)); break; }
        }
      }
      // Tab-2 overall (campaign-level ad-set summary) → campaign verdict.
      const _pp = el.parentElement ? el.parentElement.id : '';
      if (_pp && _pp.indexOf('tab2-overall-conclusion-') === 0) {
        const cidO = _pp.slice('tab2-overall-conclusion-'.length);
        if (cd[cidO]) {
          const vc = verdictClass(cd[cidO].verdict);
          el.classList.add('sb-scope', vc);
          el.parentElement.classList.add(vc);   // recolour the .insight-conclusion wrapper too
        }
      }
      // Account urgent callout is always a problem summary → red.
      if (el.id === 'urgent-callout-body') el.classList.add('sb-scope', 'sb-bad');
    }
  });
  // Legacy SOMIN replacement block injection REMOVED — superseded by the dedicated Creative Analysis
  // tab (Tab 4). The old block referenced SOMIN-hosted images that have since been deleted (404),
  // so it is no longer appended to the Recommendation panel. (campaignData[id].sominReplacements
  // remains in report_data.json as dormant data but is not rendered.)
  // Optional extra limitation cards (e.g. SOMIN/bridge) → limitations grid
  const bl = D.bridgeLimitations;
  if (bl && bl.length) {
    const grid = document.getElementById('limitations-grid');
    if (grid && !document.getElementById('bridge-lim-marker')) {
      let h = '<div id="bridge-lim-marker" style="display:none"></div>';
      bl.forEach(l => { h += `<div class="limitation-card"><div class="limitation-name">${l.name}</div><div class="limitation-body">${l.body}</div><div class="limitation-resolution">Resolution: ${l.res}</div></div>`; });
      grid.insertAdjacentHTML('beforeend', h);
    }
  }
}

// ── VERDICT (report-only rule) ───────────────────────────────────────────────
// Expected results = spend / account cost-per-result (objective-aware).
//   CRITICAL : results < expected
//   HEALTHY  : results >= expected AND every spending ad set AND every delivering ad performing
//   SLIPPING : results >= expected BUT some ad set or ad underperforming
// "Performing": ad set = not underperform (breached account markers); ad = meaningful spend AND
// converts >= account CR AND CPR <= window CPR (insufficient-spend ads are excused, not failing).
function computeVerdict(camp){
  const D=window.REPORT_DATA; const bm=(D&&D.accountData&&D.accountData.benchmarks)||{};
  const snap=camp.b1Snapshot||{};
  const costKey=({OUTCOME_SALES:'outcome_sales_avg_cpr',OUTCOME_LEADS:'outcome_leads_avg_cpl',OUTCOME_ENGAGEMENT:'outcome_engagement_avg_cpe',OUTCOME_TRAFFIC:'outcome_traffic_avg_cost_per_lpv',LINK_CLICKS:'outcome_traffic_avg_cost_per_link_click',APP_INSTALLS:'app_installs_avg_cpi',OUTCOME_APP_PROMOTION:'app_installs_avg_cpi',OUTCOME_AWARENESS:'outcome_awareness_avg_cpm'})[effectiveObjective(camp)]||'outcome_sales_avg_cpr';
  const acctCpr=bm[costKey]!=null?bm[costKey]:null;
  const spend=snap.spend!=null?snap.spend:null;
  const results=snap.results!=null?snap.results:(camp.results!=null?camp.results:null);
  const expected=(acctCpr&&spend!=null)?spend/acctCpr:null;
  if(expected==null||results==null) return {key:'INSUFFICIENT_DATA',expected,results,acctCpr};
  const adsets=(camp.c1Adsets||[]).filter(a=>a&&(a.spend||0)>0);
  const adsetsAllPerforming = adsets.length===0 || adsets.every(a=>!a.underperform);
  const cvrBench=acctCrLinks(camp); const windowCpr=snap.cpr!=null?snap.cpr:null; const gate=acctCpr||0;
  const dads=(camp.d1Ads||[]).filter(a=>a&&(a.spend||0)>0&&(a.impressions||0)>1000&&a.d2Classification!=='INDETERMINATE');
  const adPerf=a=>{const sp=a.spend||0,pu=a.purchases||0,acpr=pu>0?sp/pu:Infinity;const meaningful=gate?sp>=gate:sp>0;if(!meaningful)return true;const cvrOk=(cvrBench!=null&&a.cvr!=null)?a.cvr>=cvrBench:false;const cprOk=(windowCpr!=null)?acpr<=windowCpr:false;return cvrOk&&cprOk;};
  const adsAllPerforming = dads.length===0 || dads.every(adPerf);
  let key;
  if(results<expected) key='CRITICAL';
  else if(adsetsAllPerforming&&adsAllPerforming) key='HEALTHY';
  else key='SLIPPING';
  return {key,expected,results,acctCpr,adsetsAllPerforming,adsAllPerforming};
}

function initReport() {
  const D = window.REPORT_DATA;
  if (!D) {
    document.getElementById('account-headline').textContent = 'No report data loaded. Run build_report.py to inject data.';
    document.getElementById('account-headline').style.fontStyle = 'normal';
    return;
  }

  // Report-only verdict recompute (see computeVerdict): expected = spend / account cost-per-result.
  // Overwrites the stored verdict at RENDER TIME only — report_data.json is not modified.
  Object.keys(D.campaignData||{}).forEach(cid=>{
    const camp=D.campaignData[cid]; if(!camp) return;
    const vv=computeVerdict(camp); camp._verdictCalc=vv; camp.verdict=vv.key;
    if(D.allCampaigns&&D.allCampaigns[cid]) D.allCampaigns[cid].verdict=vv.key;
  });

  buildTopBar(D);
  buildStatStrip(D);
  buildObjectiveBlocks(D);

  // Sort campaigns
  const all = D.allCampaigns || {};
  const cd  = D.campaignData || {};
  // SINGLE-CAMPAIGN MODE: only the analyzed campaign(s) — those present in campaignData —
  // are rendered as rows. The account-discovery set (allCampaigns) is NOT enumerated, so
  // campaigns that were never pulled/analyzed do not appear as shell rows. Multi-campaign
  // full-account reports keep the original behaviour and list every discovered campaign.
  const singleMode = Object.keys(cd).length === 1;
  const rowIds = singleMode ? Object.keys(cd) : Object.keys(all);
  const sorted = rowIds.sort((a,b) => {
    const va = all[a] || cd[a] || {}, vb = all[b] || cd[b] || {};
    const order = { CRITICAL:0, SLIPPING:1, HEALTHY:2, INSUFFICIENT_DATA:3 };
    const oa = order[va.verdict] ?? 3, ob = order[vb.verdict] ?? 3;
    if (oa !== ob) return oa - ob;
    if (va.verdict === 'HEALTHY') return (vb.roas||0) - (va.roas||0);
    return (vb.spend||0) - (va.spend||0);
  });

  const listEl = document.getElementById('campaign-list');
  sorted.forEach(id => {
    const camp    = cd[id]  || {};
    const allCamp = all[id] || {};
    listEl.insertAdjacentHTML('beforeend', buildCampaign(id, camp, allCamp, D));
  });

  buildActionPlan(D);
  // buildLimitations(D) removed — the Limitations section was removed from the report (report-only change)
  fillInsightBlocks(D);

  // ── SINGLE-CAMPAIGN MODE post-processing ──────────────────────────────────
  // The page IS the campaign: promote identity pills into the header, relocate the
  // urgent actions into the Overview triage, hide the now-redundant header callout and
  // the standalone consolidated action-plan section, and init charts directly (the tabs
  // render already-open, so there is no expand click to trigger lazy chart init).
  if (singleMode) {
    const id = sorted[0];
    const camp = cd[id] || {}, allCamp = all[id] || {};
    const currency = D.meta?.currency || '';

    // Header pills (ROAS / CPR / CVR window) — shown once, in the page header
    const pillsEl = document.getElementById('campaign-header-pills');
    if (pillsEl) pillsEl.innerHTML = campaignWindowPills(camp, allCamp, currency).pillsHTML;

    // NOTE: the old "Priority actions" relocation (authored urgentCallout → Overview) was
    // REMOVED — it drifted from the computed findings (e.g. labelling a performing ad the
    // "largest drain"). The Overview logbook now derives every recommendation at render time
    // from the same diagnosis the tabs use, so problems and recommendations can't contradict.
    const callout = document.querySelector('.urgent-callout');
    if (callout) callout.style.display = 'none';

    // Hide the account-level objective-triage block ("N analysed ads…") — in single mode it
    // duplicates the Overview logbook and the Ads Analysis tab.
    const objBlocks = document.getElementById('objective-blocks');
    if (objBlocks) objBlocks.style.display = 'none';

    // Hide the standalone consolidated action-plan section (recommendations now live in the
    // Overview logbook, one per problem).
    const ap = document.getElementById('action-plan') ||
               (document.getElementById('action-plan-groups') && document.getElementById('action-plan-groups').closest('section'));
    if (ap) ap.style.display = 'none';

    // Charts: tabs are already open, so init directly instead of waiting for a toggle
    if (!chartsInitialised[id]) {
      chartsInitialised[id] = true;
      requestAnimationFrame(() => { try { initChartsForCampaign(id); } catch(e) {} });
    }
  }
}

// Run on load — REPORT_DATA injected by build_report.py as first script tag
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initReport);
} else {
  initReport();
}
</script>
</body>
</html>
