ec_video_plays": 270.0, "post_reactions": 3.0, "thruplay": 42.0, "post_saves": null, "cpr": null}, {"date": "2026-07-12", "roas": null, "spend": 13.37, "ctr": 0.2625, "cpm": 35.09, "frequency": 1.22, "reach": 313.0, "impressions": 381.0, "link_clicks": 1.0, "results": 0.0, "three_sec_video_plays": 77.0, "post_reactions": null, "thruplay": 11.0, "post_saves": null, "cpr": null}], "stageAnalysis": {"stage2": {"rootCause": "POST_CLICK", "rootCauseSummary": "<ul class=\"signal-bullets\"><li>Link CTR: 1.3435% against an account average of 1.3828%. The ad earns clicks at about the rate this account normally earns them.</li><li>Click to landing page view: 620 of 650, a rate of 95.4%. The path to the site works.</li><li>Landing page view to purchase: 2 of 620, a rate of 0.32%. This is where it breaks.</li><li>Break-even gap: about 6.6 purchases are needed on the SGD 212.41 average basket, or 1.07% of the same 620 views. The rate would have to more than triple.</li><li>Creative signals: link CTR fell from 1.5704% to 1.1214% and ThruPlays per 3-second play fell from 21.4% to 15.5%. Both are real and both are secondary.</li><li>Classification: FATIGUE_POSSIBLE on a single signal, because frequency held flat at 1.20 to 1.22.</li><li class=\"signal-conclusion\">&there4; The funnel confirms a post-click failure and rules out audience and top-funnel creative. Fixing the creative would only buy more traffic that already fails to convert.</li></ul>", "ruledOut": ["AUDIENCE ruled out. The three-way test on the single ad set came back clean. Daily frequency held between 1.20 and 1.57 across all 31 days, CPM ended at SGD26.11 against SGD26.81 at the open, and window frequency of 2.83 sits below the 3.0 monitor line. Daily reach fell 27.3% but daily spend fell 27.0% at a flat CPM, so that is budget taper and not a pool running dry.", "CREATIVE_POOR_QUALITY ruled out. Poor quality requires a link CTR below the account average and flat, with no high point. This ad opened at 1.5704%, above the 1.3828% bar, and declined from there. It resonated first and faded second.", "COMPOUND ruled out. Compound requires an audience cause alongside a creative one, and the audience test exonerated delivery. Naming it compound would assert a saturation problem the data does not support and would push budget into expanding a pool that is not the constraint.", "A technical break between click and site ruled out. Click to landing page view ran at 95.4%, so the link and page load are sound."], "recommendation": "<ul class=\"signal-bullets\"><li>Stop spend: the campaign buys landing page views at SGD 2.27 and purchases at SGD 704.65 against an account average of SGD 498.91.</li><li>Action one: instrument the funnel below the landing page view. Add to cart and checkout are not exposed through the MCP, so the drop point is unknown.</li><li>Action two: fix the drop point once it is known, before touching the creative.</li><li>Action three: hold the creative. It delivers clicks at the account rate and its decline is single-signal.</li><li>Upside to protect: the 2 purchases averaged SGD 212.41 against SGD 54.50 on the 8 new brands campaign.</li><li class=\"signal-conclusion\">&there4; URGENT. The campaign is CRITICAL and 19 of the last 19 days returned nothing on SGD 829.38. Learning phase is unconfirmable, since delivery_sub_status is not returned.</li></ul>", "secondaryCause": "CREATIVE_FATIGUE_POSSIBLE", "secondaryNote": "Recorded as secondary, not primary. Link CTR and video completion both declined, but frequency never rose, so the two-signal test was not met.", "verdictReconciliation": "verdict CRITICAL matches computeVerdict(): expected 2.82 purchases from spend divided by the account bar, actual 2, so results are below expected.", "rootCauseLabel": "Post-click: the funnel breaks after the click"}, "stage3": {"campaignCtrPattern": "ALL declining, but the test cannot discriminate at one ad", "openingSummary": "The campaign runs a single ad, so the creative library is one video. Fatigue Level is 0.415, in the HIGH band of 0.35 to 0.45. Two-signal confirmation was not achieved: link CTR fell, but frequency stayed flat, so the reading is FATIGUE_POSSIBLE on one signal. Creative health is drifting down. It is not what is breaking the campaign.", "campaignCtrPatternStatement": "Link CTR declined across all ads in this campaign, which is 1 of 1. That formally reads as a campaign-wide pattern, and the script's guidance for a campaign-wide decline is to check audience health and the funnel before concluding creative fatigue. Both checks were run. Audience health came back DELIVERY CLEAN, and the funnel shows 620 of 650 link clicks reaching the site while only 2 of those 620 views converted. With a single ad there is no second creative to diverge from, so this test has no discriminating power here. The corroboration comes from the delivery read and the funnel, not from the pattern itself.", "twoSignalStatement": "<div style=\"text-transform:none;letter-spacing:normal;font-weight:400;\"><ul class=\"signal-bullets\"><li>Link CTR: fell from 1.5704% to 1.1214% on robust impression-weighted endpoints, a decline of 28.6%.</li><li>Frequency: opened at 1.20 and closed at 1.22, so it did not rise.</li><li>Engagement rate: also fell, from 2.0463% to 1.3371%, but engagement rate does not gate this verdict.</li><li class=\"signal-conclusion\">&there4; SINGLE SIGNAL ONLY. Wear-out is not confirmed, because the exposure side of the mechanism never moved.</li></ul></div>", "similarityClusterFinding": "<ul class=\"signal-bullets\"><li>Clusters: 0. The single ad has a unique creative ID, 1693953551928454, in a single ad set, and a cluster needs one creative ID across two or more ad sets.</li><li>The inverse finding: there is no creative variation at all. One creative carries 100% of the SGD 1,409.29.</li><li class=\"signal-conclusion\">&there4; The campaign holds one test rather than several, so nothing internal can separate a strong creative from a weak one.</li></ul>", "perAdDiagnosis": {"120247612816390396": {"cdsScore": 52.8, "cdsVerdict": "MODERATE", "cdsCaveat": "The Composite Differentiation Score exists to rank creatives within a campaign for refresh priority. With one creative there is nothing to rank. Format Uniqueness is undefined here, because this format is simultaneously the only format and the most common format, so both scoring branches apply and it defaults to a neutral 50. Thematic Uniqueness has no comparator and also defaults to 50. The score therefore reduces to Fatigue Resistance of 58.5 and should not be read as a differentiation finding.", "diagnosisParagraph": "Ad 'Instagram post: Every Body Matters. (Yes, you...)' had a link CTR of 1.5704% at the start of the analysis window and 1.1214% at the end, a decline of 28.6%. Frequency at the start of the window was 1.20 and closed at 1.22, so it held flat. The CTR decline does not track a frequency rise. That matters, because wear-out is the mechanism where the same accounts see an ad more often and respond less, and the exposure side of that mechanism never moved. Aggregate link CTR of 1.3435% sits just below the account bar of 1.3828%, a gap of 2.8%, so this is not a poor-quality creative either. It opened above the bar and drifted down. Classification: FATIGUE_POSSIBLE, single signal.", "businessImpact": "Fatigue Level 0.415 implies roughly a 41.5% CTR decay from exposure. The measured decline is 28.6%, so the prediction runs ahead of the measurement, which is the expected direction when API frequency stands in for per-user exposure. This creative is a MINOR contributor to the cost per purchase of SGD704.65, and the arithmetic shows why. Holding link CTR at its opening 1.5704% across all 48,380 impressions would have produced about 760 link clicks instead of 650. Those 110 extra clicks convert to about 105 further landing page views at the measured 95.38%, and at the measured 0.32% conversion rate they yield about 0.34 of one purchase. Reversing the entire CTR decline buys roughly a third of a single purchase. The campaign needed 2.82 purchases to meet the account bar and about 6.6 to break even. The three-way test returned DELIVERY CLEAN, so this fatigue is not a downstream consequence of audience saturation. It is a standalone and minor creative signal sitting on top of a post-click failure.", "fatigueLevelCaveat": "Fatigue Level 0.415 is estimated using per-ad API frequency as a proxy for per-user exposure. Actual fatigue for frequently-reached accounts is likely higher, because an average of 2.83 can hide accounts that saw the ad seven or more times.", "urgency": "NEAR TERM", "urgencyReason": "Fatigue Level sits in the 0.35 to 0.45 band with link CTR measurably falling, which is NEAR TERM under the urgency rules. It is not URGENT. Escalating on fatigue alone would trigger a redesign and a learning phase reset on traffic that converts at 0.32%, and the measured decline is worth about a third of one purchase."}}}, "stage4": {"diversityObservations": "<ul class=\"signal-bullets\"><li><b>Framework:</b> constructed for consistent comparison, not official Meta metrics or published standards.</li><li><b>Format:</b> one, video. SINGLE-FORMAT RISK. Confirmed by the creative record and the ad-level video metrics.</li><li><b>Format gap:</b> four of the five formats relevant to a website conversion campaign are absent. Static image, carousel, collection and dynamic product ad.</li><li><b>Theme:</b> one, evergreen brand. SINGLE-THEME RISK. Read from the creative body copy.</li><li><b>Theme gap:</b> eight of nine absent. No offer, no social proof, no product claim, no urgency device.</li><li><b>Creative Ratio:</b> 1.00, which lands in the HIGH band but is misleading. With one ad there is nothing to repeat, so there is no library to measure.</li><li><b>Andromeda:</b> 0 clusters. Effective unique creatives 1 of 1, so Meta treats this campaign as a single creative for auction, delivery and fatigue.</li><li><b>Root caus <style>
/* ─── SOMIN BRAND TOKENS ─────────────────────────────────────────────────── */
:root {
  --teal:           #2DBF9C;
  --teal-dark:      #1F8A70;
  --teal-light:     #D5F2EA;
  --page-bg:        #FFFFFF;
  --surface-top:    #FFFFFF;
  --surface-card:   #F2FAF8;
  --surface-inner:  #FFFFFF;
  --surface-inset:  #E4F1EC;
  --surface-2:      #FFFFFF;
  --divider:        #C9D1D0;
  --divider-soft:   #DCE6E3;
  --text-primary:   #2A3635;
  --text-secondary: #4F5D5A;
  --text-muted:     #6B7A78;
  --text-white:     #FFFFFF;
  --bad:            #C0392B;
  --bad-bg:         #FBEAE8;
  --bad-text:       #B32B1E;
  --warn:           #E67E22;
  --warn-bg:        #FBEEDF;
  --warn-text:      #A85C10;
  --good-bg:        #D5F2EA;
  --good-text:      #1F8A70;
  --neutral-bg:     #EFF4F2;
  --neutral-text:   #6B7A78;
  --card-shadow:    0 1px 2px rgba(22,32,31,0.05), 0 8px 24px rgba(22,32,31,0.07);
  --font:           'Montserrat', 'Inter', system-ui, sans-serif;
}

/* ─── BASE ───────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--page-bg);
  color: var(--text-primary);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }

/* ─── WORDMARK ───────────────────────────────────────────────────────────── */
.somin-mark { font-family: var(--font); font-weight: 800; font-size: 1.15rem; letter-spacing: normal; line-height: 1; }
.somin-mark .s-o  { color: var(--teal); }
.somin-mark .min  { color: var(--text-primary); }

/* ─── SECTION LABELS (eyebrows) ──────────────────────────────────────────── */
.eyebrow {
  font-family: var(--font);
  font-weight: 500;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--teal);
  margin-bottom: 8px;
}

/* ─── TOP BAR ────────────────────────────────────────────────────────────── */
#top-bar {
  background: var(--surface-top);
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 1000;
  height: 52px;
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 0 24px;
  border-bottom: 1px solid var(--divider);
  box-shadow: 0 1px 3px rgba(20,30,28,0.05);
}
#top-bar .bar-meta {
  display: flex;
  align-items: center;
  gap: 16px;
  flex: 1;
  font-size: 12px;
  color: var(--text-secondary);
}
#top-bar .bar-spend {
  font-weight: 700;
  font-size: 13px;
  color: var(--text-primary);
  font-variant-numeric: tabular-nums;
}
.live-pill {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  color: var(--teal);
  border: 1px solid var(--teal);
  border-radius: 4px;
  padding: 2px 7px;
  opacity: 0.85;
}

/* ─── MAIN WRAPPER ───────────────────────────────────────────────────────── */
#main { padding-top: 52px; }
.page-inner { max-width: 1200px; margin: 0 auto; padding: 0 24px 60px; }

/* ─── ACCOUNT VERDICT ────────────────────────────────────────────────────── */
#account-verdict { padding: 20px 0 8px; }
.verdict-headline {
  font-size: 17px;
  font-weight: 700;
  color: var(--text-primary);
  line-height: 1.4;
  margin-bottom: 16px;
  padding: 16px 20px;
  background: var(--surface-card);
  border-left: 4px solid var(--teal);
  border-radius: 6px;
}

/* ─── STAT STRIP ─────────────────────────────────────────────────────────── */
.stat-strip {
  display: flex;
  gap: 0;
  margin: 0 0 16px;
  border: 1px solid var(--divider);
  border-radius: 6px;
  overflow: hidden;
}
.stat-item {
  flex: 1;
  padding: 10px 14px;
  border-right: 1px solid var(--divider);
  background: var(--surface-inner);
}
.stat-item:last-child { border-right: none; }
.stat-item-risk { background: var(--bad-bg); }
.stat-value {
  font-size: 18px;
  font-weight: 700;
  color: var(--text-primary);
  font-variant-numeric: tabular-nums;
  line-height: 1.2;
}
.stat-value-good { color: var(--teal); }
.stat-value-bad  { color: var(--bad-text); }
.stat-value-warn { color: var(--warn-text); }
.stat-label {
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-top: 3px;
}

/* ─── FINDING CARDS ──────────────────────────────────────────────────────── */
.findings-grid { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
.finding-card {
  border-radius: 6px;
  border: 1px solid var(--divider);
  border-left: 3px solid var(--divider);
  overflow: hidden;
}
.finding-card-bad   { border-left-color: var(--bad);  background: var(--bad-bg); }
.finding-card-good  { border-left-color: var(--teal); background: var(--good-bg); }
.finding-card-amber { border-left-color: var(--warn); background: var(--warn-bg); }
.finding-headline {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  padding: 8px 12px 6px;
}
.finding-rows { padding: 0 12px 4px; }
.finding-row {
  display: grid;
  grid-template-columns: 200px 100px 1fr;
  gap: 8px;
  padding: 3px 0;
  border-top: 1px solid var(--divider);
  align-items: center;
}
.finding-name  { font-size: 11px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.finding-metric { font-size: 11px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.finding-value { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.finding-value-bad   { color: var(--bad-text); }
.finding-value-good  { color: var(--good-text); }
.finding-value-amber { color: var(--warn-text); }
.finding-note {
  font-size: 11px;
  color: var(--warn);
  padding: 4px 12px 8px;
  border-top: 1px solid var(--divider);
}
.finding-row-more {
  font-size: 11px;
  color: var(--text-muted);
  padding: 3px 0;
  border-top: 1px solid var(--divider);
}

/* ─── BENCHMARK GRID ─────────────────────────────────────────────────────── */
.benchmark-section { margin-bottom: 16px; }
.benchmark-group { margin-bottom: 12px; }
.benchmark-group-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--teal);
  margin-bottom: 6px;
}
.benchmark-grid {
  display: flex;
  gap: 0;
  border: 1px solid var(--divider);
  border-radius: 6px;
  overflow: hidden;
}
.benchmark-cell {
  flex: 1;
  padding: 8px 12px;
  border-right: 1px solid var(--divider);
  background: var(--surface-card);
}
.benchmark-cell:last-child { border-right: none; }
.benchmark-value { font-size: 16px; font-weight: 700; color: var(--teal); font-variant-numeric: tabular-nums; }
.benchmark-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px; }

/* ─── TRIAGE ROWS ────────────────────────────────────────────────────────── */
.triage-section { margin-bottom: 16px; }
.triage-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 12px;
  background: var(--surface-card);
  border: 1px solid var(--divider);
  border-radius: 6px;
  margin-bottom: 4px;
  font-size: 12px;
}
.triage-objective { color: var(--text-secondary); font-weight: 500; min-width: 180px; }

/* ─── VERDICT BADGES ─────────────────────────────────────────────────────── */
.badge {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 3px 8px;
  border-radius: 4px;
  white-space: nowrap;
}
.badge-critical    { background: var(--bad-bg);     color: var(--bad-text); }
.badge-slipping    { background: var(--warn-bg);    color: var(--warn-text); }
.badge-healthy     { background: var(--good-bg);    color: var(--good-text); }
.badge-insufficient { background: var(--neutral-bg); color: var(--neutral-text); }

/* ─── MOST URGENT CALLOUT ────────────────────────────────────────────────── */
.urgent-callout {
  background: var(--teal-light);
  border: 1px solid var(--teal);
  border-radius: 6px;
  padding: 14px 16px;
  margin-bottom: 20px;
}
.urgent-callout-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--teal);
  margin-bottom: 6px;
}
.urgent-callout-body {
  font-size: 13px;
  color: var(--text-primary);
  line-height: 1.6;
}

/* ─── ADS MANAGER LINK ───────────────────────────────────────────────────── */
.ams-link {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 11px;
  font-weight: 500;
  color: var(--teal);
  text-decoration: none;
  padding: 2px 7px;
  border: 1px solid var(--teal);
  border-radius: 4px;
  opacity: 0.8;
  transition: opacity 0.15s;
  white-space: nowrap;
  margin-left: 6px;
}
.ams-link:hover { opacity: 1; }
.ams-link::after { content: " ↗"; font-size: 10px; }
.meta-ico { width:15px; height:9px; flex:0 0 auto; }

/* ─── CAMPAIGN LIST ──────────────────────────────────────────────────────── */
#campaign-list { margin-bottom: 32px; }
.campaign-card {
  background: var(--surface-card);
  border: 1px solid var(--divider);
  border-radius: 12px;
  margin-bottom: 16px;
  overflow: hidden;
  box-shadow: var(--card-shadow);
}

/* ─── COLLAPSED ROW ──────────────────────────────────────────────────────── */
.collapsed-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  cursor: pointer;
  user-select: none;
  transition: background 0.1s;
}
.collapsed-row:hover { background: rgba(45,191,156,0.04); }
.chevron {
  font-size: 12px;
  color: var(--text-muted);
  transition: transform 0.2s;
  flex-shrink: 0;
  width: 16px;
}
.chevron.open { transform: rotate(90deg); }
.campaign-name-block { flex: 1; min-width: 0; }
.campaign-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.campaign-meta {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 2px;
}
.metrics-strip {
  display: flex;
  gap: 20px;
  align-items: center;
  flex-shrink: 0;
}
.metric-pill { text-align: right; }
.metric-pill-value {
  font-size: 13px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.metric-pill-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; }
.metric-good { color: var(--good-text); }
.metric-bad  { color: var(--bad-text); }
.metric-warn { color: var(--warn-text); }
.metric-neutral { color: var(--text-secondary); }

/* ─── EXPANDED AREA ──────────────────────────────────────────────────────── */
.expanded-area { display: none; border-top: 1px solid var(--divider); }
.expanded-area.open { display: block; }

/* ─── TABS ───────────────────────────────────────────────────────────────── */
.tab-bar {
  display: flex;
  gap: 0;
  border-bottom: 1px solid var(--divider);
  padding: 0 16px;
  background: var(--surface-top);
  overflow-x: auto;
}
.tab-btn {
  font-family: var(--font);
  font-size: 12px;
  font-weight: 500;
  color: var(--text-muted);
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  padding: 10px 14px;
  cursor: pointer;
  white-space: nowrap;
  transition: color 0.15s, border-color 0.15s;
}
.tab-btn:hover { color: var(--text-secondary); }
.tab-btn.active { color: var(--teal); border-bottom-color: var(--teal); }
.tab-panel { display: none; padding: 20px 16px; }
.tab-panel.active { display: block; }

/* ─── INSIGHT BLOCKS ─────────────────────────────────────────────────────── */
.insight-block {
  background: var(--surface-inner);
  border: 1px solid var(--divider);
  border-left: 3px solid var(--teal);
  border-radius: 6px;
  margin: 8px 0;
  overflow: hidden;
}
.insight-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  background: var(--surface-inset);
  flex-wrap: wrap;
}
.insight-metric-name {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-secondary);
  min-width: 160px;
}
.insight-values {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
  font-variant-numeric: tabular-nums;
}
.insight-badge {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 3px 8px;
  border-radius: 4px;
  margin-left: auto;
  white-space: nowrap;
}
.insight-badge-good    { background: var(--good-bg);    color: var(--good-text); }
.insight-badge-bad     { background: var(--bad-bg);     color: var(--bad-text); }
.insight-badge-neutral { background: var(--neutral-bg); color: var(--neutral-text); }
.insight-badge-amber   { background: var(--warn-bg);    color: var(--warn-text); }
.insight-body {
  padding: 10px 14px;
  font-size: 13px;
  color: var(--text-primary);
  line-height: 1.6;
}
.insight-conclusion {
  background: var(--surface-card);
  border-top: 1px solid var(--divider);
  padding: 10px 14px;
  font-size: 13px;
  color: var(--teal);
  font-weight: 500;
}
.insight-scale {
  font-size: 12px;
  color: var(--text-muted);
  padding: 6px 14px 10px;
  border-top: 1px solid var(--divider-soft);
}
/* Spend context block gets grey left border */
.insight-block-spend { border-left-color: var(--text-muted); }

/* ─── PROSE PLACEHOLDERS ─────────────────────────────────────────────────── */
.insight-placeholder {
  background: var(--surface-inner);
  border: 1px dashed var(--divider);
  border-radius: 6px;
  padding: 12px 14px;
  font-size: 12px;
  color: var(--text-muted);
  font-style: italic;
  margin: 8px 0;
}
.insight-placeholder::before { content: "[ Insight block pending — Stage 5 STEP 2 ]"; }

/* ─── CHART WRAPPERS ─────────────────────────────────────────────────────── */
.chart-wrap-220 { height: 220px; position: relative; margin: 12px 0; }
.chart-wrap-180 { height: 180px; position: relative; margin: 10px 0; }
.chart-wrap-strip { height: 104px; position: relative; margin: 4px 0 10px; }
.outcome-bar { background:var(--surface-inner); border:1px solid #E2E8E5; border-radius:8px; padding:10px 12px; margin:8px 0; }
.ob-title { font-size:11px; letter-spacing:.5px; text-transform:uppercase; color:var(--text-secondary); margin-bottom:8px; }
.ob-row { display:flex; align-items:center; gap:8px; margin:5px 0; font-size:12px; }
.ob-label { flex:0 0 78px; color:var(--text-secondary); }
.ob-track { flex:1 1 auto; position:relative; height:10px; background:#E7ECEA; border-radius:5px; overflow:hidden; }
.ob-fill { position:absolute; left:0; top:0; bottom:0; border-radius:5px; }
.ob-good { background:#2DBF9C; } .ob-bad { background:#C0392B; }
.ob-val { flex:0 0 auto; color:var(--text-secondary); min-width:70px; text-align:right; }
.ob-bad-txt { color:#E8776B; font-weight:700; }
.ob-bench-txt { flex:0 0 auto; color:#6B7A78; min-width:78px; }
.ob-sub { font-size:11px; letter-spacing:.4px; text-transform:uppercase; color:var(--text-secondary); margin:8px 0 2px; }
.ob-head { margin:2px 0 4px; }
.ob-head .ob-track-ghost { background:transparent; height:0; }
.ob-head-lbl { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-secondary); }
.strip-title { font-size:12px; color:var(--text-secondary); margin:8px 0 2px; }
.strip-sub { color:#6B7A78; font-size:10px; }
.healthy-adset-row { display:flex; align-items:center; gap:10px; padding:4px 0; font-size:12px; border-bottom:1px solid #1E2A28; }
.healthy-metrics { color:#2DBF9C; margin-left:auto; }
.chart-placeholder {
  height: 120px;
  background: var(--surface-inner);
  border: 1px dashed var(--divider);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: var(--text-muted);
  margin: 12px 0;
}

/* ─── SEASONALITY ────────────────────────────────────────────────────────── */
.seasonality-section {
  margin: 16px 0;
  padding: 12px 14px;
  background: var(--surface-inner);
  border: 1px solid var(--divider);
  border-left: 3px solid var(--warn);
  border-radius: 6px;
}
.seasonality-title {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--warn);
  margin-bottom: 8px;
}
.xaf-table { width: 100%; border-collapse: collapse; margin: 8px 0 4px; font-size: 12px; }
.xaf-table th { text-align: left; font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); font-weight: 600; padding: 4px 8px; border-bottom: 1px solid var(--divider); }
.xaf-table td { padding: 6px 8px; border-bottom: 1px solid var(--divider); color: var(--text-primary); }
.xaf-table tr:last-child td { border-bottom: none; }
.xaf-num { text-align: right; font-variant-numeric: tabular-nums; }
.xaf-flag { color: var(--bad-text); font-weight: 700; }
.xaf-pair { color: var(--text-secondary); }
.xaf-plus { color: var(--text-muted); }
.seasonality-dow-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin-bottom: 10px;
}
.seasonality-dow-cell {
  text-align: center;
  padding: 6px 4px;
  border-radius: 4px;
  background: var(--surface-inset);
}
.dow-label { font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
.dow-value { font-size: 13px; font-weight: 600; color: var(--text-primary); margin-top: 2px; }
.dow-strong-up   { background: var(--good-bg); }
.dow-strong-up .dow-label   { color: var(--good-text); }
.dow-strong-down { background: var(--bad-bg); }
.dow-strong-down .dow-label { color: var(--bad-text); }
.seasonality-finding { font-size: 13px; color: var(--text-primary); line-height: 1.6; }
.seasonality-none    { font-size: 12px; color: var(--text-muted); font-style: italic; }
.seasonality-collapsible { border:1px solid #E2E8E5; border-radius:8px; margin:12px 0; overflow:hidden; }
.seas-toggle { width:100%; text-align:left; background:var(--surface-inner); color:var(--text-secondary); border:none; padding:10px 12px; font:inherit; font-size:13px; cursor:pointer; display:flex; align-items:center; gap:8px; }
.seas-heading { background:var(--surface-inner); color:var(--text-secondary); padding:10px 12px; font-size:13px; font-weight:700; border-bottom:1px solid var(--divider); }
.seas-toggle::before { content:'▸'; transition:transform .15s; color:var(--text-secondary); }
.seas-toggle.open::before { transform:rotate(90deg); }
.seas-body { padding:10px 12px; }
.seas-body.collapsed { display:none; }
.seas-tabs { display:flex; gap:6px; margin-bottom:10px; }
.seas-tab { background:#E7ECEA; color:var(--text-secondary); border:1px solid #E2E8E5; border-radius:6px; padding:4px 14px; font:inherit; font-size:12px; cursor:pointer; }
.seas-tab.active { background:#2DBF9C; color:#0E1615; border-color:#2DBF9C; font-weight:600; }
.seasonality-view.hidden { display:none; }

/* Audience Health — ranked ad-set table with expandable rows */
.ah-table-intro { font-size:12px; color:var(--text-secondary); margin:8px 0 12px; }
.ah-table { display:flex; flex-direction:column; gap:8px; }
.ah-row { border:1px solid var(--divider); border-radius:8px; overflow:hidden; background:var(--surface-card); }
.ah-row-bad  { border-left:3px solid var(--bad); }
.ah-row-good { border-left:3px solid var(--teal); }
.ah-row-head { display:flex; align-items:center; gap:14px; padding:12px 14px; cursor:pointer; }
.ah-row-head:hover { background:rgba(0,0,0,0.02); }
.ah-chevron { color:var(--text-muted); font-size:17px; line-height:1; transition:transform .15s ease; flex:0 0 auto; }
.ah-row-head.open .ah-chevron { transform:rotate(90deg); }
.ah-row-id { flex:0 0 190px; width:190px; min-width:0; }
.ah-row-name { font-weight:600; font-size:13px; color:var(--text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ah-row-name-link { cursor:pointer; }
.ah-row-name-link:hover { color:var(--teal); text-decoration:underline; }
.ah-row-spend { font-size:11px; color:var(--text-muted); margin-top:2px; }
.ah-cards { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:7px; flex:1 1 auto; min-width:0; }
.ah-card { display:flex; align-items:baseline; gap:5px; padding:3px 9px; border-radius:5px; border:1px solid var(--divider); background:var(--surface-inner); white-space:nowrap; line-height:1.4; min-width:0; overflow:hidden; }
.ah-card-metric { font-size:9.5px; letter-spacing:.03em; text-transform:uppercase; color:var(--text-muted); }
.ah-card-val { font-size:12.5px; font-weight:700; color:var(--text-primary); }
.ah-card-bench { font-size:9.5px; color:var(--text-muted); }
.ah-card-good { border-color:rgba(45,191,156,0.35); }
.ah-card-good .ah-card-val { color:var(--teal); }
.ah-card-bad { background:var(--bad-bg); border-color:rgba(192,57,43,0.45); }
.ah-card-bad .ah-card-val { color:var(--bad-text); }
.ah-card-na .ah-card-val { color:var(--text-muted); }
.ah-row-badge { flex:0 0 132px; width:132px; display:flex; justify-content:flex-end; margin-left:10px; }
.ah-row-body { padding:2px 14px 14px; }
.ah-row-body.collapsed { display:none; }
.ob-note { font-size:12px; color:var(--text-secondary); padding:8px 0; }

/* Ads Analysis — ranked ad rows with funnel cards */
.ca-list { display:flex; flex-direction:column; gap:8px; }
.ca-filter-chip { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:0 0 12px; padding:8px 12px; border:1px solid var(--teal); border-radius:8px; background:var(--good-bg); font-size:12px; color:var(--text-primary); }
.ca-filter-label { color:var(--text-muted); }
.ca-filter-name { color:var(--teal); }
.ca-filter-clear { margin-left:auto; cursor:pointer; font-size:11px; font-weight:600; color:var(--text-primary); background:transparent; border:1px solid var(--divider); border-radius:5px; padding:3px 10px; }
.ca-filter-clear:hover { border-color:var(--teal); color:var(--teal); }
.ca-empty { margin:0 0 12px; padding:14px; border:1px dashed var(--divider); border-radius:8px; background:var(--surface-card); font-size:12px; color:var(--text-muted); text-align:center; }
.ca-empty a { color:var(--teal); }
.ca-row { border:1px solid var(--divider); border-radius:8px; background:var(--surface-card); overflow:hidden; }
.ca-row-head { display:flex; align-items:center; gap:12px; padding:11px 14px; flex-wrap:wrap; }
.ca-verdict { flex:0 0 auto; font-size:11px; font-weight:700; padding:4px 10px; border-radius:5px; white-space:nowrap; }
.ca-tag { display:inline-flex; align-items:center; font-size:10px; font-weight:700; padding:3px 8px; border-radius:5px; margin-left:6px; white-space:nowrap; flex:0 0 auto; }
.ca-tag-bad { background:var(--bad-bg); color:var(--bad-text); }
.ca-tag-na { background:var(--surface-inset); color:var(--text-secondary); }
.ca-crown { display:inline-flex; align-items:center; gap:4px; font-size:10px; font-weight:800; padding:3px 8px; border-radius:5px; margin-left:6px; background:#FDF3D0; color:#8A6D1A; border:1px solid #EAD9A2; white-space:nowrap; flex:0 0 auto; }
.ca-v-good { background:var(--good-bg); color:var(--good-text); }
.ca-v-bad  { background:var(--bad-bg);  color:var(--bad-text); }
.ca-v-na   { background:var(--neutral-bg); color:var(--text-muted); }
.ca-row-id { flex:1 1 180px; min-width:150px; }
.ca-row-name { font-weight:600; font-size:13px; color:var(--text-primary); word-break:break-word; }
.ca-row-spend { font-size:11px; color:var(--text-muted); margin-top:2px; }
.ca-cards { display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex:0 0 auto; }
.ca-card { display:inline-flex; align-items:center; gap:7px; padding:6px 11px; border-radius:6px; border:1px solid var(--divider);
  background:var(--surface-inner); color:var(--text-secondary); font-size:12px; cursor:pointer; font-family:inherit; }
.ca-card:hover { border-color:var(--teal); }
.ca-card-t { font-weight:600; color:var(--text-primary); }
.ca-card-static { display:inline-flex; flex-wrap:wrap; align-items:center; justify-content:flex-end; gap:3px 10px; padding:5px 10px; background:var(--surface-inner); border:1px solid var(--divider); border-radius:8px; max-width:560px; }
.ca-card-static + .ca-card-static { margin-left:8px; }
.bfm { display:flex; flex-direction:column; align-items:flex-end; line-height:1.15; }
.bfm-l { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--text-muted); }
.bfm-v { font-size:13px; font-weight:800; }
.bfm-b { font-size:9px; color:var(--text-muted); white-space:nowrap; }
.adset-sel { width:15px; height:15px; accent-color:var(--teal-dark); cursor:pointer; margin:0 4px; flex:0 0 auto; }
.ah-actionbar { display:flex; align-items:center; gap:12px; margin:0 0 12px; flex-wrap:wrap; }
.ah-goads { background:var(--teal-dark); color:#fff; border:none; border-radius:6px; padding:8px 15px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; }
.ah-goads:disabled { background:var(--surface-inset); color:var(--text-muted); cursor:default; }
.ah-selhint { font-size:11px; color:var(--text-muted); }
.ah-searchrow { display:flex; align-items:center; gap:10px; margin:0 0 10px; }
.ah-search { flex:0 1 340px; padding:8px 12px; border:1px solid var(--divider); border-radius:7px; font-size:13px; font-family:inherit; color:var(--text-primary); background:var(--surface); }
.ah-search:focus { outline:none; border-color:var(--teal); }
.srch-none { font-size:12px; color:var(--text-muted); }
.srch-hide { display:none !important; }
.ah-compare { background:#fff; color:var(--teal-dark); border:1.5px solid var(--teal-dark); }
.ah-compare:disabled { background:var(--surface-inset); color:var(--text-muted); border:1.5px solid var(--divider); }
.cmp-bar { display:flex; align-items:center; gap:12px; margin:0 0 12px; padding:9px 13px; border:1px solid var(--teal); border-radius:8px; background:var(--good-bg); font-size:13px; font-weight:700; color:var(--text-primary); }
.cmp-bar button { background:var(--teal-dark); color:#fff; border:none; border-radius:6px; padding:7px 13px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; }
.cmp-active { display:flex !important; flex-direction:row !important; gap:16px; align-items:flex-start; overflow-x:auto; padding-bottom:10px; }
.cmp-active .ca-row { flex:1 1 0; min-width:340px; max-width:600px; border:1px solid var(--divider); border-radius:10px; background:var(--surface); }
.cmp-active .ca-row-head { flex-wrap:wrap; }
.cmp-active .ca-funnelcards { flex-direction:column; gap:8px; padding-bottom:8px; }
.cmp-active .ca-fcard { flex:0 0 auto; padding:8px 11px; }
.cmp-active .ca-full.collapsed { display:block; }
.ca-card-sub { font-size:11px; }
.ca-sub-good { color:var(--teal); } .ca-sub-bad { color:var(--bad-text); }
.ca-caret { color:var(--text-secondary); font-size:17px; font-weight:700; line-height:1; transition:transform .15s ease; }
.ca-rowchev { flex:0 0 auto; background:none; border:none; padding:2px 8px 2px 2px; margin:0; cursor:pointer; color:var(--text-muted); font-family:inherit; display:inline-flex; align-items:center; align-self:center; }
.ca-rowchev:hover { color:var(--text-primary); }
.ca-rowchev.open .ca-caret { transform:rotate(90deg); }
.ca-card.open .ca-caret { transform:rotate(90deg); }
.ca-full-btn.open .ca-caret { transform:rotate(90deg); }
/* task 2: bigger, performance-coloured row expand chevron + Open stacked below the metric cards */
.ca-rowchev .ca-caret { font-size:22px; }
.ca-rowchev-bad .ca-caret  { color:var(--bad-text); }
.ca-rowchev-good .ca-caret { color:var(--teal); }
.ca-right { display:flex; flex-direction:column; align-items:flex-end; gap:5px; flex:0 0 auto; }
.ca-row-id-ads { flex:0 1 auto; min-width:130px; max-width:230px; }
.ca-funnelcards { display:flex; flex-wrap:wrap; gap:10px; padding:2px 14px 12px; }
.ca-fcard { flex:1 1 320px; border:1px solid var(--divider); border-radius:8px; background:var(--surface-inner); padding:9px 13px; }
.ca-fcard-h { font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--text-secondary); margin-bottom:8px; display:flex; align-items:center; gap:8px; }
.ca-fcard-body { display:flex; flex-wrap:wrap; gap:10px 22px; }
.ca-fcard-body .bfm { align-items:flex-start; }
.ca-right .ams-link { margin-left:0; }
.ca-panel { padding:0 14px 12px; }
.ca-panel.collapsed { display:none; }
.ca-strip { display:flex; flex-wrap:wrap; gap:8px; }
.ca-chip { display:flex; flex-direction:column; gap:2px; padding:7px 11px; border:1px solid var(--divider); border-radius:6px; background:var(--surface-inner); min-width:96px; }
.ca-chip-l { font-size:9.5px; letter-spacing:.03em; text-transform:uppercase; color:var(--text-muted); }
.ca-chip-v { font-size:13px; font-weight:600; color:var(--text-primary); }
.ca-chip-b { font-size:9px; color:var(--text-muted); }
.ca-metricstrip { border-top:1px solid var(--divider); padding:9px 14px; }
.cms-h { font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--text-secondary); margin-bottom:7px; display:flex; align-items:center; gap:8px; }
.ca-bars { }
.ca-bars-title { font-size:11px; color:var(--text-muted); margin:2px 0 8px; }
.ca-full-btn { margin:0 14px 12px; padding:7px 12px; border:1px dashed var(--divider); border-radius:6px; background:transparent;
  color:var(--text-secondary); font-size:12px; font-weight:600; cursor:pointer; font-family:inherit; display:inline-flex; align-items:center; gap:6px; }
.ca-full-btn:hover { border-color:var(--teal); color:var(--text-primary); }
.ca-full { padding:0 14px 14px; }
.ca-full.collapsed { display:none; }
.ca-charts { display:flex; flex-wrap:wrap; gap:16px; }
.ca-chart { flex:1 1 320px; min-width:280px; }
.funnel-wrap { margin:8px 0 14px; }
.funnel-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:4px; }
.funnel-verdict { display:flex; gap:18px; align-items:center; flex-wrap:wrap; margin:8px 0 14px; }
.funnel-verdict .funnel-main { flex:1 1 430px; min-width:0; }
.funnel-verdict .funnel-wrap { margin:0; }
.funnel-concl { flex:1 1 250px; padding:12px 15px; border:1px solid var(--divider); border-left:4px solid var(--teal); border-radius:9px; background:var(--surface-inner); font-size:13px; line-height:1.5; color:var(--text-primary); font-weight:600; }
.funnel-concl.fc-bad { border-left-color:var(--bad-text); }
.funnel-concl.fc-good { border-left-color:var(--good-text); }
.funnel-title { font-size:12px; font-weight:700; color:var(--text-secondary); margin-bottom:4px; }
.funnel-svg { width:100%; max-width:520px; height:auto; display:block; }
.funnel-note { font-size:10.5px; color:var(--text-muted); line-height:1.5; margin-top:4px; max-width:520px; }
.funnel-none { font-size:11px; color:var(--text-muted); padding:8px 0; }

/* ── Single-campaign header pills ─────────────────────────────────────────── */
.header-pills { display:flex; flex-wrap:wrap; gap:10px; margin:14px 0 4px; }
.header-pills:empty { display:none; }
.header-pills .metric-pill { background:var(--surface-2, #16201F); border:1px solid var(--divider);
  border-radius:8px; padding:8px 14px; min-width:96px; }
.header-pills .metric-pill-value { font-size:18px; font-weight:800; }
.header-pills .metric-pill-label { font-size:10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.4px; margin-top:2px; }

/* ── Overview: Biggest problems ───────────────────────────────────────────── */
.problems-block { margin:18px 0 8px; }
.problems-head { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:10px; }
.problems-title { font-size:14px; font-weight:800; color:var(--text-primary); }
.problems-sub { font-size:11px; color:var(--text-muted); }
.problems-empty { font-size:12px; color:var(--text-muted); background:var(--surface-2,#16201F);
  border:1px solid var(--divider); border-radius:8px; padding:12px 14px; }
.problem-row { display:flex; align-items:stretch; gap:12px; padding:10px 12px; border:1px solid var(--divider);
  border-left-width:3px; border-radius:8px; margin-bottom:8px; background:var(--surface-2,#16201F); }
.problem-adset { border-left-color:#E0765C; }
.problem-ad    { border-left-color:#E0765C; }
.problem-main { flex:1 1 auto; min-width:0; }
.problem-name-row { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
.problem-kind { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--text-muted);
  border:1px solid var(--divider); border-radius:4px; padding:1px 6px; margin-right:0; }
.problem-name { font-size:13px; font-weight:700; color:var(--text-primary); }
.problem-context { font-size:11px; color:var(--text-muted); }
.problem-diag { font-size:9px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; color:var(--text-secondary);
  border:1px solid var(--divider); border-radius:4px; padding:1px 6px; white-space:nowrap; }
.problem-kind { font-size:9px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; border-radius:4px;
  padding:1px 7px; white-space:nowrap; border:1px solid transparent; }
.problem-kind-ad       { color:#2F5CA6; background:rgba(91,141,239,0.16);  border-color:rgba(91,141,239,0.38); }
.problem-kind-adset    { color:#6B3FA6; background:rgba(155,109,224,0.16); border-color:rgba(155,109,224,0.38); }
.problem-kind-campaign { color:#8A5E12; background:rgba(224,160,60,0.16);  border-color:rgba(224,160,60,0.38); }
.problem-line { font-size:11px; color:var(--text-secondary); margin-top:4px; }
.problem-why { margin:6px 0 0; padding:0; }
.problem-why li { list-style:none; position:relative; padding-left:14px; font-size:11px; color:var(--text-secondary); line-height:1.5; margin:2px 0; }
.problem-why li:before { content:'\2022'; position:absolute; left:2px; color:#E0765C; font-weight:700; }
.problem-risk { text-align:right; flex:0 0 auto; padding-top:2px; }
.problem-risk-val { font-size:15px; font-weight:800; color:#E0765C; }
.problem-risk-lbl { font-size:9px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.4px; }
.problem-jump { flex:0 0 auto; background:transparent; border:1px solid var(--divider); color:var(--text-secondary);
  border-radius:6px; padding:6px 10px; font-size:11px; font-weight:600; cursor:pointer; white-space:nowrap; margin-top:2px; }
.problem-jump:hover { border-color:var(--teal,#2DBF9C); color:var(--text-primary); }
.problems-more { font-size:11px; color:var(--text-muted); padding:4px 2px 0; }

/* ── Overview logbook (problem → recommendation) ──────────────────────────── */
.overview-verdict { display:inline-block; font-size:14px; color:var(--text-primary); line-height:1.6; margin:2px 0 10px; padding:8px 12px; border-radius:8px; }
.overview-verdict.verdict-critical { background:var(--bad-bg);  color:var(--bad-text); }
.overview-verdict.verdict-slipping { background:var(--warn-bg); color:var(--warn-text); }
.overview-verdict.verdict-healthy  { background:var(--good-bg); color:var(--good-text); }
.logbook-intro { font-size:12px; color:var(--text-muted); margin:10px 0 14px; line-height:1.55; }
.logbook { margin:6px 0 8px; }
.logbook-section { margin:16px 0; }
.lg-swatch { display:inline-block; width:9px; height:9px; border-radius:2px; background:var(--bad); margin-right:5px; vertical-align:middle; }
.pill-legend { text-align:right; font-size:10px; color:var(--text-secondary); margin:0 0 6px; white-space:nowrap; line-height:1.3; }
.problem-campaign { border-left-color:#E0B25C; }
.problem-campaign-critical { border-left-color: var(--bad); }
.problem-horizon { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; padding:2px 8px; border-radius:10px; margin-left:6px; white-space:nowrap; }
.problem-horizon-short { background:var(--teal-dark); color:#fff; }
.problem-horizon-long  { background:var(--surface-inset); color:var(--text-secondary); border:1px solid var(--divider); }
.problem-horizon-both  { background:var(--teal-light); color:var(--teal-dark); border:1px solid var(--teal); }
.rec-hz { margin-top:6px; font-size:12.5px; line-height:1.5; color:var(--text-primary); }
.rec-hz:first-child { margin-top:0; }
.rec-hz-tag { display:inline-block; font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; padding:2px 8px; border-radius:4px; margin-right:8px; }
.rec-short { background:var(--teal-dark); color:#fff; }
.rec-long  { background:var(--surface-inset); color:var(--text-secondary); border:1px solid var(--divider); }
.problem-time { font-size:10.5px; font-weight:600; color:var(--text-muted); font-variant-numeric:tabular-nums; white-space:nowrap; }
.problem-name-row { justify-content:flex-start; }
.problem-why-line { font-size:12.5px; line-height:1.55; color:var(--text-primary); margin:2px 0 6px; }
.problem-lbl-why  { display:inline-block; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; color:var(--teal-dark); margin-right:8px; }
.problem-rec { margin-top:8px; padding:8px 10px; background:var(--surface-inner,#0E1615); border:1px solid var(--divider);
  border-radius:6px; font-size:12px; color:var(--text-primary); line-height:1.55; }
.problem-rec-tag { display:inline-block; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.5px;
  color:var(--teal,#2DBF9C); margin-right:6px; }
/* right-hand column: jump button (top) + the four figures (bottom-right) */
.problem-side { flex:0 0 auto; display:flex; flex-direction:column; align-items:flex-end; justify-content:space-between; gap:12px; }
.problem-metrics { display:grid; grid-template-columns:repeat(2,minmax(58px,auto)); gap:5px 16px; text-align:right; }
.pm-cell { display:flex; flex-direction:column; align-items:flex-end; line-height:1.15; }
.pm-val { font-size:13px; font-weight:800; color:var(--text-primary); font-variant-numeric:tabular-nums; }
.pm-val.pm-bad { color:#E0765C; }
.pm-lbl { font-size:8px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.4px; margin-top:1px; }

/* ── (retired) Overview Priority-actions styles — kept harmless; block removed from UI ── */
.actions-block { margin:18px 0 8px; border:1px solid var(--divider); border-radius:8px; padding:12px 14px;
  background:var(--surface-2,#16201F); }
.actions-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.actions-title { font-size:14px; font-weight:800; color:var(--text-primary); }
.actions-seeall { background:transparent; border:1px solid var(--divider); color:var(--text-secondary);
  border-radius:6px; padding:5px 10px; font-size:11px; font-weight:600; cursor:pointer; }
.actions-seeall:hover { border-color:var(--teal,#2DBF9C); color:var(--text-primary); }
.actions-more { font-size:11px; color:var(--text-muted); margin-top:6px; }
.campaign-standalone { margin-bottom:32px; }
.ca-expl { font-size:12.5px; color:var(--text-secondary); line-height:1.6; margin-top:10px; padding:10px 12px; background:var(--surface-inner); border:1px solid var(--divider); border-radius:6px; }
.seas-hour-grid { display:grid; grid-template-columns:repeat(12,1fr); gap:3px; margin:8px 0; }
.seas-hour-cell { background:var(--surface-inner); border:1px solid #E2E8E5; border-radius:4px; padding:4px 2px; text-align:center; font-size:9px; }
.seas-hour-cell .h-lab { color:#6B7A78; }
.seas-hour-cell .h-val { color:var(--text-primary); font-size:10px; margin-top:1px; font-weight:600; }
.seas-hour-cell.dow-strong-up   { border-color:#2DBF9C; }
.seas-hour-cell.dow-strong-down { border-color:#C0392B; }
.seas-hour-cell.h-nodata { opacity:.4; }

/* ─── PER-AD TABLE ───────────────────────────────────────────────────────── */
.ad-table-scroll {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  margin: 12px 0;
  border: 1px solid var(--divider);
  border-radius: 6px;
}
.ad-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  margin: 0;
}
.ad-table th {
  text-align: left;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-muted);
  padding: 6px 8px;
  border-bottom: 1px solid var(--divider);
  white-space: nowrap;
}
.ad-table td {
  padding: 7px 8px;
  border-bottom: 1px solid var(--divider);
  font-variant-numeric: tabular-nums;
  color: var(--text-primary);
  vertical-align: middle;
}
.ad-table tr:last-child td { border-bottom: none; }
.ad-table tr:hover td { background: rgba(45,191,156,0.03); }
.ad-name-cell { max-width: 150px; }
.ad-name-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }

/* Severity badges for Fatigue Level */
.fl-badge {
  font-size: 10px;
  font-weight: 600;
  padding: 2px 6px;
  border-radius: 3px;
  text-transform: uppercase;
}
.fl-low      { background: var(--good-bg);    color: var(--good-text); }
.fl-moderate { background: var(--warn-bg);    color: var(--warn-text); }
.fl-high     { background: var(--warn-bg);    color: var(--warn-text); }
.fl-very-high { background: var(--bad-bg);    color: var(--bad-text); }

/* Classification badges */
.class-badge { font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 3px; text-transform: uppercase; white-space: nowrap; }
.class-fatigue-confirmed { background: var(--bad-bg);     color: var(--bad-text); }
.class-fatigue-possible  { background: var(--warn-bg);    color: var(--warn-text); }
.class-poor-quality      { background: #F2E9F4;            color: #8A5A9A; }
.class-stable            { background: var(--good-bg);    color: var(--good-text); }
.class-indeterminate     { background: var(--neutral-bg); color: var(--neutral-text); }

/* ─── THREE-WAY VERDICT DISPLAY ──────────────────────────────────────────── */
.three-way-verdict {
  padding: 12px 14px;
  border-radius: 6px;
  margin-bottom: 12px;
  border-left: 4px solid var(--divider);
  background: var(--surface-inner);
}
.three-way-verdict.saturation  { border-left-color: var(--bad); }
.three-way-verdict.fatigue     { border-left-color: var(--warn); }
.three-way-verdict.pressure    { border-left-color: #47534F; }
.three-way-verdict.healthy     { border-left-color: var(--teal); }
.verdict-plain { font-size: 13px; color: var(--text-primary); line-height: 1.6; margin-bottom: 6px; }
.verdict-technical { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-secondary); }

/* ─── FUNNEL CHART SECTION ───────────────────────────────────────────────── */
.funnel-type-line {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 12px;
}
.chart-wrap-funnel { position: relative; margin: 12px 0; }

/* ─── TAB 4 — CREATIVE ANALYSIS (sominCreative) ──────────────────────────── */
.sc-intro { font-size:13px; color:var(--text-secondary); line-height:1.6; margin:4px 0 20px; }
.sc-section { margin:0 0 26px; }
.sc-h { font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--teal); margin:0 0 8px; font-weight:700; }
.sc-lead { font-size:12px; color:var(--text-secondary); line-height:1.6; margin:0 0 12px; }
.sc-caveat { font-size:11px; color:var(--text-muted); line-height:1.55; margin-top:10px; padding:8px 12px; border-left:2px solid var(--divider); background:var(--surface-inner); border-radius:0 6px 6px 0; }
.sc-anchor-list { list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:8px; }
.sc-anchor-list li { display:flex; flex-direction:row; align-items:center; gap:14px; padding:10px 12px; border:1px solid var(--divider); border-radius:8px; background:var(--surface-card); }
.sc-anchor-thumb { width:120px; height:120px; flex:none; object-fit:contain; background:var(--surface-inner); border:1px solid var(--divider); border-radius:6px; }
.sc-anchor-thumb-empty { display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--text-muted); text-align:center; }
.sc-anchor-text { display:flex; flex-direction:column; gap:3px; min-width:0; }
.sc-anchor-name { font-size:12px; font-weight:700; color:var(--text-primary); font-family:ui-monospace,Menlo,Consolas,monospace; }
.sc-anchor-note { font-size:11px; color:var(--text-muted); line-height:1.5; }
.sc-anchor-route { font-size:9px; font-weight:700; letter-spacing:.5px; color:var(--teal); border:1px solid var(--divider); border-radius:4px; padding:1px 6px; margin-left:6px; }
.sc-score { font-size:10px; color:var(--text-muted); padding:0 10px 12px; }
.sc-score-rec { color:var(--teal); font-weight:700; }
.sc-fp-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; }
.sc-fp-dim { border:1px solid var(--divider); border-radius:8px; background:var(--surface-card); padding:12px; }
.sc-fp-dim-name { font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--text-muted); margin-bottom:8px; }
.sc-fp-chips { display:flex; flex-wrap:wrap; gap:6px; }
.sc-chip { font-size:11px; color:var(--text-primary); background:var(--surface-inner); border:1px solid var(--divider); border-radius:999px; padding:3px 10px; }
.sc-verdict { color:var(--teal); font-weight:700; letter-spacing:.5px; }
.sc-pillar { border:1px solid var(--divider); border-radius:10px; background:var(--surface-card); padding:14px; margin:0 0 14px; }
.sc-pillar-head { margin-bottom:12px; }
.sc-pillar-title { font-size:14px; font-weight:700; color:var(--text-primary); margin-bottom:6px; }
.sc-pillar-n { display:inline-block; font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--teal); border:1px solid var(--teal); border-radius:4px; padding:1px 7px; margin-right:8px; vertical-align:middle; }
.sc-chain { font-size:11px; color:var(--text-muted); line-height:1.7; }
.sc-chain span { color:var(--text-secondary); }
.sc-creative-row { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
.sc-creative { border:1px solid var(--divider); border-radius:8px; background:var(--surface-inner); overflow:hidden; display:flex; flex-direction:column; }
.sc-creative-imgwrap { width:100%; aspect-ratio:4/5; background:var(--surface-card); overflow:hidden; }
.sc-creative-img { width:100%; height:100%; object-fit:cover; display:block; }
.sc-stage { font-size:10px; letter-spacing:1.5px; font-weight:700; padding:6px 10px 0; }
.sc-stage-tofu { color:#7FB0FF; }
.sc-stage-mofu { color:#A85C10; }
.sc-stage-bofu { color:var(--teal); }
.sc-code { font-size:9px; letter-spacing:1px; color:var(--text-muted); padding:2px 10px 0; font-family:ui-monospace,Menlo,Consolas,monospace; }
.sc-copy { font-size:11px; color:var(--text-secondary); line-height:1.5; padding:6px 10px 12px; }
/* SOMIN pillar — collapsible head + whitespace verdict + insight-chain audit trail */
.sc-pillar-head { display:flex; align-items:center; gap:12px; width:100%; background:transparent; border:0; padding:0; cursor:pointer; text-align:left; }
.sc-pillar-head-main { flex:1 1 auto; min-width:0; }
.sc-pillar-head .sc-pillar-title { margin-bottom:0; }
.ws-badge { flex:0 0 auto; font-size:10px; font-weight:700; letter-spacing:1px; text-transform:uppercase; padding:4px 10px; border-radius:5px; white-space:nowrap; border:1px solid transparent; }
.ws-whitespace { background:rgba(45,191,156,0.14); color:#2DBF9C; border-color:rgba(45,191,156,0.40); }
.ws-contested  { background:rgba(224,118,92,0.14); color:#E0937A; border-color:rgba(224,118,92,0.40); }
.ws-emerging   { background:rgba(92,168,224,0.14); color:#7FB6E0; border-color:rgba(92,168,224,0.40); }
.ws-na         { background:var(--neutral-bg); color:var(--text-muted); }
.sc-caret { flex:0 0 auto; color:var(--text-muted); font-size:12px; transition:transform .15s ease; }
.sc-pillar-head.open .sc-caret { transform:rotate(90deg); }
.sc-pillar-body { margin-top:14px; }
.sc-pillar-body.collapsed { display:none; }
.sc-audit { border:1px dashed var(--divider); border-radius:8px; background:var(--surface-inner); padding:10px 12px; margin-bottom:12px; }
.sc-audit-title { font-size:9.5px; letter-spacing:1.2px; text-transform:uppercase; color:var(--text-muted); margin-bottom:8px; font-weight:700; }
.sc-audit-steps { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:5px; }
.sc-audit-steps li { display:flex; gap:10px; align-items:baseline; font-size:11px; }
.sc-audit-k { flex:0 0 64px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.5px; font-size:9.5px; font-weight:700; }
.sc-audit-v { color:var(--text-secondary); line-height:1.5; }
.ws-note { font-size:11px; color:var(--text-secondary); line-height:1.55; margin-bottom:12px; }
.ws-note strong { color:var(--text-primary); }
@media (max-width:640px){ .sc-creative-row { grid-template-columns:1fr; } }

/* ─── (retired) Recommendation-tab styles — tab removed; recs are inline in the Overview logbook ── */
.urgency-strip {
  border-radius: 6px;
  padding: 10px 16px;
  margin-bottom: 16px;
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}
.urgency-urgent   { background: var(--teal);      color: #0D2B22; }
.urgency-near     { background: var(--teal-dark);  color: #FFFFFF; }
.urgency-strategic { background: var(--surface-card); color: var(--text-secondary); border: 1px solid var(--divider); }
.urgency-monitor  { background: var(--surface-card); color: var(--text-muted); border: 1px solid var(--divider); }

.rec-block { margin-bottom: 16px; }
.rec-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--teal);
  margin-bottom: 6px;
}
.rec-content {
  font-size: 13px;
  color: var(--text-primary);
  line-height: 1.6;
  padding: 10px 14px;
  background: var(--surface-inner);
  border: 1px solid var(--divider);
  border-radius: 6px;
}
.evidence-chain {
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.7;
  font-variant-numeric: tabular-nums;
  padding: 10px 14px;
  background: var(--surface-inner);
  border: 1px solid var(--divider);

}
.learning-warning {
  font-size: 13px;
  color: var(--warn-text);
  line-height: 1.6;
  padding: 10px 14px;
  background: var(--warn-bg);
  border: 1px solid var(--warn);
  border-radius: 6px;
}
.source-block {
  font-size: 11px;
  color: var(--text-muted);
  line-height: 1.6;
  padding: 10px 14px;
  background: var(--surface-inner);
  border: 1px solid var(--divider);
  border-radius: 6px;
}

/* ─── ADSET BLOCK ────────────────────────────────────────────────────────── */
.adset-block {
  margin-bottom: 20px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--divider);
}
.adset-block:last-child { border-bottom: none; }
.adset-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}
.adset-name { font-size: 13px; font-weight: 600; color: var(--text-primary); }
.adset-spend { font-size: 12px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.adset-pct   { font-size: 11px; color: var(--text-muted); }

/* ─── SATURATION EXPLAINER BLOCKS ────────────────────────────────────────── */
.explainer-block {
  margin: 12px 0;
  padding: 12px 14px;
  background: var(--surface-inner);
  border: 1px solid var(--divider);
  border-left: 3px solid var(--text-muted);
  border-radius: 6px;
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.6;
}
.explainer-block strong { color: var(--text-primary); }

/* ─── TWO-SIGNAL STATEMENT ───────────────────────────────────────────────── */
.two-signal-stmt {
  margin: 16px 0;
  padding: 10px 14px;
  background: var(--surface-inner);
  border: 1px solid var(--divider);
  border-left: 3px solid var(--teal);
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

/* ─── DIVERSITY OBSERVATIONS ─────────────────────────────────────────────── */
.diversity-block {
  margin: 12px 0;
  padding: 12px 14px;
  background: var(--surface-inner);
  border: 1px solid var(--divider);

/* Verdict-scoped conclusion colour — good=green (teal), bad=red, neutral=grey.
   Applied via a modifier class on the <ul class="signal-bullets sb-good|sb-bad|sb-neutral">
   OR on an ancestor (sb-scope) so the ∴ takeaway is never green when the finding is negative.
   Selectors below match the base rule's shape plus the modifier so they win on specificity.
   Default (no modifier) stays teal for backward compatibility. */

ul.signal-bullets.sb-bad li.signal-conclusion { color: var(--bad-text); }

ul.signal-bullets.sb-good li.signal-conclusion { color: var(--good-text); }
.sb-good ul.signal-bullets li.signal-conclusion::before,
ul.signal-bullets.sb-good li.signal-conclusion::before { color: var(--good-text); }
.sb-neutral ul.signal-bullets li.signal-conclusion,
ul.signal-bullets.sb-neutral li.signal-conclusion { color: var(--text-secondary); }
.sb-neutral ul.signal-bullets li.signal-conclusion::before,
ul.signal-bullets.sb-neutral li.signal-conclusion::before { color: var(--text-secondary); }

   sit ON the block or on the inner placeholder element, so cover both. */
.sb-bad.insight-conclusion, .sb-bad .insight-conclusion, .insight-conclusion .sb-bad, .insight-conclusion.sb-bad { color: var(--bad-text); }
.sb-good.insight-conclusion, .sb-good .insight-conclusion, .insight-conclusion .sb-good, .insight-conclusion.sb-good { color: var(--teal); }
.sb-neutral.insight-conclusion, .sb-neutral .insight-conclusion, .insight-conclusion .sb-neutral, .insight-conclusion.sb-neutral { color: var(--text-secondary); }

<script>
/* ════════════════════════════════════════════════════════════════════════════
   HELPER FUNCTIONS
   ════════════════════════════════════════════════════════════════════════ */

function buildDateRange(since, until) {
  const dates = [];
  const d = new Date(since + 'T00:00:00Z');
  const end = new Date(until + 'T00:00:00Z');
  while (d <= end) {
    dates.push(d.toISOString().slice(0, 10));
    d.setUTCDate(d.getUTCDate() + 1);
  }
  return dates;
}

function amsUrl(level, entityId) {
  const D = window.REPORT_DATA;
  if (!D) return '#';
  const act  = D.accountData.accountId;
  const biz  = D.accountData.businessId;
  const base = 'https://adsmanager.facebook.com/adsmanager/manage';
  const scope = biz ? `&business_id=${biz}&global_scope_id=${biz}` : '';
  switch (level) {
    case 'account':  return `${base}/campaigns?act=${act}${scope}`;
    case 'campaign': return `${base}/adsets?act=${act}${scope}&selected_campaign_ids=${entityId}`;
    case 'adset':    return `${base}/ads?act=${act}${scope}&selected_adset_ids=${entityId}`;
    case 'ad': {
      // `selected_ad_ids` alone only highlights the ad — the Ads table still lists every ad at
      // account scope. Scope the view to the ad's PARENT AD SET (a real drill-down that filters
      // the table to that ad set's ads), then highlight the specific ad within it.
      let adsetId = null;
      const cd = D.campaignData || {};
      for (const cid in cd) {
        const hit = (cd[cid].d1Ads || []).find(a => String(a.id) === String(entityId));
        if (hit && hit.adset_id) { adsetId = hit.adset_id; break; }
      }
      const parent = adsetId ? `&selected_adset_ids=${adsetId}` : '';
      return `${base}/ads?act=${act}${scope}${parent}&selected_ad_ids=${entityId}`;
    }
    default:         return '#';
  }
}

function fmt(val, type, currency) {
  if (val == null || isNaN(val)) return '—';
  const c = currency || '';
  switch (type) {
    case 'roas':    return val.toFixed(2) + 'x';
    case 'ctr':     return val.toFixed(2) + '%';
    case 'er':      return val.toFixed(2) + '%';
    case 'freq':    return val.toFixed(2);
    case 'fl':      return val.toFixed(2);
    case 'cpm':     return c + ' ' + val.toFixed(2);
    case 'cpr':     return c + ' ' + val.toFixed(2);
    case 'cpi':     return c + ' ' + val.toFixed(2);
    case 'spend':   return c + ' ' + spendTxt(val);
    case 'integer': return Math.round(val).toLocaleString();
    default:        return String(val);
  }
}

// Spend formatter: whole-currency rounding for readable large numbers, but keep cents for
// sub-unit spends so a real few-cents spend never displays as "0" (e.g. 0.20 -> "0.20").
function spendTxt(v){
  v = v || 0;
  if (v > 0 && v < 1)  return v.toFixed(2);
  if (v > 0 && v < 10) return v.toFixed(2);
  return Math.round(v).toLocaleString();
}

// Normalize breach-marker keys to the canonical set the reader colours off (ROAS/CPR/CVR).
// A producer may emit an objective display label (CPL/CPI/CPE/CPM/CPC for cost, CR for
// conversion) instead of the canonical key; coerce them so the cost/CR bars render correctly
// for every objective. No objective is hardcoded — any cost-style label maps to 'CPR'.
function normMarkers(arr){
  return (arr||[]).map(m => {
    const u = String(m||'').toUpperCase().replace(/[^A-Z_]/g,'');
    if (['CPR','CPL','CPI','CPE','CPM','CPC','CPA','COST'].includes(u)) return 'CPR';
    if (['CVR','CR','CRLINKS','CR_LINKS','CONV'].includes(u))           return 'CVR';
    if (u === 'ROAS') return 'ROAS';
    return u;
  });
}

// CVR / conversion-rate formatter. The stored cvr and cvrBenchmark fields are ALREADY in
// percent units (e.g. 0.0155 means 0.0155%, i.e. purchases ÷ link clicks × 100) — so they must
// NOT be multiplied by 100 again for display. These click-to-purchase rates are tiny for
// catalog/prospecting, so show enough significant figures to keep them distinguishable.
function fmtCvr(v) {
  if (v == null || isNaN(v)) return '\u2014';
  if (v === 0) return '0%';
  if (v >= 1) return v.toFixed(2) + '%';
  return Number(v.toPrecision(2)) + '%';   // 0.19% · 0.047% · 0.016% · 0.0018%
}

function directionColour(metric, start, end) {
  if (start == null || end == null) return 'metric-neutral';
  const rising = end > start;
  const stable = Math.abs((end - start) / (start || 1)) <= 0.10;
  if (stable) return 'metric-neutral';
  const goodWhenRising = ['roas','ctr','er','reach'];
  const goodWhenFalling = ['cpr','cpi','cpl','cpm','freq'];
  if (goodWhenRising.includes(metric))  return rising ? 'metric-good' : 'metric-bad';
  if (goodWhenFalling.includes(metric)) return rising ? 'metric-bad'  : 'metric-good';
  return 'metric-neutral';
}

// verdictClass — maps ANY entity verdict to the good/bad/neutral bullet modifier used to
// colour the ∴ conclusion line. Standardises "bad news = red, good news = green" across every
// tab. Accepts campaign verdicts (CRITICAL/AT_RISK/HEALTHY/...), the ad-set `underperform`
// boolean or its threeWayVerdict, and the per-ad d2Classification. Anything ambiguous → neutral.
function verdictClass(v) {
  if (v === true) return 'sb-bad';            // underperform: true
  if (v === false) return 'sb-good';          // underperform: false (healthy)
  if (v == null) return 'sb-neutral';
  const s = String(v).toUpperCase();
  const bad  = ['CRITICAL','AT_RISK','ATRISK','UNDERPERFORM','POOR','POOR_QUALITY',
                'FATIGUE_CONFIRMED','FATIGUE_POSSIBLE','AUDIENCE_SATURATION',
                'CREATIVE_FATIGUE_LIKELY','RELEVANCE_LIMITED','POST_CLICK','UNDER'];
  const good = ['HEALTHY','HEALTHY_DELIVERY','STRONG','STABLE','OK','GOOD','ON_TRACK','EFFICIENT'];
  if (bad.includes(s))  return 'sb-bad';
  if (good.includes(s)) return 'sb-good';
  return 'sb-neutral';                          // MIXED / EXTERNAL_AUCTION_PRESSURE / unknown → neutral
}

// metricVsBenchClass — deterministic good/bad for a metric figure compared to its benchmark,
// given the metric's polarity. higherIsBetter: ROAS/CTR/CVR/reach; lowerIsBetter: CPR/CPM/CPI/CPL/freq.
function metricVsBenchClass(value, bench, higherIsBetter) {
  if (value == null || bench == null) return 'metric-neutral';
  if (Math.abs((value - bench) / (bench || 1)) <= 0.02) return 'metric-neutral';
  const better = higherIsBetter ? (value > bench) : (value < bench);
  return better ? 'metric-good' : 'metric-bad';
}

// colourizeAuthoredMetrics — SAFETY NET for authored insight-block bullets whose "value vs
// account-average" figures were not already wrapped in a colour span by the authoring stage.
// Conservative by design: only touches a bullet when it (a) has no existing metric-good/bad/
// neutral span, and (b) matches a strict "<MetricLabel> ... <numA> ... vs ... <numB> ..."
// shape where the leading label maps to a KNOWN polarity. Anything ambiguous is left in the
// default colour rather than risk mis-signalling. Authored spans always win (rule (a)).
function colourizeAuthoredMetrics(html) {
  if (typeof html !== 'string' || html.indexOf('<li') === -1) return html;
  // Order matters: cost/frequency (lower-is-better) are checked BEFORE reach/purchases
  // (higher-is-better) so "cost per purchase" is not mis-caught by the "purchase" pattern.
  const polarity = [
    [/\b(cost per|cpr|cpa|cpi|cpl|cpc|cpm)\b/, false],
    [/\bfrequency\b/, false],
    [/\b(roas|return on ad spend)\b/, true],
    [/\b(ctr|click[- ]through)\b/, true],
    [/\b(cvr|conversion rate|cr from links|cr \(from links\)|\bcr\b)/, true],
    [/\b(reach|purchases?|results?)\b/, true],
  ];
  const numRe = /(-?[\d,]+(?:\.\d+)?)\s*(x|%)?/g;
  return html.replace(/<li(?![^>]*signal-conclusion)([^>]*)>([\s\S]*?)<\/li>/g, (m, attrs, inner) => {
    if (/metric-(good|bad|neutral)/.test(inner)) return m;             // already coloured
    const lead = inner.replace(/<[^>]+>/g, '').slice(0, 48).toLowerCase();
    let higher = null;
    for (const [re, h] of polarity) { if (re.test(lead)) { higher = h; break; } }
    if (higher === null) return m;                                     // unknown metric → leave alone
    // need a "A vs B" comparison to know which side is the benchmark
    const vsIdx = inner.toLowerCase().indexOf(' vs ');
    if (vsIdx === -1) return m;
    const before = inner.slice(0, vsIdx), after = inner.slice(vsIdx);
    const aNums = before.match(numRe), bNums = after.match(numRe);
    if (!aNums || !bNums) return m;
    const toNum = s => parseFloat(String(s).replace(/[^\d.\-]/g, ''));
    const a = toNum(aNums[aNums.length - 1]);                          // value nearest the "vs"
    const b = toNum(bNums[0]);                                         // first number after "vs" = benchmark
    if (!isFinite(a) || !isFinite(b)) return m;
    const cls = metricVsBenchClass(a, b, higher);
    if (cls === 'metric-neutral') return m;                            // at par → don't recolour
    // wrap only the leading factual clause (up to the first em-dash / en-dash / period), leaving
    // any trailing prose uncoloured so we never redden an entire sentence.
    const cut = inner.search(/\s[\u2014\u2013]\s|\.\s|<br/);
    const head = cut === -1 ? inner : inner.slice(0, cut);
    const tail = cut === -1 ? '' : inner.slice(cut);
    return `<li${attrs}><span class="${cls}">${head}</span>${tail}</li>`;
  });
}


function b2First(b2, field) {
  if (!b2 || !b2.length) return null;
  for (let i = 0; i < b2.length; i++) { if (b2[i][field] != null) return b2[i][field]; }
  return null;
}
function b2Last(b2, field) {
  if (!b2 || !b2.length) return null;
  for (let i = b2.length - 1; i >= 0; i--) { if (b2[i][field] != null) return b2[i][field]; }
  return null;
}

function decodeName(raw) {
  if (!raw) return '—';
  // Replace underscores/hyphens with spaces, title-case
  return raw.replace(/[-_]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

function flVerdict(fl) {
  if (fl == null) return { label: '—', cls: '' };
  if (fl < 0.25)  return { label: 'Low',       cls: 'fl-low' };

}

// Shared direction descriptor — the single place that turns two numbers into a direction word.
// Used by the per-ad and ad-set conclusion sentences so a described direction is always computed
// from the entity's own endpoints (never a canned "flat"/"declining" that could contradict the data).
function dirWord(s, e, thr) {
  thr = thr || 0.10;
  if (s == null || e == null || !s) return 'no clear trend';
  const d = (e - s) / Math.abs(s);
  if (d > thr)  return 'rose';
  if (d < -thr) return 'fell';
  return 'held roughly flat';
}

// Hour-of-day seasonality. Source: the 24-row aggregated hourly breakdown (campaignData[].hourlySeries),
// one row per hour aggregated across the window. The >=3 rule is applied at STUDY level via the number of
// delivery days the hours are aggregated across (deliveryDays = b2Series length) — the cheap 24-row pull
// cannot carry a per-hour day count, so <3 delivery days => insufficient.
function computeSeasonalityHourly(hourlySeries, metricKey, deliveryDays){
  const rows = (hourlySeries || []).filter(r => r && r.hour != null);
  if (!rows.length) return { vals:{}, pattern:{}, overallAvg:null, hasPattern:false, sufficiency:'no_data', deliveryDays: deliveryDays||0, metricKey };
  const byHour = {}; rows.forEach(r => { byHour[r.hour] = r; });
  const sufficiency = (deliveryDays || 0) >= 3 ? 'sufficient' : 'insufficient';
  let wsum = 0, isum = 0;
  rows.forEach(r => { const v = r[metricKey], im = r.impressions || 0; if (v != null && !isNaN(v) && im > 0) { wsum += v*im; isum += im; } });
  const overallAvg = isum ? wsum/isum : null;
  const THRESHOLD = 0.20, pattern = {}, vals = {};
  for (let h = 0; h < 24; h++){
    const r = byHour[h];
    if (!r || r[metricKey] == null || isNaN(r[metricKey]) || !(r.impressions > 0)) { pattern[h] = 'no_data'; vals[h] = null; continue; }
    vals[h] = r[metricKey];
    if (overallAvg == null) { pattern[h] = 'normal'; continue; }
    const pct = (r[metricKey] - overallAvg) / overallAvg;
    pattern[h] = pct > THRESHOLD ? 'strong_up' : (pct < -THRESHOLD ? 'strong_down' : 'normal');
  }
  const hasPattern = sufficiency === 'sufficient' && Object.values(pattern).some(v => v === 'strong_up' || v === 'strong_down');
  return { vals, pattern, overallAvg, hasPattern, sufficiency, deliveryDays: deliveryDays || 0, metricKey };
}

function hourlySeasonalityHTML(h, fmtType, currency){
