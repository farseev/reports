  }
  if (h.sufficiency === 'insufficient'){
    return `<div class="seasonality-section">
      <div class="seasonality-title">Hour-of-day read <span class="insight-badge insight-badge-neutral" style="margin-left:8px;">INSUFFICIENT DATA</span></div>
      <div class="seasonality-finding">The campaign delivered on only ${h.deliveryDays} day${h.deliveryDays===1?'':'s'} in this window. Each hour-of-day bucket is aggregated across the delivery days, and the study needs at least 3 to be meaningful. Insufficient data to run the hourly seasonality study.</div>
    </div>`;
  }
  let cells = '';
  for (let hr = 0; hr < 24; hr++){
    const p = h.pattern[hr], v = h.vals[hr];
    const cls = p === 'strong_up' ? 'dow-strong-up' : (p === 'strong_down' ? 'dow-strong-down' : (p === 'no_data' ? 'h-nodata' : ''));
    const valStr = v != null ? fmt(v, fmtType, currency) : '—';
    cells += `<div class="seas-hour-cell ${cls}"><div class="h-lab">${String(hr).padStart(2,'0')}h</div><div class="h-val">${valStr}</div></div>`;
  }
  const grid = `<div class="seas-hour-grid">${cells}</div>`;
  let badge, badgeCls, finding;
  {
    // Rank hours by the metric (ROAS) among hours with data; report best/worst vs the window average.
    const ranked = [];
    for (let hr = 0; hr < 24; hr++){
      if (h.vals[hr] == null || h.overallAvg == null) continue;
      const pct = Math.round((h.vals[hr] - h.overallAvg) / h.overallAvg * 100);
      ranked.push({ hr, val:h.vals[hr], pct });
    }
    ranked.sort((a,b) => b.val - a.val);
    const avgStr = h.overallAvg != null ? fmt(h.overallAvg, fmtType, currency) : '\u2014';
    const fmtHr = x => `${String(x.hr).padStart(2,'0')}h (${fmt(x.val, fmtType, currency)}, ${x.pct>=0?'+':''}${x.pct}% vs avg)`;
    const best  = ranked.slice(0, Math.min(3, ranked.length)).map(fmtHr);
    const worst = ranked.slice(-Math.min(3, ranked.length)).reverse().map(fmtHr);
    badge = h.hasPattern ? 'PATTERN DETECTED' : 'NO STRONG PATTERN';
    badgeCls = h.hasPattern ? 'insight-badge-warn' : 'insight-badge-neutral';
    const patternNote = h.hasPattern
      ? 'Some hours swing more than \u00b120% from the window average.'
      : 'All hours sit within \u00b120% of the window average, so the differences are modest.';
    finding = `Window-average ${metricLabel}: ${avgStr} (impression-weighted, across ${h.deliveryDays} delivery days, advertiser time zone). `
      + `Best-returning hours: ${best.join(' \u00b7 ')}. `
      + `Lowest-returning hours: ${worst.join(' \u00b7 ')}. `
      + `${patternNote}${h.hasPattern ? ' Consider shifting spend toward the stronger hours.' : ''}`;
  }
  return `<div class="seasonality-section">
    <div class="seasonality-title">Hour-of-day read <span class="insight-badge ${badgeCls}" style="margin-left:8px;">${badge}</span></div>
    ${grid}
    <div class="seasonality-finding">${finding}</div>
  </div>`;
}

// Day-of-week seasonality. Also tracks how many observations back each weekday so the
// conclusion can be GATED on data sufficiency (a weekly cycle needs each weekday repeated).
function computeSeasonality(series, metricKey) {
  const dayBuckets = {0:[],1:[],2:[],3:[],4:[],5:[],6:[]};
  (series || []).forEach(row => {
    const val = row[metricKey];
    if (val == null || isNaN(val)) return;
    const d = new Date(row.date + 'T00:00:00Z');
    dayBuckets[d.getUTCDay()].push(val);
  });
  const dayAvgs = {}, counts = {};
  for (let i = 0; i <= 6; i++) {
    counts[i]  = dayBuckets[i].length;
    dayAvgs[i] = dayBuckets[i].length ? dayBuckets[i].reduce((a,b)=>a+b,0)/dayBuckets[i].length : null;
  }
  const allVals = Object.values(dayBuckets).reduce((a,b)=>a.concat(b), []);
  if (!allVals.length) return { dayAvgs, counts, raw: dayBuckets, overallAvg: null, pattern: {}, hasPattern: false, sufficiency: 'no_data', minSamples: 0, weeksCovered: 0, metricKey };
  const overallAvg = allVals.reduce((a,b)=>a+b,0) / allVals.length;
  const THRESHOLD = 0.20;
  const pattern = {};
  for (let i = 0; i <= 6; i++) {
    if (dayAvgs[i] == null) { pattern[i] = 'no_data'; continue; }
    if (counts[i] < 3)     { pattern[i] = 'low_sample'; continue; }   // <3 obs -> greyed, excluded from pattern
    const pct = (dayAvgs[i] - overallAvg) / overallAvg;
    pattern[i] = pct > THRESHOLD ? 'strong_up' : (pct < -THRESHOLD ? 'strong_down' : 'normal');
  }
  const hasPattern = Object.values(pattern).some(v => v === 'strong_up' || v === 'strong_down');
  // v2 sufficiency: the daily study RUNS if AT LEAST ONE weekday bucket has >=3 observations.
  // Buckets with <3 are shown but greyed and never drive the pattern. Insufficient only when
  // NO weekday reached 3 (i.e. the window is too short).
  const populated   = [0,1,2,3,4,5,6].filter(i => counts[i] > 0);
  const minSamples  = populated.length ? Math.min.apply(null, populated.map(i => counts[i])) : 0;
  const maxSamples  = Math.max.apply(null, [0].concat(Object.values(counts)));
  const weeksCovered= maxSamples;
  const sufficiency = minSamples >= 3 ? 'sufficient' : 'insufficient';   // every populated weekday needs >=3 delivery days
  return { dayAvgs, counts, raw: dayBuckets, overallAvg, pattern, hasPattern, sufficiency, minSamples, maxSamples, weeksCovered, metricKey };
}

function seasonalityHTML(seasonality, fmtType, currency) {
  const days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const dayOrder = [1,2,3,4,5,6,0]; // Mon-first
  const labelMap = { roas:'Purchase ROAS', cpr:'cost per result', ctr:'CTR', cpm:'CPM', results:'results', frequency:'frequency', reach:'reach' };
  const metricLabel = labelMap[seasonality && seasonality.metricKey] || (seasonality && seasonality.metricKey) || 'the primary metric';
  if (!seasonality || seasonality.overallAvg == null) {
    return `<div class="seasonality-section">
      <div class="seasonality-title">Day-of-week read</div>
      <div class="seasonality-none">No data available to compute a day-of-week read for ${metricLabel}.</div>
    </div>`;
  }
  const suff = seasonality.sufficiency === 'sufficient';
  // Grid — always shown so the actual per-weekday numbers are transparent. Deviation colours
  // are applied ONLY when the sample is sufficient; on thin data the cells stay neutral.
  let cells = '';
  dayOrder.forEach((dayIdx, i) => {
    const p = seasonality.pattern[dayIdx];
    const v = seasonality.dayAvgs[dayIdx];
    const n = seasonality.counts[dayIdx] || 0;
    const cellCls = suff && p === 'strong_up' ? 'dow-strong-up' : (suff && p === 'strong_down' ? 'dow-strong-down' : '');
    const valStr  = v != null ? fmt(v, fmtType, currency) : '—';
    cells += `<div class="seasonality-dow-cell ${cellCls}">
      <div class="dow-label">${days[i]}</div>
      <div class="dow-value">${valStr}</div>
      <div class="dow-label" style="opacity:.55;font-weight:400;letter-spacing:0;">n=${n}</div>
    </div>`;
  });
  const grid = `<div class="seasonality-dow-grid">${cells}</div>`;

  let badge, badgeCls, finding;
  if (seasonality.sufficiency === 'insufficient') {
    badge = 'INSUFFICIENT DATA'; badgeCls = 'insight-badge-neutral';
    // Illustrate the noise: cite the weekday with the widest within-day swing.
    let widest = -1, widestDay = null;
    dayOrder.forEach(d => {
      const arr = seasonality.raw[d] || [];
      if (arr.length >= 2) {
        const spread = Math.max.apply(null, arr) - Math.min.apply(null, arr);
        if (spread > widest) { widest = spread; widestDay = d; }
      }
    });
    let ex = '';
    if (widestDay != null) {
      const arr = seasonality.raw[widestDay].map(v => fmt(v, fmtType, currency));
      ex = ` For example, ${days[(widestDay+6)%7]} readings were ${arr.join(' and ')}. A single-sample swing, not a stable level.`;
    }
    finding = `Fewer than 3 delivery days per weekday (thinnest weekday: ${seasonality.minSamples}; most-covered: ${seasonality.maxSamples}). Too short to establish a weekly cycle for ${metricLabel}.${ex} Insufficient data to run the day-of-week seasonality study; every weekday needs at least 3 delivery days (≈3 weeks of data).`;
  } else if (!seasonality.hasPattern) {
    badge = 'NO PATTERN'; badgeCls = 'insight-badge-neutral';
    finding = `With ${seasonality.minSamples}+ observations per weekday, all seven days sit within ±20% of the period average for ${metricLabel}. No weekday is materially driving or dragging performance.`;
  } else {
    badge = 'PATTERN DETECTED'; badgeCls = 'insight-badge-warn';
    const up = [], down = [];
    dayOrder.forEach(d => {
      if (seasonality.dayAvgs[d] == null) return;
      const pct = Math.round((seasonality.dayAvgs[d] - seasonality.overallAvg) / seasonality.overallAvg * 100);
      if (seasonality.pattern[d]==='strong_up')   up.push(`${days[(d+6)%7]} +${pct}%`);
      if (seasonality.pattern[d]==='strong_down') down.push(`${days[(d+6)%7]} ${pct}%`);
    });
    finding = `${metricLabel} varies materially by weekday`
      + (up.length   ? `. Above average: ${up.join(', ')}` : '')
      + (down.length ? `${up.length?';':' —'} below average: ${down.join(', ')}` : '')
      + `. Based on ${seasonality.minSamples}+ observations per weekday.`;
  }
  return `<div class="seasonality-section">
    <div class="seasonality-title">Day-of-week read <span class="insight-badge ${badgeCls}" style="margin-left:8px;">${badge}</span></div>
    ${grid}
    <div class="seasonality-finding">${finding}</div>
  </div>`;
}

// objectiveLabels — single source of truth for the objective-specific WORDS the deep-dive tabs
// and the Overview logbook need: the result noun (singular/plural), the cost-per-result label,
// and whether a revenue/ROAS column applies. Keeps every tab's wording flexible by objective
// instead of hardcoding the OUTCOME_SALES vocabulary. Falls back to a generic "result".
function objectiveLabels(objective) {
  const map = {
    'OUTCOME_SALES':      { noun:'purchase',   nounPlural:'purchases',   costLabel:'Cost per purchase', costShort:'CPR', hasRoas:true,  hasRevenue:true  },
    'APP_INSTALLS':       { noun:'install',    nounPlural:'installs',    costLabel:'Cost per install',  costShort:'CPI', hasRoas:false, hasRevenue:false },
    'OUTCOME_LEADS':      { noun:'lead',       nounPlural:'leads',       costLabel:'Cost per lead',     costShort:'CPL', hasRoas:false, hasRevenue:false },
    'OUTCOME_ENGAGEMENT': { noun:'engagement', nounPlural:'engagements', costLabel:'Cost per engagement', costShort:'CPE', hasRoas:false, hasRevenue:false },
    'OUTCOME_TRAFFIC':    { noun:'landing page view', nounPlural:'landing page views', costLabel:'Cost per LPV', costShort:'CPLPV', hasRoas:false, hasRevenue:false, hasCR:true },
    'LINK_CLICKS':        { noun:'link click', nounPlural:'link clicks', costLabel:'Cost per link click', costShort:'CPC', hasRoas:false, hasRevenue:false, hasCR:false, resultIsClicks:true },
    'OUTCOME_AWARENESS':  { noun:'result',     nounPlural:'results',     costLabel:'Cost per result',   costShort:'CPR', hasRoas:false, hasRevenue:false },
  };
  const base = map[objective] || { noun:'result', nounPlural:'results', costLabel:'Cost per result', costShort:'CPR', hasRoas:false, hasRevenue:false };
  base.primary = primaryMetricConfig(objective);   // {field,fmt,label,good}
  // Human labels for internal breached-marker names. ROAS is revenue-only; for non-revenue
  // objectives the breach that would have been "ROAS" is dropped from display (its cost/rate
  // breaches carry the signal). CPR→cost label short form; CVR→"CR".
  base.markerLabel = mk => {
    if (mk === 'ROAS') return base.hasRoas ? 'ROAS' : null;   // null → omit for non-revenue
    if (mk === 'CPR')  return base.costShort;
    if (mk === 'CVR')  return 'CR';
    return mk;
  };
  return base;
}

function zeroPurchasePlugin(labels, purchasesByDate, noun, nounPlural, spendByDate, spendOnly) {
  const _NP = nounPlural || 'results';
  const _NS = noun || 'result';
  const _emptyAt = i => { const d = labels[i]; if (spendOnly) return !(((spendByDate && spendByDate[d]) || 0) > 0); const p = purchasesByDate[d] == null ? 0 : purchasesByDate[d]; return !(p > 0); };
  return {
    id: 'zeroPurchase',
    beforeDatasetsDraw(chart) {
      const x = chart.scales.x, area = chart.chartArea, ctx = chart.ctx;
      if (!x || !area) return;
      ctx.save();
      const step = (x.getPixelForValue(1) - x.getPixelForValue(0)) || 8;
      const half = Math.max(3, Math.abs(step) / 2);
      labels.forEach((d, i) => {
        if (!_emptyAt(i)) return;
        const inSeries = purchasesByDate[d] !== undefined;
        if (!spendOnly && !inSeries && !spendByDate) return;   // legacy (no spend info): band only in-series zero days
        const noSpend = spendByDate ? !((spendByDate[d] || 0) > 0) : false;
        ctx.fillStyle = noSpend ? 'rgba(120,134,131,0.18)' : 'rgba(155,168,166,0.12)';
        const xc = x.getPixelForValue(i);
        ctx.fillRect(xc - half, area.top, half * 2, area.bottom - area.top);
      });
      ctx.restore();
    },
    // After the line is drawn, annotate the two sparse-data cases so an empty-looking
    // chart is never ambiguous:
    //   • 0 purchases in the whole window  → write "No purchases" across the shaded area
    //   • exactly 1 purchase day           → ring + guide line + "N purchase(s)" on that day
    afterDatasetsDraw(chart) {
      const x = chart.scales.x, y = chart.scales.y, area = chart.chartArea, ctx = chart.ctx;
      if (!x || !area) return;
      // Classify each day and find contiguous NO-PURCHASE runs across the window, so every
      // shaded gap — not just a fully-empty window — carries the "No purchases" indication.
      const isZero = labels.map((d, i) => _emptyAt(i));
      const pDays = [];
      labels.forEach((d, i) => { const n = purchasesByDate[d] == null ? 0 : purchasesByDate[d]; if (n > 0) pDays.push(i); });
      ctx.save();
      const step = Math.abs(x.getPixelForValue(1) - x.getPixelForValue(0)) || 8;
      const half = Math.max(3, step / 2);
      const classAt = k => { if (!spendByDate) return 'nolead'; const sp = spendByDate[labels[k]]; return (sp != null && sp > 0) ? 'nolead' : 'nospend'; };
      const runs = [];
      for (let i = 0; i < labels.length; i++) {
        if (!isZero[i]) continue;
        const c = classAt(i);
        let j = i; while (j + 1 < labels.length && isZero[j + 1] && classAt(j + 1) === c) j++;
        runs.push([i, j, c]); i = j;
      }
      const wholeWindow = pDays.length === 0;
      const cy = (area.top + area.bottom) / 2;
      const bandH = area.bottom - area.top;
      runs.forEach(([s0, e0, cls]) => {
        const candidates = cls === 'nospend' ? ['No spend', '0 spend'] : ['No ' + _NP, '0 ' + _NP];
        const xL = Math.max(area.left, x.getPixelForValue(s0) - half);
        const xR = Math.min(area.right, x.getPixelForValue(e0) + half);
        const bandW = xR - xL, bandCx = (xL + xR) / 2;
        ctx.font = '700 12px system-ui, -apple-system, sans-serif';
        // 1) preferred: a horizontal label that fits the band width
        let txt = null;
        for (const cand of candidates) { if (ctx.measureText(cand).width + 6 <= bandW) { txt = cand; break; } }
        if (txt) {
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillStyle = '#C8D0CE';
          ctx.fillText(txt, bandCx, wholeWindow ? cy - 7 : cy);
          if (wholeWindow && cls !== 'nospend') {
            ctx.font = '400 11px system-ui, -apple-system, sans-serif';
            ctx.fillStyle = 'rgba(200,208,206,0.75)';
            ctx.fillText('0 ' + _NP + ' in the window. No daily conversion metric to plot', bandCx, cy + 12);
          }
          return;
        }
        // 2) too narrow horizontally -> rotate the label vertically (there is ample vertical room).
        //    Narrow single-day gaps (e.g. the Overview) still get a clear "No purchases" this way.
        if (bandW >= 14) {
          ctx.font = '700 11px system-ui, -apple-system, sans-serif';
          let vtxt = null;
          for (const cand of candidates) { if (ctx.measureText(cand).width + 8 <= bandH) { vtxt = cand; break; } }
          if (!vtxt) vtxt = cls === 'nospend' ? '0 spend' : '0 ' + _NP;
          ctx.save();
          ctx.translate(bandCx, cy);
          ctx.rotate(-Math.PI / 2);
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillStyle = '#C8D0CE';
          ctx.fillText(vtxt, 0, 0);
          ctx.restore();
        }
        // else band < 14px — too thin to annotate legibly; the shading conveys it
      });
      // Lone-purchase emphasis: exactly one purchase in the whole window -> ring + guide + label.
      if (pDays.length === 1) {
        const i = pDays[0];
        const xc = x.getPixelForValue(i);
        const val = chart.data && chart.data.datasets && chart.data.datasets[0] ? chart.data.datasets[0].data[i] : null;
        let yc = (val != null && y) ? y.getPixelForValue(val) : (area.bottom - 4);
        yc = Math.max(area.top + 12, Math.min(area.bottom - 4, yc));
        ctx.strokeStyle = 'rgba(45,191,156,0.45)'; ctx.setLineDash([3, 3]); ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(xc, area.bottom); ctx.lineTo(xc, yc); ctx.stroke(); ctx.setLineDash([]);
        ctx.beginPath(); ctx.arc(xc, yc, 7, 0, Math.PI * 2); ctx.strokeStyle = '#2DBF9C'; ctx.lineWidth = 2; ctx.stroke();
        ctx.beginPath(); ctx.arc(xc, yc, 3.2, 0, Math.PI * 2); ctx.fillStyle = '#2DBF9C'; ctx.fill();
        const n = purchasesByDate[labels[i]] || 1;
        const txt = n + ' ' + (n === 1 ? _NS : _NP);
        ctx.font = '600 11px system-ui, -apple-system, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        const tw = ctx.measureText(txt).width;
        let ly = yc - 18; if (ly - 9 < area.top) ly = yc + 18;
        const lx = Math.max(area.left + tw / 2 + 6, Math.min(area.right - tw / 2 - 6, xc));
        ctx.fillStyle = 'rgba(22,32,31,0.9)';
        ctx.fillRect(lx - tw / 2 - 5, ly - 9, tw + 10, 18);
        ctx.fillStyle = '#2DBF9C';
        ctx.fillText(txt, lx, ly);
      }
      ctx.restore();
    }
  };
}

function buildChartOutcomeStrip(canvasId, adsetSeries, labels, metric, benchmark, currency, objective) {
  if (!adsetSeries || !adsetSeries.series) return;
  const _L = objectiveLabels(objective);
  const sm = seriesMap(adsetSeries.series);
  const purchasesByDate = {};
  const spendByDate = {};
  adsetSeries.series.forEach(r => { purchasesByDate[r.date] = (r.purchases != null ? r.purchases : 0); spendByDate[r.date] = (r.spend != null ? r.spend : null); });
  const valAt = d => {
    const r = sm[d]; if (!r) return null;
    const p = (r.purchases != null ? r.purchases : 0);
    if (!p) return null;                       // zero-purchase day -> gap; band drawn by plugin
    if (metric === 'ROAS') return r.roas != null ? r.roas : null;
    if (metric === 'CPR')  return r.spend != null ? r.spend / p : null;
    if (metric === 'CVR')  return r.link_clicks ? (p / r.link_clicks * 100) : null;
    return null;
  };
  const datasets = [
    { label: metric === 'CPR' ? _L.costLabel : (metric === 'CVR' ? 'CR (from links)' : 'ROAS'),
      data: labels.map(valAt), borderColor: '#2DBF9C', backgroundColor: 'transparent', yAxisID: 'y', spanGaps: false,
      pointRadius: 3, pointBackgroundColor: '#2DBF9C', pointBorderColor: '#2DBF9C' },
    { label: 'Account average', data: labels.map(() => (benchmark != null ? benchmark : null)),
      borderColor: 'rgba(155,168,166,0.7)', borderDash: [4, 3], backgroundColor: 'transparent', pointRadius: 0, yAxisID: 'y' }
  ];
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  new Chart(canvas, {
    type: 'line',
    data: { labels, datasets },
    options: { ...CHART_DEFAULTS, maintainAspectRatio: false, spanGaps: false,
      plugins: { ...CHART_DEFAULTS.plugins, legend: { display: false } },
      scales: { x: CHART_DEFAULTS.scales.x, y: CHART_DEFAULTS.scales.y } },
    plugins: [ zeroPurchasePlugin(labels, purchasesByDate, _L.noun, _L.nounPlural, spendByDate) ]
  });
}

function buildChartE(canvasId, funnelData, campaign) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const obj = effectiveObjective(campaign);
  let stageLabels = [], stageValues = [], stageColors = [];

  if (obj === 'OUTCOME_SALES' || obj === 'OUTCOME_TRAFFIC' || obj === 'LINK_CLICKS') {
    const fd = funnelData.website;
    stageLabels = ['Impressions','Outbound clicks','LPV (gap)','Add to cart (gap)','Checkout (gap)','Purchases'];
    stageValues = [fd?.impressions||0, fd?.outbound_clicks||0, null, null, null, fd?.purchases||0];
    stageColors = ['#2DBF9C','#2DBF9C','#E2E8E5','#E2E8E5','#E2E8E5','#2DBF9C'];
  } else if (obj === 'APP_INSTALLS') {
    const fd = funnelData.website;
    stageLabels = ['Impressions','Link clicks','App installs','Post-install (gap)'];
    stageValues = [fd?.impressions||0, fd?.link_clicks||0, campaign.b1Snapshot?.results||0, null];
    stageColors = ['#2DBF9C','#2DBF9C','#2DBF9C','#E2E8E5'];
  } else if (obj === 'OUTCOME_LEADS') {
    const fd = funnelData.website;
    stageLabels = ['Impressions','Outbound clicks','LPV (gap)','Leads'];
    stageValues = [fd?.impressions||0, fd?.outbound_clicks||0, null, campaign.b1Snapshot?.results||0];
    stageColors = ['#2DBF9C','#2DBF9C','#E2E8E5','#2DBF9C'];
  } else if (obj === 'OUTCOME_ENGAGEMENT' || obj === 'OUTCOME_AWARENESS') {
    const fd = funnelData.on_facebook;
    stageLabels = ['Impressions','Post likes','Comments','Reactions','Saves','Post shares'];
    stageValues = [
      campaign.b1Snapshot?.impressions||0,
      fd?.actions_like||0, fd?.actions_comment||0,
      fd?.actions_post_reaction||0, fd?.actions_post_save||0, fd?.post_shares||0
    ];
    stageColors = stageLabels.map(() => '#2DBF9C');
  } else {
    stageLabels = ['Impressions'];
    stageValues = [campaign.b1Snapshot?.impressions||0];
    stageColors = ['#2DBF9C'];
  }

  const displayValues = stageValues.map(v => v == null ? 0 : v);
  const displayColors = stageValues.map((v,i) => v == null ? '#E2E8E5' : stageColors[i]);

  // Annotate a zero terminal RESULT stage so a 0-result funnel is explicit, not just a zero-height
  // bar — consistent with the daily charts. Objective-aware: "No leads" / "No purchases" / etc.
  const _fL = objectiveLabels(obj);
  const _resultRe = new RegExp('^(' + _fL.nounPlural.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '|purchases|leads|installs|results)$', 'i');
  const funnelZeroNote = {
    id: 'funnelZeroNote',
    afterDatasetsDraw(chart) {
      const xs = chart.scales.x, ys = chart.scales.y, area = chart.chartArea, ctx = chart.ctx;
      if (!xs || !ys || !area) return;
      ctx.save();
      ctx.font = '600 11px system-ui, -apple-system, sans-serif';
      ctx.fillStyle = '#C8D0CE';
      ctx.font = '700 11px system-ui, -apple-system, sans-serif';
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      stageLabels.forEach((lab, i) => {
        if (_resultRe.test(String(lab).trim()) && stageValues[i] === 0) {
          ctx.fillText('No ' + _fL.nounPlural, xs.getPixelForValue(0) + 8, ys.getPixelForValue(i));
        }
      });
      ctx.restore();
    }
  };

  new Chart(canvas, {
    type: 'bar',
    plugins: [ funnelZeroNote ],
    data: {
      labels: stageLabels,
      datasets: [{ data: displayValues, backgroundColor: displayColors, borderRadius: 3 }]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: ctx => ctx.raw != null ? ctx.raw.toLocaleString() : 'MCP gap: not available' } }
      },
      scales: {
        x: { grid: { color: '#E2E8E5' }, ticks: { color: '#47534F', font: { size: 11 } } },
        y: { grid: { display: false },   ticks: { color: '#47534F', font: { size: 11 } } }
      }
    }
  });
}

function buildStatStrip(D) {

  const bm  = D.accountData?.benchmarks || {};
  const currency = m.currency||'';

  document.getElementById('ss-spend').textContent     = currency + ' ' + Math.round(t.spend||0).toLocaleString();
  document.getElementById('ss-days').textContent      = (m.date_range?.days||'—') + ' days';
  document.getElementById('ss-daterange').textContent = (m.date_range?.since||'') + ' – ' + (m.date_range?.until||'');
  const vEl = document.getElementById('ss-campaigns');
  vEl.textContent = verdictLabel(t.verdict) || '—';
  vEl.className = 'stat-value ' + (t.verdict==='HEALTHY' ? 'stat-value-good' : (t.verdict==='CRITICAL' ? 'stat-value-bad' : (t.verdict==='SLIPPING' ? 'stat-value-warn' : '')));
  // Benchmark cell: pick the target objective's primary benchmark
  const BM = {
    'OUTCOME_SALES':      bm.outcome_sales_avg_roas   != null ? bm.outcome_sales_avg_roas.toFixed(2)+'x ROAS' : (bm.outcome_sales_avg_cpr!=null? currency+' '+bm.outcome_sales_avg_cpr.toFixed(2)+' CPR':null),
    'APP_INSTALLS':       bm.app_installs_avg_cpi     != null ? currency+' '+bm.app_installs_avg_cpi.toFixed(2)+' CPI' : null,
    'OUTCOME_LEADS':      bm.outcome_leads_avg_cpl    != null ? currency+' '+bm.outcome_leads_avg_cpl.toFixed(2)+' CPL' : null,
    'OUTCOME_ENGAGEMENT': bm.outcome_engagement_avg_er!= null ? bm.outcome_engagement_avg_er.toFixed(2)+'% ER' : null,
    'OUTCOME_TRAFFIC':    bm.outcome_traffic_avg_cost_per_lpv != null ? currency+' '+bm.outcome_traffic_avg_cost_per_lpv.toFixed(2)+' per LPV' : (bm.outcome_traffic_avg_ctr_links != null ? bm.outcome_traffic_avg_ctr_links.toFixed(2)+'% link CTR' : (bm.outcome_traffic_avg_cost_per_link_click != null ? currency+' '+bm.outcome_traffic_avg_cost_per_link_click.toFixed(2)+' per link click' : (bm.outcome_traffic_avg_ctr != null ? bm.outcome_traffic_avg_ctr.toFixed(2)+'% CTR' : null))),
    'OUTCOME_AWARENESS':  bm.outcome_awareness_avg_cpm!= null ? currency+' '+bm.outcome_awareness_avg_cpm.toFixed(2)+' CPM' : null
  };
  const bEl = document.getElementById('ss-atrisk');
  bEl.textContent = BM[effectiveObjective(t)] || BM[t.objective] || '—';
  bEl.className = 'stat-value';
  const nOther = D.accountData?.otherCampaignsWithSpend;
  const singleModeSS = Object.keys(D.campaignData||{}).length === 1;
  // In single-campaign mode the report names only the analyzed campaign — do not surface a
  // count of other, un-analyzed account campaigns. Multi-campaign reports keep the note.
  if (!singleModeSS && nOther != null) document.getElementById('ss-benchmark-label').textContent =
    'Account average: same objective (' + nOther + ' other campaigns out of scope)';
}

/* ════════════════════════════════════════════════════════════════════════════
   OBJECTIVE BLOCKS — per-objective KPIs + triage + findings
   Replaces the old separate buildPriorityFindings / buildBenchmarkGrid /
   buildTriageRows functions. Each objective present in the account gets its
   own block with: KPI strip · triage badges · scoped findings.
   ════════════════════════════════════════════════════════════════════════ */

function buildObjectiveBlocks(D) {
  const container = document.getElementById('objective-blocks');
  const all    = D.allCampaigns  || {};
  const cd     = D.campaignData  || {};
  const multi  = Object.keys(cd).length > 1;  // account-level portfolio sections render only for multi-campaign reports
  const bm     = D.accountData?.benchmarks || {};
  let   triage = D.accountData?.triage     || {};
  // SINGLE-CAMPAIGN MODE: the triage badges must reflect only the analyzed campaign(s),
  // not the account-wide discovery counts — otherwise other campaigns' verdicts leak into
  // the objective header even though they are never rendered as rows.
  if (!multi) {
    triage = {};
    Object.values(cd).forEach(c => {
      const o = c.objective; if (!o) return;
      triage[o] = triage[o] || { critical:0, slipping:0, healthy:0 };
      const v = (c.verdict||'').toUpperCase();
      if (v==='CRITICAL') triage[o].critical++;
      else if (v==='SLIPPING') triage[o].slipping++;
      else if (v==='HEALTHY') triage[o].healthy++;
    });
  }
  const currency = D.meta?.currency || '';

  // Objective config: label, primary KPI cells, primary metric field for findings
  const OBJ_CONFIG = {
    'OUTCOME_SALES': {
      label: 'Outcome — Sales',
      kpis: [
        { label: 'Weighted ROAS', fn: () => {
            let rv=0, sp=0;
            Object.values(all).forEach(c => { if(c.objective==='OUTCOME_SALES'){ rv+=(c.result_values||0); sp+=(c.spend||0); }});
            return sp>0 ? (rv/sp).toFixed(2)+'x' : '—';
          }, good: v => parseFloat(v) >= 1 },
        { label: 'Avg CPR',       val: bm.outcome_sales_avg_cpr  !=null ? currency+' '+bm.outcome_sales_avg_cpr.toFixed(2)  : '—' },
        { label: 'Total spend',   val: bm.outcome_sales_total_spend!=null ? currency+' '+Math.round(bm.outcome_sales_total_spend).toLocaleString() : '—' },
        { label: 'Total purchases', fn: () => {
            let n=0; Object.values(all).forEach(c=>{ if(c.objective==='OUTCOME_SALES') n+=(c.results||0); }); return n>0?Math.round(n).toLocaleString():'—';
          }},
      ],
      primaryMetric: 'roas',
      primaryFmt: v => v!=null ? v.toFixed(2)+'x' : '—',
      goodDirection: 'up',
    },
    'APP_INSTALLS': {
      label: 'App Installs',
      kpis: [
        { label: 'Avg CPI',     val: bm.app_installs_avg_cpi  !=null ? currency+' '+bm.app_installs_avg_cpi.toFixed(2)  : '—' },
        { label: 'Total spend', val: bm.app_installs_total_spend!=null ? currency+' '+Math.round(bm.app_installs_total_spend).toLocaleString() : '—' },
        { label: 'Total installs', fn: () => {
            let n=0; Object.values(all).forEach(c=>{ if(c.objective==='APP_INSTALLS') n+=(c.results||0); }); return n>0?Math.round(n).toLocaleString():'—';
          }},
      ],
      primaryMetric: 'cpr',
      primaryFmt: v => v!=null ? currency+' '+v.toFixed(2) : '—',
      goodDirection: 'down',
    },
    'OUTCOME_LEADS': {
      label: 'Outcome — Leads',
      kpis: [
        { label: 'Avg CPL',     val: bm.outcome_leads_avg_cpl  !=null ? currency+' '+bm.outcome_leads_avg_cpl.toFixed(2)  : '—' },
        { label: 'Total spend', val: bm.outcome_leads_total_spend!=null ? currency+' '+Math.round(bm.outcome_leads_total_spend).toLocaleString() : '—' },
        { label: 'Total leads', fn: () => {
            let n=0; Object.values(all).forEach(c=>{ if(c.objective==='OUTCOME_LEADS') n+=(c.results||0); }); return n>0?Math.round(n).toLocaleString():'—';
          }},
      ],
      primaryMetric: 'cpr',
      primaryFmt: v => v!=null ? currency+' '+v.toFixed(2) : '—',
      goodDirection: 'down',
    },
    'OUTCOME_ENGAGEMENT': {
      label: 'Outcome — Engagement',
      kpis: [
        { label: 'Avg eng. rate', val: bm.outcome_engagement_avg_er  !=null ? bm.outcome_engagement_avg_er.toFixed(2)+'%'  : '—' },
        { label: 'Avg CPE',       val: bm.outcome_engagement_avg_cpe !=null ? currency+' '+bm.outcome_engagement_avg_cpe.toFixed(2) : '—' },
        { label: 'Total spend',   val: bm.outcome_engagement_total_spend!=null ? currency+' '+Math.round(bm.outcome_engagement_total_spend).toLocaleString() : '—' },
      ],
      primaryMetric: 'er',
      primaryFmt: v => v!=null ? v.toFixed(2)+'%' : '—',
      goodDirection: 'up',
    },
    'OUTCOME_TRAFFIC': {
      label: 'Outcome — Traffic',
      kpis: [
        { label: 'Avg CTR',          val: bm.outcome_traffic_avg_ctr_links!=null ? bm.outcome_traffic_avg_ctr_links.toFixed(2)+'%' : (bm.outcome_traffic_avg_ctr!=null?bm.outcome_traffic_avg_ctr.toFixed(2)+'%':'—') },
        { label: 'Avg cost per LPV', val: bm.outcome_traffic_avg_cost_per_lpv!=null ? currency+' '+bm.outcome_traffic_avg_cost_per_lpv.toFixed(2) : '—' },
        { label: 'Avg click\u2192LPV', val: bm.outcome_traffic_avg_cr_links!=null ? bm.outcome_traffic_avg_cr_links.toFixed(2)+'%' : '—' },
        { label: 'Total spend',      val: bm.outcome_traffic_total_spend!=null ? currency+' '+Math.round(bm.outcome_traffic_total_spend).toLocaleString() : '—' },
      ],
      primaryMetric: 'ctr',
      primaryFmt: v => v!=null ? v.toFixed(2)+'%' : '—',
      goodDirection: 'up',
    },
    'OUTCOME_AWARENESS': {
      label: 'Outcome — Awareness',
      kpis: [
        { label: 'Avg CPM',   val: bm.outcome_awareness_avg_cpm  !=null ? currency+' '+bm.outcome_awareness_avg_cpm.toFixed(2)                   : '—' },
        { label: 'Total reach', val: bm.outcome_awareness_total_reach!=null ? Math.round(bm.outcome_awareness_total_reach).toLocaleString()       : '—' },
        { label: 'Total spend', val: bm.outcome_awareness_total_spend!=null ? currency+' '+Math.round(bm.outcome_awareness_total_spend).toLocaleString() : '—' },
      ],
      primaryMetric: 'cpm',
      primaryFmt: v => v!=null ? currency+' '+v.toFixed(2) : '—',
      goodDirection: 'down',
    },
  };

  const ORDER = ['OUTCOME_SALES','APP_INSTALLS','OUTCOME_LEADS','OUTCOME_ENGAGEMENT','OUTCOME_TRAFFIC','OUTCOME_AWARENESS'];

  ORDER.forEach(objKey => {
    const t = triage[objKey];
    if (!t || (t.critical===0 && t.slipping===0 && t.healthy===0)) return;
    const cfg = OBJ_CONFIG[objKey];
    if (!cfg) return;

    // Campaigns for this objective
    const objCampaigns = Object.values(all).filter(c => c.objective === objKey);

    // ── KPI strip ──────────────────────────────────────────────────────
    const kpiCells = cfg.kpis.map(kpi => {
      const val = kpi.fn ? kpi.fn() : (kpi.val || '—');
      let cls = 'objective-kpi-value';
      if (kpi.good) cls += kpi.good(val) ? ' stat-value-good' : ' stat-value-bad';
      return `<div class="objective-kpi-cell">
        <div class="${cls}">${val}</div>
        <div class="objective-kpi-label">${kpi.label}</div>
      </div>`;
    }).join('');

    // ── Triage badges ──────────────────────────────────────────────────
    const triageBadges = [
      t.critical ? `<span class="badge badge-critical">${t.critical} Critical</span>` : '',
      t.slipping ? `<span class="badge badge-slipping">${t.slipping} Slipping</span>` : '',
      t.healthy  ? `<span class="badge badge-healthy">${t.healthy} Healthy</span>`  : ''
    ].join('');

    // ── Findings scoped to this objective ──────────────────────────────
    const criticals = objCampaigns.filter(c => c.verdict==='CRITICAL').sort((a,b)=>b.spend-a.spend);
    const healthies = objCampaigns.filter(c => c.verdict==='HEALTHY').sort((a,b)=>b[cfg.primaryMetric]-a[cfg.primaryMetric]);

    let findingsHtml = '';

    // Finding 1 — money losing / underperforming (portfolio-level; multi-campaign only)
    if (multi && criticals.length) {
      const totalSpend = criticals.reduce((s,c)=>s+c.spend,0);
      let rows = criticals.slice(0,3).map(c => {
        const metricVal = cfg.primaryFmt(c[cfg.primaryMetric]);
        const isGood = cfg.goodDirection==='up' ? (c[cfg.primaryMetric]||0)>=1 : false;
        return `<div class="finding-row">
          <span class="finding-name" title="${c.name}">${c.name?.split(/[-_]/)[0]||'—'}</span>
          <span class="finding-metric">${currency} ${Math.round(c.spend).toLocaleString()}</span>
          <span class="finding-value finding-value-bad">${metricVal}</span>
        </div>`;
      }).join('');
      if (criticals.length > 3) rows += `<div class="finding-row-more">+ ${criticals.length-3} more</div>`;
      findingsHtml += `<div class="finding-card finding-card-bad">
        <div class="finding-headline">${criticals.length} campaign${criticals.length>1?'s':''} critical — ${currency} ${Math.round(totalSpend).toLocaleString()} at risk</div>
        <div class="finding-rows">${rows}</div>
      </div>`;
    }

    // Finding 2 — what's working (portfolio-level; multi-campaign only)
    if (multi && healthies.length) {
      const totalRev = healthies.reduce((s,c)=>s+(c.result_values||0),0);
      let rows = healthies.slice(0,3).map(c => `<div class="finding-row">
        <span class="finding-name" title="${c.name}">${c.name?.split(/[-_]/)[0]||'—'}</span>
        <span class="finding-metric">${currency} ${Math.round(c.spend).toLocaleString()}</span>
        <span class="finding-value finding-value-good">${cfg.primaryFmt(c[cfg.primaryMetric])}</span>
      </div>`).join('');
      if (healthies.length > 3) rows += `<div class="finding-row-more">+ ${healthies.length-3} more</div>`;
      const revNote = totalRev > 0 ? ` — ${currency} ${Math.round(totalRev).toLocaleString()} attributed` : '';
      findingsHtml += `<div class="finding-card finding-card-good">
        <div class="finding-headline">${healthies.length} campaign${healthies.length>1?'s':''} healthy${revNote}</div>
        <div class="finding-rows">${rows}</div>
      </div>`;
    }

    // Finding 3 — audience saturation (scoped to this objective's campaigns)
    const objCampaignIds = new Set(Object.keys(all).filter(id => all[id].objective === objKey));
    const saturated = [];
    Object.entries(cd).forEach(([cid, c]) => {
      if (!objCampaignIds.has(cid)) return;
      Object.entries(c.c2Series||{}).forEach(([adsetId, adset]) => {
        if (adset.threeWayVerdict === 'AUDIENCE_SATURATION')
          saturated.push({...adset, id: adsetId});
      });
    });
    if (saturated.length) {
      let rows = saturated.slice(0,3).map(as => `<div class="finding-row">
        <span class="finding-name">${(as.name||'Ad set').split(/[-_]/)[0]}</span>
        <span class="finding-metric">Freq ${as.frequencyEnd?.toFixed(2)||'—'}x</span>
        <span class="finding-value finding-value-amber">CPM ${(as.cpmStart||0).toFixed(2)}→${(as.cpmEnd||0).toFixed(2)}</span>
      </div>`).join('');
      if (saturated.length > 3) rows += `<div class="finding-row-more">+ ${saturated.length-3} more</div>`;
      findingsHtml += `<div class="finding-card finding-card-amber">
        <div class="finding-headline">Audience saturation in ${saturated.length} ad set${saturated.length>1?'s':''}</div>
        <div class="finding-rows">${rows}</div>
      </div>`;
    }

    // Finding 4 — creative diagnosis (scoped to this objective's campaigns)
    // Only ads with a real D2 classification are surfaced; INDETERMINATE (no daily-trend
    // data pulled) ads are excluded from the report entirely.
    const objAds = [];
    Object.entries(cd).forEach(([cid, c]) => {
      if (!objCampaignIds.has(cid)) return;
      (c.d1Ads||[]).forEach(ad => { if (ad.d2Classification && ad.d2Classification !== 'INDETERMINATE') objAds.push(ad); });
    });
    if (objAds.length) {
      const fatigued = objAds.filter(a=>a.d2Classification==='FATIGUE_CONFIRMED').length;
      const poor     = objAds.filter(a=>a.d2Classification==='POOR_QUALITY').length;
      if (fatigued + poor > 0) {
        const worst = [...objAds].sort((a,b)=>b.spend-a.spend).slice(0,3);
        let rows = worst.map(ad => `<div class="finding-row">
          <span class="finding-name">${(ad.name||'Ad').slice(0,28)}</span>
          <span class="finding-metric">${currency} ${Math.round(ad.spend||0).toLocaleString()}</span>
          <span class="finding-value finding-value-amber">${(ad.d2Classification||'—').replace(/_/g,' ').toLowerCase()}</span>
        </div>`).join('');
        findingsHtml += `<div class="finding-card finding-card-amber">
          <div class="finding-headline">${objAds.length} analysed ads — ${fatigued} fatigue confirmed · ${poor} poor quality</div>
          <div class="finding-rows">${rows}</div>
        </div>`;
      }
    }

    // ── Assemble objective block ───────────────────────────────────────
    container.insertAdjacentHTML('beforeend', `
      <div class="objective-block">
        <div class="objective-block-header">
          <span class="objective-block-label">${cfg.label}</span>
          <div class="objective-triage">${triageBadges}</div>
        </div>
        ${multi ? `<div class="objective-kpi-strip">${kpiCells}</div>` : ''}
        ${findingsHtml ? `<div class="objective-findings">${findingsHtml}</div>` : ''}
      </div>`);
  });
}

/* ════════════════════════════════════════════════════════════════════════════
   CAMPAIGN BUILDER
   ════════════════════════════════════════════════════════════════════════ */

// Display labels for the campaign verdict. LOGIC/keys stay HEALTHY|SLIPPING|CRITICAL;
// only the words shown to the reader change (Healthy / Requires attention / Unhealthy).
function verdictLabel(v){switch(v){case 'HEALTHY':return 'Healthy';case 'SLIPPING':return 'Requires attention';case 'CRITICAL':return 'Unhealthy';case 'INSUFFICIENT_DATA':return 'Insufficient data';default:return (v||'').replace('_',' ');}}
function verdictClause(v){switch(v){case 'HEALTHY':return 'is <strong>Healthy</strong>';case 'SLIPPING':return '<strong>requires attention</strong>';case 'CRITICAL':return 'is <strong>Unhealthy</strong>';case 'INSUFFICIENT_DATA':return 'has <strong>insufficient data</strong>';default:return 'is <strong>'+((v||'').replace('_',' '))+'</strong>';}}
function verdictBadgeClass(verdict) {
  switch (verdict) {
    case 'CRITICAL':         return 'badge-critical';
    case 'SLIPPING':         return 'badge-slipping';
    case 'HEALTHY':          return 'badge-healthy';
    case 'INSUFFICIENT_DATA': return 'badge-insufficient';
    default:                  return 'badge-insufficient';
  }
}

function campaignWindowPills(camp, allCamp, currency) {
  const metrics = threeMetricsForObjective(effectiveObjective(camp) || allCamp?.objective || 'OUTCOME_SALES');
  const b2 = camp.b2Series || [];
  const snap = camp.b1Snapshot || {};
  const b2SumField = (arr, f) => { let s = null; arr.forEach(r => { if (r[f] != null) s = (s || 0) + r[f]; }); return s; };
  const spendW = snap.spend != null ? snap.spend
               : (camp.spend != null ? camp.spend : (allCamp?.spend != null ? allCamp.spend : null));
  const resW   = snap.results != null ? snap.results
               : (allCamp?.results != null ? allCamp.results
               : (allCamp?.purchases != null ? allCamp.purchases
               : b2SumField(b2, 'results')));
  let roasW = snap.roas;
  if (roasW == null) {
    const revW = snap.result_values != null ? snap.result_values : b2SumField(b2, 'result_values');
    if (revW != null && spendW) { roasW = revW / spendW; }
    else {
      let rv = 0, sp = 0; b2.forEach(r => { if (r.roas != null && r.spend != null) { rv += r.roas * r.spend; sp += r.spend; } });
      roasW = sp > 0 ? rv / sp : null;
    }
  }
  const cprW = (spendW != null && resW) ? (spendW / resW) : null;

  let metricsHTML = '';
  metrics.forEach(m => {
    if (m.field === 'results') {
      const valStr = resW != null ? Math.round(resW).toLocaleString() : '\u2014';
      metricsHTML += `<div class="metric-pill">
        <div class="metric-pill-value metric-neutral">${valStr}</div>
        <div class="metric-pill-label">${m.label}</div>
      </div>`;
    } else {
      let aggVal = null;
      if (m.field === 'roas') aggVal = roasW;
      else if (m.field === 'cpr') aggVal = cprW;
      else if (snap[m.field] != null) aggVal = snap[m.field];   // b1Snapshot = true window aggregate (e.g. link CTR)
      else if (m.field === 'ctr') { const lc = b2SumField(b2,'link_clicks'), im = b2SumField(b2,'impressions'); aggVal = (im ? lc/im*100 : null); }
      else if (m.field === 'cvr') { const rs = b2SumField(b2,'results'),     lc = b2SumField(b2,'link_clicks'); aggVal = (lc ? rs/lc*100 : null); }
      else if (m.field === 'cpm') { const sp = b2SumField(b2,'spend'),       im = b2SumField(b2,'impressions'); aggVal = (im ? sp/im*1000 : null); }
      else { const l = b2Last(b2, m.field), f = b2First(b2, m.field); aggVal = (l != null ? l : f); }   // last-resort daily
      const vStr = aggVal != null ? fmt(aggVal, m.fmt, currency) : '\u2014';
      metricsHTML += `<div class="metric-pill">
        <div class="metric-pill-value metric-neutral">${vStr}</div>
        <div class="metric-pill-label">${m.label} (window)</div>
      </div>`;
    }
  });
  return { pillsHTML: metricsHTML, spendW, resW, roasW, cprW };
}

function buildCollapsedRow(id, camp, allCamp, currency) {
  const metricsHTML = campaignWindowPills(camp, allCamp, currency).pillsHTML;

  const verdict = camp.verdict || allCamp?.verdict || 'INSUFFICIENT_DATA';
  const badgeCls = verdictBadgeClass(verdict);
  const campName = camp.name || (allCamp && allCamp.name ? decodeName(allCamp.name) : null) || id;
  const objective = effectiveObjective(camp) || allCamp?.objective || '';
  const spend = camp.spend || allCamp?.spend || 0;
  const adCount = camp.adCount || 0;
  const adSetCount = camp.adSetCount || 0;

  return `<div class="collapsed-row" onclick="toggleCampaign('${id}')">
    <span class="chevron" id="chev-${id}">▶</span>
    <div class="campaign-name-block">
      <div class="campaign-name">
        ${campName}
        <a class="ams-link" href="${amsUrl('campaign', id)}" target="_blank" onclick="event.stopPropagation()">Open</a>
      </div>
      <div class="campaign-meta">
        <span class="obj-tag">${objective}</span>
        &nbsp;·&nbsp;${currency} ${spendTxt(spend)}
        ${adCount ? `&nbsp;·&nbsp;${adCount} ads` : ''}
        ${adSetCount ? `&nbsp;·&nbsp;${adSetCount} ad sets` : ''}
      </div>
    </div>
    <span class="badge ${badgeCls}">${verdictLabel(verdict)}</span>
    <div class="metrics-strip">${metricsHTML}</div>
  </div>`;
}

// Biggest problems (single-campaign Overview triage): underperforming ad sets AND ads,
// interleaved and ranked by SPEND AT RISK (spend tied up in an underperforming entity),
// highest first. Ad sets rank above ads on a tie. Each row is a one-line diagnosis with a
// jump button into its specialist tab. Only genuine underperformers are listed.
// Overview logbook: the campaign's pressing problems, each with a render-time recommendation
// DERIVED FROM THE SAME DIAGNOSIS the deep-dive tabs use, so a problem and its recommendation
// can never contradict the rest of the report. Three tiers:
//   (1) ad-level money-bleed  — ads failing the bottom-funnel rule (matches Ads Analysis), by wasted spend
//   (2) ad-set/audience       — ad sets flagged `underperform` (matches Adset Analysis), + saturation read
//   (3) campaign-level        — a single post-click entry when that is the root cause
// The grand total sums AD-LEVEL wasted spend only (ad-set/campaign entries are diagnostic angles,
// not re-counted dollars) to avoid the parent/child double-count.
function buildLogbook(id, camp, currency) {
  const bm = (window.REPORT_DATA && window.REPORT_DATA.accountData && window.REPORT_DATA.accountData.benchmarks) || {};
  const _cpKeyLB = ({OUTCOME_SALES:'outcome_sales_avg_cpr',OUTCOME_LEADS:'outcome_leads_avg_cpl',OUTCOME_ENGAGEMENT:'outcome_engagement_avg_cpe',OUTCOME_TRAFFIC:'outcome_traffic_avg_cost_per_lpv',LINK_CLICKS:'outcome_traffic_avg_cost_per_link_click',APP_INSTALLS:'app_installs_avg_cpi',OUTCOME_AWARENESS:'outcome_awareness_avg_cpm'})[effectiveObjective(camp)] || 'outcome_sales_avg_cpr';
  const benchCPR  = bm[_cpKeyLB] != null ? bm[_cpKeyLB] : null;
  const roasBench = bm.outcome_sales_avg_roas != null ? bm.outcome_sales_avg_roas : null;
  const gate      = benchCPR != null ? benchCPR : 0;
  const windowCpr = (camp.b1Snapshot && camp.b1Snapshot.cpr != null) ? camp.b1Snapshot.cpr : null;
  const cvrBench  = acctCrLinks(camp);   // account-average CR from links for this objective (NOT the campaign average)
  const ctrBench  = campAggCtr(camp);   // account-average link CTR for the objective (falls back to campaign aggregate)
  const c2        = camp.c2Series || {};
  const sa2       = camp.stageAnalysis?.stage2 || {};
  const verdict   = camp.verdict;   // recomputed at render time by computeVerdict()
  const money = v => { const n = Math.abs(v||0); return `${currency} ${n < 100 ? (v||0).toFixed(2) : Math.round(v||0).toLocaleString()}`; };
  // Objective-flexible wording: result noun ("purchase"/"lead"/…), cost-per-result label,
  // and whether a ROAS column applies. Everything below reads from L instead of hardcoding sales.
  const L = objectiveLabels(effectiveObjective(camp));
  const noun = n => (n === 1 ? L.noun : L.nounPlural);

  const adsetName = {};
  (camp.c1Adsets || []).forEach(as => { adsetName[as.id] = as.name || as.id; });

  // Best-performing ad (clears the bottom-funnel rule with the most results) — named in
  // "redirect budget to…" recommendations so the advice points somewhere concrete.
  let best = null;
  (camp.d1Ads || []).forEach(ad => {
    const spend = ad.spend || 0; if (spend < gate) return;
    const purch = ad.purchases || 0; if (purch <= 0) return;
    const acpr = spend / purch;
    const cvrOK = (cvrBench != null && ad.cvr != null) ? (ad.cvr >= cvrBench) : false;
    const cprOK = (windowCpr != null) ? (acpr <= windowCpr) : false;
    if (!(cvrOK && cprOK)) return;
    if (!best || purch > best.purch) {
      let bn = ad.name || ad.id; const bc = bn.indexOf(' \u00b7 ad set'); if (bc > -1) bn = bn.slice(0, bc);
      best = { name: bn, purch, acpr };
    }
  });
  const redirectTo = best
    ? `your best performer, ${best.name} (${best.purch} ${noun(best.purch)} at ${money(best.acpr)} ${L.costLabel.toLowerCase()})`
    : `an ad that is converting`;

  // ── TIER 1: ad-level money-bleed (same rule as Ads Analysis bottom-funnel) ──
  const adItems = [];
  (camp.d1Ads || []).forEach(ad => {
    const spend = ad.spend || 0;
    if (spend <= 0) return;                            // never list zero/negative-spend ads
    if (ad.d2Classification === 'INDETERMINATE') return; // no daily-trend data -> excluded (only D2-classified ads render)
    if (spend < gate) return;                          // below ~1× account CPR: too small to judge
    const purch = ad.purchases || 0;
    const acpr  = purch > 0 ? spend / purch : Infinity;
    const cvrOK = (cvrBench != null && ad.cvr != null) ? (ad.cvr >= cvrBench) : false;
    const cprOK = (windowCpr != null) ? (acpr <= windowCpr) : false;
    if (cvrOK && cprOK) return;                        // performing → NOT a problem (matches Ads Analysis)
    const wasted = benchCPR != null ? Math.max(0, spend - purch * benchCPR) : spend;

    const why = [`${money(spend)} spent \u2192 ${purch} ${noun(purch)}`];
    // Top-funnel read keyed off the SAME classification the Ads Analysis tab uses, so the
    // logbook never says "clicks land" for an ad that tab rates Poor quality (weak CTR).
    const d2 = ad.d2Classification;
    // Top-funnel read is keyed to the SAME classification the Ads Analysis tab shows, so the
    // Overview and Ads tab never disagree (Overview won't call a Stable/fatiguing ad "Poor quality").
    const clicksWeak    = (d2 === 'POOR_QUALITY');
    const clicksHealthy = (d2 === 'STABLE');
    const isFatigue     = (d2 === 'FATIGUE_CONFIRMED' || d2 === 'FATIGUE_POSSIBLE');
    const fatigueLabel  = (d2 === 'FATIGUE_CONFIRMED') ? 'Fatigue confirmed' : 'Possible fatigue';
    const ctrPart = (ad.ctr != null && ctrBench != null)
      ? `link CTR ${ad.ctr >= ctrBench ? 'above' : 'below'} the ${ctrBenchNoun(camp)}`
      : '';
    let rec, recShort = null, recLong = null;
    if (purch === 0) {
      if (clicksWeak) {
        why.push(`Zero ${L.nounPlural}, and link CTR is weak too. ${ctrPart || 'CTR is below the account average'}, flat over the window, and rated Poor quality in Ads Analysis`);
        recShort = `Pause this ad and redirect the budget to ${redirectTo}. It produced no ${L.nounPlural} on ${money(spend)}.`;
        recLong  = `Build a replacement creative. Link CTR sits below the account average, so rotating the same idea will not fix it.`;
        rec = `${recShort} ${recLong}`;
      } else if (isFatigue) {
        why.push(`Zero ${L.nounPlural}, and link CTR is fatiguing. It declined over the window${ctrPart ? ` (${ctrPart})` : ''}, and rated ${fatigueLabel} in Ads Analysis`);
        recShort = `Redirect the budget to ${redirectTo} and audit the post-click path. It produced no ${L.nounPlural} on ${money(spend)}.`;
        recLong  = `Refresh or rotate the creative to arrest the CTR decline.`;
        rec = `${recShort} ${recLong}`;
      } else {
        const belowAvg = (ad.ctr != null && ctrBench != null && ad.ctr < ctrBench);
        why.push(!ctrPart
          ? `Zero ${L.nounPlural}: the entire ${money(spend)} produced none`
          : belowAvg
            ? `Zero ${L.nounPlural}. ${ctrPart}, but not fatiguing (stable or rising), so the binding miss is post-click: nothing converted`
            : `Zero ${L.nounPlural}. Clicks arrive (${ctrPart}) but none converted, so the miss is post-click`);
        rec = `Pause this ad and audit its offer and landing page before spending more: ${belowAvg ? 'link CTR is below the account average but not fatiguing, and nothing converts' : 'clicks arrive but nothing converts'} on ${money(spend)}. Redirect the budget to ${redirectTo}.`;
      }
    } else if (benchCPR != null && acpr > benchCPR && !cvrOK) {
      if (clicksWeak) {
        why.push(`Weak on both funnels. ${ctrPart || 'CTR is below the account average'}, and CR from links is below the ${crBenchNoun(camp)}. Rated Poor quality`);
        why.push(`${L.costLabel} ${money(acpr)}, ${Math.round(acpr / benchCPR)}\u00d7 the ${money(benchCPR)} account average`);
        recShort = `Move the budget to ${redirectTo} and audit the landing page and offer in parallel.`;
        recLong  = `Replace the creative. This ad is below the CTR account average and doesn't convert, so a refresh won't save it.`;
        rec = `${recShort} ${recLong}`;
      } else {
        why.push(`Clicks land${ctrPart ? ` (${ctrPart})` : ''} but don't convert. CR from links is below the ${crBenchNoun(camp)}`);
        why.push(`${L.costLabel} ${money(acpr)}, ${Math.round(acpr / benchCPR)}\u00d7 the ${money(benchCPR)} account average`);
        rec = `Clicks land but don't convert: cut spend and audit the post-click path (landing page, offer, product\u2013audience fit). A creative refresh won't close a conversion gap. Move the budget to ${redirectTo}.`;
      }
    } else if (benchCPR != null && acpr > benchCPR) {
      why.push(`${L.costLabel} ${money(acpr)}, ${Math.round(acpr / benchCPR)}\u00d7 the ${money(benchCPR)} account average`);
      rec = `Reduce or reallocate spend. ${L.costLabel.toLowerCase()} is well above the account average. Shift budget toward ${redirectTo}.`;
    } else {
      why.push(`CR from links below the ${crBenchNoun(camp)}, under-converting`);
      rec = `Audit the post-click path. Conversion rate is below the account average even though cost is contained.`;
    }

    let nm = ad.name || ad.id;
    const cut = nm.indexOf(' \u00b7 ad set');
    if (cut > -1) nm = nm.slice(0, cut);
    const adRoas = (ad.result_values != null && spend > 0) ? ad.result_values / spend : null;
    const adCpr  = purch > 0 ? spend / purch : null;
    const metrics = {
      spend, cpr: adCpr, cr: ad.cvr != null ? ad.cvr : null, roas: adRoas,
      cprBad:  adCpr != null && benchCPR != null && adCpr > benchCPR,
      crBad:   ad.cvr != null && cvrBench != null && ad.cvr < cvrBench,
      roasBad: adRoas != null && roasBench != null && adRoas < roasBench,
    };
    // Horizon must match the action the recommendation asks for: in-platform moves (pause, cut,
    // redirect) are SHORT; anything requiring new creative is LONG; a rec asking for both is BOTH.
    const adHorizon = recLong ? (recShort ? 'BOTH' : 'LONG') : 'SHORT';
    adItems.push({ kind:'ad', name:nm, context: adsetName[ad.adset_id] || null, metric: wasted, metricLabel:'wasted', why, rec, recShort, recLong, horizon:adHorizon, jump:3, metrics });
  });
  const _hRank = h => (h === 'BOTH' ? 0 : h === 'LONG' ? 1 : 2);
  adItems.sort((a,b) => _hRank(a.horizon) - _hRank(b.horizon) || b.metric - a.metric);
  if (adItems.length > 6) adItems.length = 6;           // triage logbook: cap at the 6 worst, ranked desc
  const adTotal = adItems.reduce((s,x)=>s+(x.metric||0),0);

  // ── TIER 2: ad-set / audience issues (same `underperform` flag + delivery diagnosis as Adset Analysis) ──
  // Diagnosis text prefers the ad set's authoritative explanationNote (it reconciles the raw
  // day-1→day-N movements with the verdict — e.g. a CPM tick or reach drop that is budget taper,
  // not saturation). Fallbacks are worded so they never overclaim "all stable" against the
  // numbers shown. Verdict badge mirrors the three-way verdict from the Adset Analysis tab.
  const verdictBadge = {
    'AUDIENCE_SATURATION':'AUDIENCE SATURATION',
    'CREATIVE_FATIGUE_LIKELY':'CREATIVE FATIGUE LIKELY',
    'RELEVANCE_LIMITED':'LOW AD RELEVANCE',
    'EXTERNAL_AUCTION_PRESSURE':'EXTERNAL AUCTION PRESSURE',
    'HEALTHY_DELIVERY':'DELIVERY CLEAN'
  };
  const verdictFallback = {
    'AUDIENCE_SATURATION':'Frequency climbing while reach shrinks. The audience pool is exhausting (the same accounts are being recycled).',
    'CREATIVE_FATIGUE_LIKELY':'Frequency rising with CPM stable. The audience is still reachable, and the creative is wearing out.',
    'RELEVANCE_LIMITED':'CPM rising while frequency stays low. With a below-average link CTR the driver is low ad relevance (the auction prices low-engagement impressions higher), a creative cost problem, not the audience.',
    'EXTERNAL_AUCTION_PRESSURE':'CPM climbing while frequency stays flat, and link CTR is at/above the account average. That points to external auction competition, not the audience or creative.',
    'HEALTHY_DELIVERY':'Delivery mechanics don\u2019t explain the miss. Frequency stays low (no audience saturation) and cost/reach moves are minor or budget-driven. The bottleneck is creative or post-click, not the audience.'
  };
  const money2 = v => `${currency} ${(v||0).toFixed(2)}`;                 // CPM needs decimals
  const cleanBench = s => (s||'').replace(/account benchmark/gi,'account average').replace(/benchmark/gi,'account average');
  const adsetItems = [];
  (camp.c1Adsets || []).filter(as => as && as.underperform).forEach(as => {
    const s = c2[as.id] || {};
    const v = s.threeWayVerdict;
    const breached = normMarkers(as.breachedMarkers);
    const purch = (as.purchases != null ? as.purchases : as.results);
    const why = [];

    // 1) Outcome vs account average — which metrics breached, with the values.
    //    Breached-marker names are mapped to objective-appropriate labels; ROAS is dropped for
    //    non-revenue objectives.
    const breachedLabels = breached.map(L.markerLabel).filter(Boolean);
    const roasPart = L.hasRoas ? `ROAS ${as.roas!=null?as.roas.toFixed(2)+'x':'\u2014'} \u00b7 ` : '';
    why.push(`${breachedLabels.length} below account average${breachedLabels.length?` (${breachedLabels.join(', ')})`:''} \u2014 ${roasPart}${L.costLabel} ${as.cost_per_result!=null?money(as.cost_per_result):'\u2014'} \u00b7 CR from links ${as.cvr!=null?fmtCvr(as.cvr):'\u2014'}${purch!=null?` on ${purch} ${noun(purch)}`:''}`);

    // 2) Delivery mechanism — the frequency / CPM / reach numbers the verdict is read from
    //    (shown as day-1 → day-N facts; the diagnosis below interprets them).
    if (s.frequencyStart != null || s.cpmStart != null || s.reachStart != null) {
      why.push(`Delivery (day 1 \u2192 day ${(camp.b2Series||[]).length||'N'}): frequency ${(s.frequencyStart||0).toFixed(2)}\u2192${(s.frequencyEnd||0).toFixed(2)} \u00b7 CPM ${money2(s.cpmStart)}\u2192${money2(s.cpmEnd)} \u00b7 reach ${Math.round(s.reachStart||0).toLocaleString()}\u2192${Math.round(s.reachEnd||0).toLocaleString()}`);
    }

    // 3) Diagnosis — authoritative note if present, else a verdict-consistent fallback
    const diag = (s.explanationNote && s.explanationNote.trim()) ? cleanBench(s.explanationNote.trim()) : (verdictFallback[v] || 'Delivery under analysis.');
    why.push(`Diagnosis: ${diag}`);

    let rec;
    if (v === 'AUDIENCE_SATURATION') rec = `Expand the audience. The pool is exhausting: frequency is rising and the same accounts keep coming back. Broaden targeting or add new audiences before you refresh creative.`;
    else if (v === 'CREATIVE_FATIGUE_LIKELY') rec = `Refresh the creative in this ad set. Frequency is rising while CPM holds steady, so the ads are wearing out on an audience that's still reachable.`;
    else if (v === 'RELEVANCE_LIMITED') rec = `The rising CPM tracks the below-average link CTR: low ad relevance is inflating the price per impression. Lift CTR with a stronger creative, not bids or re-targeting. The audience isn't saturated.`;
    else if (v === 'EXTERNAL_AUCTION_PRESSURE') rec = `Rising CPM is auction competition, not the audience. Revisit bids and budget, or shift spend toward lower-cost placements. The audience is fine.`;
    else if (v === 'HEALTHY_DELIVERY') {
      const crAbove = (as.cvr != null && cvrBench != null && as.cvr >= cvrBench);
      rec = crAbove
        ? `Delivery is clean and clicks convert above the ${crBenchNoun(camp)}, so it isn't the audience or post-click. The shortfall is creative efficiency: CTR clears the account average but sits below the campaign's own level. Refresh the creative to lift CTR.`
        : `Delivery is clean, so don't touch the audience. The shortfall is creative or post-click. Refresh the creative and audit the landing page and offer for this ad set's ads.`;
    }
    else rec = `Reallocate budget away from this ad set until its breached metrics${breachedLabels.length?` (${breachedLabels.join(', ')})`:''} recover.`;

    const metrics = {
      spend: as.spend != null ? as.spend : null,
      cpr: as.cost_per_result != null ? as.cost_per_result : null,
      cr: as.cvr != null ? as.cvr : null,
      roas: as.roas != null ? as.roas : null,
      cprBad: breached.includes('CPR'), crBad: breached.includes('CVR'), roasBad: breached.includes('ROAS'),
    };
    // Lean card: one qualitative causal chain (problem -> mechanism -> outcome). Exact figures live in the metric pills + Adset Analysis.
    const _crAbove = (as.cvr != null && cvrBench != null && as.cvr >= cvrBench);
    const _cl = L.costLabel.toLowerCase();
    const leanChain = ({
      'RELEVANCE_LIMITED': `link CTR is below account average, which pushes CPM up, so ${_cl} lands above the account benchmark. Clicks still convert fine.`,
      'EXTERNAL_AUCTION_PRESSURE': `auction competition is lifting CPM, so ${_cl} runs above the account benchmark. Audience and frequency are healthy.`,
      'AUDIENCE_SATURATION': `frequency rising as the pool exhausts pushes CPM up, so ${_cl} runs above the account benchmark.`,
      'CREATIVE_FATIGUE_LIKELY': `frequency rising with CTR decaying (stale creative), so ${_cl} runs above the account benchmark.`,
    })[v] || (_crAbove
      ? `converts above account, but a below-norm CTR makes clicks pricey, so ${_cl} runs above the account benchmark.`
      : `delivery is clean but clicks don\u2019t convert. CR is below account average, so the gap is the creative or the offer, not the audience.`);
    const horizon = (v==='EXTERNAL_AUCTION_PRESSURE' || (v==='HEALTHY_DELIVERY' && !_crAbove)) ? 'SHORT' : 'LONG';
    adsetItems.push({ kind:'adset', name: as.name || as.id, context:null, tag: verdictBadge[v] || null, metric: as.spend || 0, metricLabel:'spend', why:[leanChain], horizon, rec, jump:2, metrics });
  });
  adsetItems.sort((a,b) => (a.horizon==='SHORT'?0:1)-(b.horizon==='SHORT'?0:1) || b.metric - a.metric);

  // ── TIER 3: campaign-level post-click (only when that's the diagnosed root cause) ──
  const campItems = [];
  if (sa2.rootCause === 'POST_CLICK') {
    const snap = camp.b1Snapshot || {};
    // Campaign aggregates: fall back to summing the spending ads when no snapshot is stored.
    let aggSpend=0, aggClicks=0, aggRes=0, haveAgg=false;
    (camp.d1Ads||[]).forEach(a=>{ if((a.spend||0)>0){ haveAgg=true; aggSpend+=(a.spend||0); aggClicks+=(a.link_clicks||0); aggRes+=(a.results!=null?a.results:0); } });
    const cRoas = snap.roas != null ? snap.roas : (camp.roas != null ? camp.roas : null);
    let cCr = snap.cvr != null ? snap.cvr : (camp.cvr != null ? camp.cvr : null);
    if (cCr == null && haveAgg && aggClicks > 0) cCr = aggRes / aggClicks * 100;   // 0 leads / 1,965 link clicks = 0%
    const cCpr  = snap.cpr  != null ? snap.cpr  : null;
    const cSpend = snap.spend != null ? snap.spend : (haveAgg ? aggSpend : null);
    const crBenchLB = acctCrLinks(camp);   // account-average CR from links (0.068% for leads)
    const crProvLB  = acctCrLinksProvisional(camp);
    const metrics = {
      spend: cSpend, cpr: cCpr, cr: cCr, roas: cRoas,
      cprBad:  cCpr != null && benchCPR != null && cCpr > benchCPR,
      crBad:   cCr  != null && crBenchLB != null && cCr  < crBenchLB,
      roasBad: cRoas != null && roasBench != null && cRoas < roasBench,
    };
    campItems.push({
      kind:'campaign', name:'Campaign-wide post-click conversion failure', context:null, metric:null, metricLabel:'', metrics,
      why:[`Clicks arrive but convert below the ${crBenchLB!=null?fmtCvr(crBenchLB):'—'} account average across the whole campaign${crProvLB?' (provisional, based on few account-wide conversions)':''}. The drop-off is after the click, not in the ads.`],
      rec:`Audit the landing page, checkout flow and offer for the whole campaign, and verify the fix directly \u2014 Meta can't see post-click events here, so new creative alone won't close a post-click gap.`,
      horizon:'LONG', jump:3
    });
  } else if (verdict !== 'HEALTHY' && (camp.b1Snapshot || (camp.d1Ads && camp.d1Ads.length)) && sa2.rootCause) {
    // Campaign-level read for a non-healthy campaign: volume vs expected + the binding efficiency constraint.
    const snap = camp.b1Snapshot || {};
    let aggSpend=0, aggClicks=0, aggRes=0, aggImpr=0, haveAgg=false;
    (camp.d1Ads||[]).forEach(a=>{ if((a.spend||0)>0){ haveAgg=true; aggSpend+=(a.spend||0); aggClicks+=(a.link_clicks||0); aggRes+=(a.purchases!=null?a.purchases:(a.results||0)); aggImpr+=(a.impressions||0);} });
    const cSpend = snap.spend!=null?snap.spend:(haveAgg?aggSpend:null);
    const cClicks= snap.link_clicks!=null?snap.link_clicks:(haveAgg?aggClicks:null);
    const cRes   = snap.results!=null?snap.results:(haveAgg?aggRes:null);
    const cImpr  = snap.impressions!=null?snap.impressions:(haveAgg?aggImpr:null);
    const cRoas  = snap.roas!=null?snap.roas:(camp.roas!=null?camp.roas:null);
    const cCpr   = (cSpend!=null&&cRes)?cSpend/cRes:null;
    const cCtr   = snap.ctr!=null?snap.ctr:((cClicks!=null&&cImpr)?cClicks/cImpr*100:null);
    const cCr    = (cClicks)?cRes/cClicks*100:null;
    const cCpc   = (cClicks)?cSpend/cClicks:null;
    const acctClicks = bm.outcome_sales_total_link_clicks, acctSpend2 = bm.outcome_sales_total_spend;
    const acctCpc = (acctClicks)?acctSpend2/acctClicks:null;
    const crB = acctCrLinks(camp), ctrB = ctrBench;
    const vc = camp._verdictCalc || {};
    const expv = vc.expected!=null ? vc.expected : ((vc.acctCpr && cSpend!=null) ? cSpend/vc.acctCpr : null);
    const why = [];
    // 1) volume vs expected — the verdict driver
    if (expv!=null && cRes!=null) {
      const above = cRes >= expv;
      why.push(`<span class="${above?'sb-good':'sb-bad'}">${cRes} ${noun(cRes)} vs ~${Math.round(expv)} expected</span> at the ${money2(vc.acctCpr||benchCPR)} account-average ${L.costLabel.toLowerCase()} \u2014 ${above?'above':'below'} expected volume.`);
    }
    // 2) conversion / cost standing
    const convOK = (cCr!=null && crB!=null && cCr>=crB);
    const cprOK  = (cCpr!=null && benchCPR!=null && cCpr<=benchCPR*1.02);
    const _cpTxt = (convOK&&cprOK) ? 'Conversion and cost both sit at or above the account average'
                 : (convOK&&!cprOK) ? 'Conversion beats the account average but cost sits above it'
                 : (!convOK&&cprOK) ? 'Cost is at or below the account average but conversion sits below it'
                 : 'Conversion and cost both sit below the account average';
    why.push(`${_cpTxt} \u2014 CR from links ${cCr!=null?fmtCvr(cCr):'\u2014'} vs ${crB!=null?fmtCvr(crB):'\u2014'}, ${L.costLabel} ${cCpr!=null?money2(cCpr):'\u2014'} vs ${benchCPR!=null?money2(benchCPR):'\u2014'}.`);
    // 3) CTR -> click cost
    if (cCtr!=null && ctrB!=null && cCtr<ctrB) {
      const mult = (cCpc!=null&&acctCpc)?(cCpc/acctCpc):null;
      why.push(`Link CTR ${cCtr.toFixed(2)}% is below the ${ctrB.toFixed(2)}% ${ctrBenchNoun(camp)}, so at similar CPMs each click costs ${mult!=null?`~${mult.toFixed(1)}\u00d7 more`:'more'}${(cCpc!=null&&acctCpc)?` (${money2(cCpc)} vs ${money2(acctCpc)})`:''}.`);
    }
    // 4) ROAS consequence
    if (cRoas!=null && roasBench!=null && cRoas<roasBench) {
      why.push(`ROAS ${cRoas.toFixed(2)}x sits below the ${roasBench.toFixed(2)}x account average. Driven by the expensive click, not conversion.`);
    }
    const metrics = {
      spend: cSpend, cpr: cCpr, cr: cCr, roas: cRoas,
      cprBad: cCpr!=null && benchCPR!=null && cCpr>benchCPR,
      crBad:  cCr!=null && crB!=null && cCr<crB,
      roasBad: cRoas!=null && roasBench!=null && cRoas<roasBench,
    };
    const isCritical = verdict==='CRITICAL';
    const nm  = isCritical ? 'Campaign-wide: below expected volume' : 'Campaign-wide: hitting volume, but sub-units underperforming';
    const rec = isCritical
      ? `<div class="rec-hz"><span class="rec-hz-tag rec-short">Short term</span>Reallocate spend off the weakest ad sets and any zero-lead days onto the converting ones now; if efficiency can\u2019t recover, make the reallocation a permanent cut.</div>`
        + `<div class="rec-hz"><span class="rec-hz-tag rec-long">Long term</span>Lift CTR with a stronger creative on the converting ad sets. That's the durable fix for expensive clicks, and it needs a new concept plus a fresh learning phase.</div>`
      : `Volume is above expected, but some ad sets/ads sit below the account average. Mostly a top-of-funnel creative/CTR lever. Fix those (below) to turn the volume into efficient spend.`;
    const _campChain = isCritical
      ? `${cRes} ${noun(cRes)}, against ~${Math.round(expv)} expected. Link CTR is below account average, which drives CPM up and pushes ${L.costLabel.toLowerCase()} above the account benchmark. Conversion itself beats account.`
      : `volume is above expected, but some ad sets and ads run above the account benchmark on ${L.costLabel.toLowerCase()}. That's a top-of-funnel CTR lever, not conversion.`;
    campItems.push({ kind:'campaign', name:nm, context:null, tag:null, metric:null, metricLabel:'', why:[_campChain], rec, horizon:(isCritical?'BOTH':'LONG'), jump:1, metrics });
  }

  if (!adItems.length && !adsetItems.length && !campItems.length) {
    if (verdict === 'HEALTHY') {
      const vc = camp._verdictCalc || {}; const snap = camp.b1Snapshot || {};
      const cCr = (snap.link_clicks) ? (snap.results/snap.link_clicks*100) : null;
      const _cr = acctCrLinks(camp);
      const pos = [];
      if (vc.results!=null && vc.expected!=null) pos.push(`<span class="sb-good">${vc.results} ${noun(vc.results)} vs ~${Math.round(vc.expected)} expected</span> at the ${money2(vc.acctCpr||benchCPR)} account-average ${L.costLabel.toLowerCase()}. Above expected volume.`);
      if (snap.cpr!=null && benchCPR!=null) pos.push(`<span class="${snap.cpr<=benchCPR?'sb-good':''}">${L.costLabel} ${money2(snap.cpr)} vs ${money2(benchCPR)} account average</span> \u2014 ${snap.cpr<=benchCPR?'at/below':'around'} the account average.`);
      if (cCr!=null && _cr!=null) pos.push(`<span class="sb-good">CR from links ${fmtCvr(cCr)} vs ${fmtCvr(_cr)} ${crBenchNoun(camp)}.</span>`);
      if (L.hasRoas && snap.roas!=null && roasBench!=null) pos.push(`<span class="${snap.roas>=roasBench?'sb-good':''}">ROAS ${snap.roas.toFixed(2)}x vs ${roasBench.toFixed(2)}x account average.</span>`);
      pos.push(`Every spending ad set and every delivering ad is at or above the account average. No underperformers.`);
      return `<div class="logbook"><div class="logbook-section">
        <div class="problems-head"><span class="problems-title">What's working</span><span class="problems-sub">above expected volume \u00b7 every ad set and ad performing</span></div>
        <div class="problem-row problem-campaign"><div class="problem-main">
          <div class="problem-name-row"><span class="problem-name">Campaign is healthy</span><span class="problem-kind problem-kind-campaign">Campaign</span></div>
          <ul class="problem-why">${pos.map(b=>`<li>${b}</li>`).join('')}</ul>
          <div class="problem-rec"><span class="problem-rec-tag">\u2192 Keep doing</span>Maintain spend and creative rotation; volume is ahead of expectation and nothing is below the account average. Watch cumulative frequency (${snap.frequency!=null?snap.frequency.toFixed(2):'\u2014'}) as you scale.</div>
        </div></div></div></div>`;
    }
    return `<div class="logbook"><div class="problems-empty">No pressing problems detected. Every ad above the ${money(gate)} spend floor is clearing the account average and no ad set is underperforming. Use Campaign analysis and the deep-dive tabs to keep monitoring.</div></div>`;
  }

  const esc = s => (s||'').replace(/"/g,'&quot;');
  const mMoney = v => v == null ? '\u2014' : `${currency} ${Math.round(v).toLocaleString()}`;
  const mCpr   = v => v == null ? '\u2014' : `${currency} ${v.toFixed(2)}`;
  const mRoas  = v => v == null ? '\u2014' : `${v.toFixed(2)}x`;
  const mCr    = v => v == null ? '\u2014' : fmtCvr(v);
  const cell   = (lbl, val, bad) => `<div class="pm-cell"><span class="pm-val${bad?' pm-bad':''}">${val}</span><span class="pm-lbl">${lbl}</span></div>`;
  const metricsBlock = m => {
    m = m || {};
    return `<div class="problem-metrics">
      ${cell('Spend', mMoney(m.spend), false)}
      ${cell(L.costShort, mCpr(m.cpr), !!m.cprBad)}
      ${cell('CR from links', mCr(m.cr),   !!m.crBad)}
      ${L.hasRoas ? cell('ROAS',  mRoas(m.roas),   !!m.roasBad) : ''}
    </div>`;
  };
  const entryHTML = x => `<div class="problem-row problem-${x.kind}${x.kind==='campaign' && verdict==='CRITICAL' ? ' problem-campaign-critical':''}">
      <div class="problem-main">
        <div class="problem-name-row">
          <span class="problem-kind problem-kind-${x.kind}">${x.kind==='adset'?'Ad set':x.kind==='campaign'?'Campaign':'Ad'}</span>
          <span class="problem-time">12/7/26 3.00am</span>
          <span class="problem-name" title="${esc(x.name)}">${(x.name||'').slice(0,72)}</span>
          ${x.context ? `<span class="problem-context">in ${(x.context||'').slice(0,28)}</span>` : ''}
          ${x.tag ? `<span class="problem-diag">${x.tag}</span>` : ''}
          ${x.horizon ? `<span class="problem-horizon problem-horizon-${x.horizon==='BOTH'?'both':x.horizon.toLowerCase()}">${x.horizon==='SHORT'?'SHORT-TERM':x.horizon==='LONG'?'LONG-TERM':'SHORT + LONG TERM'}</span>` : ''}
        </div>
        <div class="problem-why-line">${(function(){var t=x.why.join(' \u00b7 ');return t?t.charAt(0).toUpperCase()+t.slice(1):'';})()}</div>
        ${(x.recShort && x.recLong)
          ? `<div class="problem-rec"><span class="problem-rec-tag">\u2192 Short term recommendation</span>${x.recShort}</div>`
            + `<div class="problem-rec"><span class="problem-rec-tag">\u2192 Long term recommendation</span>${x.recLong}</div>`
          : `<div class="problem-rec"><span class="problem-rec-tag">\u2192 Recommendation</span>${x.rec}</div>`}
      </div>
      <div class="problem-side">
        <button class="problem-jump" onclick="activateTab('${id}',${x.jump})">${x.jump===2?'Adset Analysis':x.jump===1?'Campaign analysis':'Ads Analysis'} \u2192</button>
        <div class="pill-legend"><span class="lg-swatch"></span>below account average</div>
        ${metricsBlock(x.metrics)}
      </div>
    </div>`;

  const section = (title, sub, items) => items.length ? `<div class="logbook-section">
      ${title?`<div class="problems-head"><span class="problems-title">${title}</span>${sub?`<span class="problems-sub">${sub}</span>`:''}</div>`:''}
      ${items.map(entryHTML).join('')}
    </div>` : '';

  return `<div class="logbook">
    ${section('', '', campItems)}
    ${section('', '', adsetItems)}
    ${section('', '', adItems)}
  </div>`;
}

// TAB 0 — Overview: a triage logbook. One-line verdict + root cause, then the pressing
// problems each with a recommendation directly beneath (see buildLogbook). No charts here —
// the analytical write-up lives in the Campaign analysis tab.
function buildTab1(id, camp, labels, currency) {
  const L    = objectiveLabels(effectiveObjective(camp));   // objective-flexible labels for the verdict line
  const sa2  = camp.stageAnalysis?.stage2 || {};
  const snap = camp.b1Snapshot || {};
  const rcMap = {
    'AUDIENCE':        { label:'Audience health problem',            cls:'audience' },
    'CREATIVE_FATIGUE':{ label:'Creative quality / fatigue problem', cls:'creative' },
    'CREATIVE_POOR_QUALITY':{ label:'Creative quality / fatigue problem', cls:'creative' },
    'POST_CLICK':      { label:'Post-click conversion problem',      cls:'post-click' },
    'COMPOUND':        { label:'Compound: audience + creative', cls:'creative' },
  };
  const rc = rcMap[sa2.rootCause] || { label: sa2.rootCause || 'Under analysis', cls: 'creative' };
  if (sa2.rootCauseLabel) rc.label = sa2.rootCauseLabel;   // explicit override for compound / custom root-cause wording
  if (sa2.rootCauseClass) rc.cls   = sa2.rootCauseClass;   // 'audience' | 'creative' | 'post-click'

  const verdict = camp.verdict || '\u2014';
  const spendTxt = snap.spend != null ? `${currency} ${Math.round(snap.spend).toLocaleString()} spend` : null;
  const cprTxt   = snap.cpr != null ? `${currency} ${snap.cpr.toFixed(2)} ${L.costLabel.toLowerCase()}` : null;
  const _vc = camp._verdictCalc || {};
  const _oL = objectiveLabels(effectiveObjective(camp));
  const volTxt = (_vc.results!=null && _vc.expected!=null)
    ? `. ${_vc.results} ${_oL.nounPlural} ${_vc.results>=_vc.expected?'above':'below'} the ~${Math.round(_vc.expected)} expected at the account-average ${_oL.costLabel.toLowerCase()}${_vc.key==='SLIPPING'?', but some ad sets or ads are below the account average':(_vc.key==='HEALTHY'?', with every ad set and ad performing':'')}`
    : '';
  const verdictLine = `This campaign ${verdictClause(verdict)}${spendTxt?` on ${spendTxt}`:''}${cprTxt?` at ${cprTxt}`:''}${volTxt}.`;

  return `
    <div class="overview-verdict verdict-${(verdict||'').toLowerCase()}">${verdictLine}</div>
    <div class="root-cause-label ${rc.cls}"><strong>Root cause: </strong>${rc.label}</div>
    ${buildLogbook(id, camp, currency)}
  `;
}

// TAB 1 — Campaign analysis: the analytical write-up (former Overview minus Most Pressing /
// Priority actions). Verdict prose, the primary-metric trend chart, spend context, metric
// prose, seasonality, and the go-deeper signposts. NOTE: this computes seasonality onto
// `camp`, so buildCampaign must call it BEFORE buildTab2 (which reads camp.seasonality).
function buildCampaignAnalysis(id, camp, labels, currency) {
  const b2   = camp.b2Series || [];
  const obj  = effectiveObjective(camp);
  const snap = camp.b1Snapshot || {};

  const pmCfg = primaryMetricConfig(obj);
  const seasonality = computeSeasonality(b2, pmCfg.field);
  if (!camp.seasonality) camp.seasonality = seasonality;
  const seasonalityHourly = computeSeasonalityHourly(camp.hourlySeries, pmCfg.field, b2.length);
  if (!camp.seasonalityHourly) camp.seasonalityHourly = seasonalityHourly;
  const seasonalityCollapsible = `
    <div class="seasonality-collapsible">
      <div class="seas-heading">Seasonality: day-of-week &amp; hour-of-day</div>
      <div class="seas-body">
        <div class="seas-tabs">
          <button class="seas-tab active" onclick="seasonalityView(this,'daily')">Daily</button>
          <button class="seas-tab" onclick="seasonalityView(this,'hourly')">Hourly</button>
        </div>
        <div class="seasonality-view" data-view="daily">${seasonalityHTML(seasonality, pmCfg.fmt, currency)}</div>
